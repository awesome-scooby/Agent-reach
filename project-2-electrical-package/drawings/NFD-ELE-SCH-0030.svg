<text x="711" y="126" class="t t9 mid">QUINT4 24 V DC 20 A</text>
<text x="711" y="138" class="t t8 mid">healthy contact &#8594; PLC</text>
<line x1="786" y1="120" x2="830" y2="120" class="wdc"/>
<rect x="636" y="174" width="150" height="52" rx="0" class="dev"/>
