<text x="46" y="58" class="t t18 b">CONTROL POWER DISTRIBUTION &#8212; 240 V AC AND 24 V DC</text>
<text x="46" y="76" class="t t11">Redundant supplies &#183; decoupled &#183; grouped DC protection so one field fault cannot take down the control system</text>
<rect x="60" y="130" width="150" height="60" rx="0" class="dev"/>
<text x="135" y="152" class="t t12 b mid">Q19</text>
<text x="135" y="168" class="t t9 mid">MCB 1P C10</text>
<text x="135" y="182" class="t t8 mid">240 V AC from busbar</text>
<line x1="210" y1="160" x2="260" y2="160" class="pw"/>
<rect x="260" y="118" width="150" height="84" rx="0" class="devf"/>
<text x="335" y="140" class="t t12 b mid">UPS-01</text>
<text x="335" y="156" class="t t9 mid">1 kVA online</text>
<text x="335" y="170" class="t t9 mid">~15 min autonomy</text>
<text x="335" y="186" class="t t8 mid">status contacts &#8594; PLC</text>
<text x="335" y="224" class="t t9 mid">Two jobs: ride through a supply dip so the PLC does not</text>
<text x="335" y="236" class="t t9 mid">reboot, AND stay alive long enough on a real outage to</text>
<text x="335" y="248" class="t t9 b mid">tell SCADA the station has lost power.</text>
