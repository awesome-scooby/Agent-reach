<rect x="120" y="600" width="1330" height="66" rx="0" class="devf"/>
<text x="135" y="622" class="t t11 b">WHY GROUPED PROTECTION, NOT ONE DEVICE:</text>
<text x="135" y="640" class="t t9">If everything sits behind a single 20 A device, one shorted field cable pulls down the whole control system &#8212; including the PLC that was going to tell SCADA what happened.</text>
<text x="135" y="656" class="t t9 b">Grouping means a shorted field cable trips one group, the PLC stays up, and the alarm reaches the operator. The safety circuit (ECP5) has its own group so an ordinary control fault cannot disable it.</text>
<rect x="120" y="700" width="620" height="162" rx="0" class="dev"/>
<text x="135" y="722" class="t t11 b">240 V AC CUBICLE SERVICES  (Q20, MCB 1P C16)</text>
<text x="140" y="746" class="t t9">&#183; Cubicle lighting with door switches</text>
<text x="720" y="746" class="t t9 b">5 off</text>
<text x="140" y="764" class="t t9">&#183; GPO, double 10 A &#8212; laptop at FAT and at site</text>
<text x="720" y="764" class="t t9 b">2 off</text>
<text x="140" y="782" class="t t9">&#183; Anti-condensation heaters, 50 W, via hygrostat</text>
<text x="720" y="782" class="t t9 b">5 off</text>
<text x="140" y="800" class="t t9">&#183; UPS-01 input (via Q19)</text>
<text x="720" y="800" class="t t9 b">1 off</text>
<text x="135" y="826" class="t t8">Heaters are fitted even in an air-conditioned room: the HVAC will fail eventually and</text>
<text x="135" y="838" class="t t8">condensation on busbars is a slow, expensive failure. They are also a heat source and are</text>
<text x="135" y="850" class="t t8">counted in the declared thermal load issued to the HVAC designer.</text>
<rect x="770" y="700" width="680" height="162" rx="0" class="plc"/>
<text x="785" y="722" class="t t11 b">MONITORED POINTS &#8212; redundancy you cannot see the state of is not redundancy</text>
<text x="790" y="744" class="t t9 b">SIGNAL</text>
<text x="1120" y="744" class="t t9 b">TERMINAL</text>
<text x="1240" y="744" class="t t9 b">SENSE</text>
<text x="790" y="762" class="t t9">PSU-1 healthy</text>
<text x="1120" y="762" class="t t9 b">X3:106</text>
<text x="1240" y="762" class="t t9">NC</text>
<text x="790" y="778" class="t t9">PSU-2 healthy</text>
<text x="1120" y="778" class="t t9 b">X3:107</text>
<text x="1240" y="778" class="t t9">NC</text>
<text x="790" y="794" class="t t9">UPS on battery</text>
<text x="1120" y="794" class="t t9 b">X3:108</text>
<text x="1240" y="794" class="t t9">NO</text>
<text x="790" y="810" class="t t9">UPS fault</text>
<text x="1120" y="810" class="t t9 b">X3:109</text>
<text x="1240" y="810" class="t t9">NO</text>
<text x="790" y="826" class="t t9">ECP group trip (common)</text>
<text x="1120" y="826" class="t t9 b">X3:110</text>
<text x="1240" y="826" class="t t9">NC</text>
<text x="785" y="846" class="t t8 b">Without these you get two failures separated by months instead of one failure and an alarm.</text>
<rect x="46" y="880" width="1000" height="124" rx="0" class="devf"/>
<text x="56" y="898" class="t t12 b">NOTES</text>
<text x="56" y="914.0" class="t t9 prov b">1.  24 V DC circuits are protected by DC-RATED electronic circuit protectors. Standard AC MCBs must NOT be used on DC circuits &#8212; DC has no natural</text>
<text x="56" y="926.6" class="t t9 prov b">     current zero, so the arc does not self-extinguish. This is a genuine fault, not a technicality.</text>
<text x="56" y="939.2" class="t t9">2.  PSU-1 and PSU-2 are each fed from a separate MCB and each sized for the FULL control load.</text>
<text x="56" y="951.8" class="t t9">3.  The O-ring module decouples the two supplies. Outputs are not directly paralleled.</text>
<text x="56" y="964.4" class="t t9">4.  ECP5 (safety circuit) is a dedicated group. An ordinary control fault on any other group cannot de-energise the safety function.</text>
<text x="56" y="977.0" class="t t9">5.  ECP4 (analogue loop power) is separate from ECP2/ECP3 so a field digital fault cannot take every instrument reading down at the same moment.</text>
<text x="56" y="989.6" class="t t9">6.  On total loss of 24 V: run commands drop, contactors drop out (24 V DC coils), the drives stop per their configured response, and the PLC remains</text>
<text x="56" y="1002.2" class="t t9">     alive on UPS long enough to report the loss. The E-stop circuit de-energises to its safe state.</text>
