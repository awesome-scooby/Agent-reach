<text x="711" y="206" class="t t9 mid">QUINT4 24 V DC 20 A</text>
<text x="711" y="218" class="t t8 mid">healthy contact &#8594; PLC</text>
<line x1="786" y1="200" x2="830" y2="200" class="wdc"/>
<text x="711" y="258" class="t t9 b mid prov">EACH PSU IS SIZED FOR THE FULL LOAD, NOT HALF.</text>
<text x="711" y="270" class="t t9 mid">Two 10 A supplies for a 15 A load is not redundancy.</text>
<rect x="830" y="118" width="150" height="84" rx="0" class="devf"/>
<text x="905" y="142" class="t t10 b mid">REDUNDANCY</text>
<text x="905" y="156" class="t t10 b mid">(O-RING) MODULE</text>
<text x="905" y="174" class="t t9 mid">QUINT4-ORING</text>
<text x="905" y="190" class="t t8 mid">decouples the supplies</text>
<text x="905" y="224" class="t t9 mid">NOT a direct parallel connection &#8212; paralleling</text>
<text x="905" y="236" class="t t9 mid">switch-mode supplies causes sharing problems and</text>
<text x="905" y="248" class="t t9 mid">lets a failed supply drag the bus down.</text>
