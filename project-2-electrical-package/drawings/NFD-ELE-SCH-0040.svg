<text x="46" y="58" class="t t18 b">EMERGENCY STOP AND SAFETY CIRCUIT</text>
<text x="46" y="76" class="t t11">Dual channel &#183; monitored &#183; safety relay KS-01 &#183; Safe Torque Off to both drives &#183; contactor coil drop to DOL feeders</text>
<text x="46" y="112" class="t t10 b">24 V DC from ECP5 &#8212; a DEDICATED circuit protector group (SCH-0030). An ordinary control fault cannot disable the safety function.</text>
