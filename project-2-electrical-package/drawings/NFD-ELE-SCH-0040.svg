<text x="225" y="670" class="t t9 mid">STO ch.2 &#8594; terminal 38</text>
<text x="225" y="688" class="t t9 b mid">X5:017 / X5:018</text>
<text x="225" y="720" class="t t9 mid">Ref: SCH-0101</text>
