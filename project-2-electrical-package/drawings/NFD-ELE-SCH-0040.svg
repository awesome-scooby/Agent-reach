<text x="445" y="638" class="t t12 b mid">VSD-102</text>
<text x="445" y="656" class="t t9 mid">STO ch.1 &#8594; terminal 37</text>
<text x="445" y="670" class="t t9 mid">STO ch.2 &#8594; terminal 38</text>
<text x="445" y="688" class="t t9 b mid">X5:019 / X5:020</text>
<text x="445" y="720" class="t t9 mid">Ref: SCH-0111</text>
<rect x="140" y="714" width="460" height="52" rx="0" class="dev"/>
<text x="370" y="730" class="t t11 b mid">DOL CONTACTOR COIL CIRCUIT   (FROM KS-01  23/24)</text>
<text x="370" y="750" class="t t9 mid">KS-01 23/24 in series with the 24 V DC coil supply to KM103 and KM101C &#183; SCH-0121 / SCH-0131</text>
<rect x="140" y="810" width="460" height="48" rx="0" class="plc"/>
<text x="370" y="828" class="t t11 b mid">KS-01 aux 41/42 &#8594; PLC DI  X3:101</text>
<text x="370" y="844" class="t t9 mid">&#8220;E-stop circuit healthy&#8221; &#183; wired NC so a broken wire reads as a fault</text>
<rect x="640" y="586" width="420" height="296" rx="0" class="devf"/>
<text x="650" y="606" class="t t11 b">INPUT &#8594; LOGIC &#8594; OUTPUT &#8594; FEEDBACK &#8594; FAILURE</text>
<text x="650" y="628" class="t t9 b blu">INPUT</text>
<text x="718" y="628" class="t t9">Any of four E-stop devices, each with two independent NC</text>
<text x="718" y="640" class="t t9">contacts.</text>
<text x="650" y="658" class="t t9 b blu">LOGIC</text>
<text x="718" y="658" class="t t9">Both channels must be closed AND must agree within the</text>
<text x="718" y="670" class="t t9">relay's discrepancy time. Reset is manual and monitored.</text>
<text x="650" y="688" class="t t9 b blu">OUTPUT</text>
<text x="718" y="688" class="t t9">STO to both drives. DOL contactor coil circuit opened.</text>
<text x="650" y="706" class="t t9 b blu">FEEDBACK</text>
<text x="718" y="706" class="t t9">KS-01 aux 41/42 to PLC DI X3:101. Drive STO status also</text>
<text x="718" y="718" class="t t9">reported over EtherNet/IP.</text>
<text x="650" y="736" class="t t9 b blu">FAILURE</text>
<text x="718" y="736" class="t t9">E-stop pressed: both channels open, STO active, contactors</text>
<text x="718" y="748" class="t t9">drop, alarm to SCADA. No restart until released AND reset.</text>
<text x="718" y="766" class="t t9">ONE CHANNEL ONLY (broken wire, welded contact): relay</text>
<text x="718" y="778" class="t t9">detects the discrepancy, goes to the safe state, will NOT</text>
<text x="718" y="790" class="t t9">reset until cleared.</text>
<text x="718" y="808" class="t t9">Loss of 24 V on ECP5: circuit de-energises. That IS the</text>
<text x="718" y="820" class="t t9">safe state. The circuit is fail-safe by design.</text>
<rect x="46" y="922" width="1000" height="166" rx="0" class="devf"/>
<text x="56" y="940" class="t t12 b">NOTES</text>
<text x="56" y="956.0" class="t t9 prov b">1.  SAFE TORQUE OFF REMOVES TORQUE. IT DOES NOT ISOLATE. The drive output, and therefore the motor terminals, may still be at a hazardous potential</text>
<text x="56" y="968.6" class="t t9 prov b">     after an E-stop is pressed. STO is NOT an isolation method and does not replace the lockable local isolator at the motor.</text>
<text x="56" y="981.2" class="t t9 prov b">2.  The REQUIRED Performance Level for this safety function has NOT been determined &#8212; that needs a machinery risk assessment (AS 4024.1 / ISO 12100).</text>
<text x="56" y="993.8" class="t t9 prov b">     The ACHIEVED PL has NOT been calculated &#8212; that needs an ISO 13849-1 calculation. This is the architecture normally built for PLd, PENDING</text>
<text x="56" y="1006.4" class="t t9 prov b">     VERIFICATION. It must not be described as PLd until both are done. TQ-003 open.</text>
<text x="56" y="1019.0" class="t t9">3.  Stop category shown is Category 0 (immediate removal of power). Category 1 (controlled stop, then remove power) may be preferable to limit hydraulic</text>
<text x="56" y="1031.6" class="t t9">     surge on an abrupt stop of a 90 kW pump. That decision requires the risk assessment and a surge assessment, neither of which is ours. TQ-003.</text>
<text x="56" y="1044.2" class="t t9">4.  All safety circuit wiring lands on YELLOW terminals on rail X5, used for no other purpose. Four spare yellow terminals (X5:021&#8211;024) are provided so a</text>
<text x="56" y="1056.8" class="t t9">     future E-stop can be looped into the chain properly rather than improvised in a junction box.</text>
<text x="56" y="1069.4" class="t t9">5.  The safety function is independent of the PLC. Verified at FAT with the PLC in program-stop mode (FAT test M-95). Single-channel fault detection</text>
<text x="56" y="1082.0" class="t t9">     verified by FAT tests M-93a and M-93b &#8212; the tests that actually prove the circuit is dual channel rather than two parallel single channels.</text>
