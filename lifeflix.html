<title>LIFEFLIX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a dark screening-room shell — sticky marquee bar, a key-art hero, horizontal episode rails, full-screen mission overlays. Single committed dark look. */
:root{
  color-scheme: dark;
  --ink:#0c0a0e; --ink-2:#151219; --ink-3:#1f1b25; --ink-4:#2a2532; --line:#322c3b;
  --fg:#f4efe7; --fg-dim:#b1aaba; --fg-faint:#776f82;
  --tungsten:#ffb04a; --tungsten-deep:#e57a2c; --crimson:#e8414a; --crimson-deep:#9e1d2c;
  --ok:#5fd39a; --warn:#f2c14e; --bad:#ef6464;
  --s1:#ff7a3d; --s2:#4cc3ff; --s3:#b48cff; --s4:#ffcf3d; --s5:#47d18c; --s6:#ff6b9a;
  --a-focus:#4cc3ff; --a-discipline:#b48cff; --a-career:#ffb04a; --a-wealth:#47d18c; --a-health:#ff6b9a; --a-courage:#ff5a4a;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --gut:max(16px, env(safe-area-inset-left, 0px)); --gutR:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
input,textarea,select{font:inherit;color:var(--fg);background:var(--ink-3);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:80px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--tungsten);outline-offset:1px;border-color:transparent}
:focus-visible{outline:2px solid var(--tungsten);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:.95;margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-dim)}
.dim{color:var(--fg-dim)} .faint{color:var(--fg-faint)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.9'/></svg>")}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:linear-gradient(var(--ink) 55%, rgba(12,10,14,.0));padding-left:var(--gut);padding-right:var(--gutR);padding-block:12px 18px}
.top-in{display:flex;align-items:center;gap:20px;max-width:1400px;margin:0 auto}
.logo{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.04em;line-height:1;background:linear-gradient(180deg,var(--tungsten),var(--tungsten-deep));-webkit-background-clip:text;background-clip:text;color:transparent;transform:scaleY(1.08);white-space:nowrap}
.nav{display:flex;gap:4px;flex:1;min-width:0}
.nav button{padding:8px 12px;border-radius:999px;color:var(--fg-dim);font-weight:600;font-size:14px;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--fg);background:var(--ink-3)}
.nav button:hover{color:var(--fg)}
.coach-pill{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 5px;border-radius:999px;background:var(--ink-3);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:.02em;flex:none}
.avatar.brutal{background:var(--crimson);color:#fff}
.avatar.mentor{background:var(--tungsten);color:#2a1606}
.save-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--fg-faint)}
.save-dot.ok{background:var(--ok)} .save-dot.cloud{background:var(--s2)} .save-dot.bad{background:var(--bad)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ink-3);border:1px solid var(--line);flex:none}

.tabbar{display:none}
@media (max-width:820px){
  .nav{display:none}
  .top-in{gap:10px}
  .logo{font-size:26px;flex:1}
  .coach-pill .lbl{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;background:rgba(15,13,18,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--fg-faint);padding:6px 0;letter-spacing:.02em}
  .tabbar button[aria-current="page"]{color:var(--tungsten)}
  .tabbar svg{width:22px;height:22px}
  main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}

/* ---------- layout ---------- */
main{max-width:1400px;margin:0 auto;padding-bottom:120px}
.wrap{padding-left:var(--gut);padding-right:var(--gutR)}
.section{padding-block:22px 6px}
.row-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.row-head h2{font-size:26px;text-transform:uppercase}
.row-head .eyebrow{white-space:nowrap}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;margin-top:calc(-1 * env(safe-area-inset-top,0px) - 70px);padding-top:calc(env(safe-area-inset-top,0px) + 110px);padding-bottom:36px;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-1;background:
  radial-gradient(60% 70% at 78% 30%, rgba(255,122,61,.55), transparent 62%),
  radial-gradient(40% 50% at 92% 70%, rgba(232,65,74,.45), transparent 60%),
  radial-gradient(70% 60% at 10% 100%, rgba(76,195,255,.12), transparent 60%),
  linear-gradient(180deg,#120d12 0%, var(--ink) 100%)}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 0%, rgba(12,10,14,.85) 35%, rgba(12,10,14,.1) 70%), linear-gradient(0deg,var(--ink) 0%, transparent 35%)}
.leak{position:absolute;width:70vmax;height:70vmax;right:-20vmax;top:-25vmax;border-radius:50%;background:conic-gradient(from 0deg, rgba(255,176,74,.0), rgba(255,176,74,.35), rgba(232,65,74,.0), rgba(255,122,61,.3), rgba(255,176,74,0));filter:blur(50px);animation:leak 18s linear infinite;z-index:-1;opacity:.7}
@keyframes leak{to{transform:rotate(360deg)}}
.silhouette{position:absolute;right:4%;bottom:0;height:88%;z-index:-1;opacity:.95}
.hero-in{position:relative;max-width:760px;display:flex;flex-direction:column;gap:16px}
.hero h1{font-size:clamp(46px,8.4vw,108px);text-transform:uppercase;font-weight:900;line-height:.86}
.hero h1 .l2{display:block;color:var(--tungsten)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--fg-dim);font-weight:600}
.badge-rating{border:1px solid var(--fg-dim);padding:1px 7px;border-radius:3px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--fg)}
.season-tag{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--tungsten);text-transform:uppercase}
.hero-title2{font-size:clamp(24px,3.4vw,38px);text-transform:uppercase}
.hero p.lede{font-size:16px;max-width:60ch;color:var(--fg-dim)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:8px;font-weight:800;font-size:15px;letter-spacing:.01em;transition:transform .12s ease, background .2s ease}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--fg);color:var(--ink)}
.btn-primary:hover{background:#fff}
.btn-amber{background:var(--tungsten);color:#241304}
.btn-ghost{background:rgba(244,239,231,.12);color:var(--fg)}
.btn-ghost:hover{background:rgba(244,239,231,.2)}
.btn-line{border:1px solid var(--line);color:var(--fg)}
.btn-danger{background:var(--crimson);color:#fff}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:7px}
.btn-block{width:100%}

/* day strip */
.day-strip{display:flex;gap:3px;margin-top:6px;max-width:520px}
.day-strip i{flex:1;height:6px;border-radius:2px;background:var(--ink-4)}
.day-strip i.on{background:var(--tungsten)}
.day-strip i.today{outline:1px solid var(--fg);outline-offset:1px}

/* coach band */
.coach-band{display:flex;gap:14px;align-items:flex-start;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.coach-band .who{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint);margin-bottom:4px}
.coach-band p{font-size:16px;line-height:1.5;max-width:75ch}
.coach-band.brutal{border-left:3px solid var(--crimson)}
.coach-band.mentor{border-left:3px solid var(--tungsten)}

/* ---------- escape ---------- */
.escape-big{position:relative;width:100%;padding:22px 18px;border-radius:12px;background:linear-gradient(120deg,var(--crimson-deep),var(--crimson));color:#fff;font-family:var(--display);font-weight:900;font-size:clamp(26px,4vw,40px);letter-spacing:.03em;text-transform:uppercase;overflow:hidden;box-shadow:0 10px 40px rgba(232,65,74,.25)}
.escape-big small{display:block;font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;opacity:.85;margin-top:4px}
.escape-big::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;background:var(--crimson);color:#fff;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 8px 28px rgba(232,65,74,.45)}
@media (max-width:820px){.fab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}

/* ---------- rails ---------- */
.rail-wrap{position:relative}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-block:6px 14px;padding-left:var(--gut);padding-right:var(--gutR);scroll-padding-left:var(--gut);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-arrow{position:absolute;top:6px;bottom:14px;width:44px;z-index:3;display:grid;place-items:center;background:linear-gradient(90deg,rgba(12,10,14,.92),transparent);font-size:28px;color:var(--fg);opacity:0;transition:opacity .2s}
.rail-arrow.r{right:0;background:linear-gradient(270deg,rgba(12,10,14,.92),transparent)}
.rail-arrow.l{left:0}
.rail-wrap:hover .rail-arrow{opacity:1}
@media (hover:none){.rail-arrow{display:none}}
.card{scroll-snap-align:start;flex:none;width:clamp(230px,23vw,300px);text-align:left;border-radius:var(--r);background:var(--ink-2);overflow:hidden;transition:transform .2s ease, box-shadow .2s ease;position:relative}
.card:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.card .t{font-weight:800;font-size:15px;line-height:1.25}
.card .d{font-size:13px;color:var(--fg-dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{display:flex;gap:10px;font-family:var(--mono);font-size:11px;color:var(--fg-faint);letter-spacing:.04em;margin-top:2px;flex-wrap:wrap}
.card.add{display:grid;place-items:center;min-height:200px;border:1.5px dashed var(--line);background:transparent;color:var(--fg-dim);font-weight:700}
.card.done-card{opacity:.72}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;isolation:isolate}
.thumb .num{position:absolute;left:10px;bottom:2px;font-family:var(--display);font-weight:900;font-size:64px;line-height:.9;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.55)}
.thumb .glyph{position:absolute;right:12px;top:12px;width:36px;height:36px;opacity:.95}
.thumb .code{position:absolute;right:10px;bottom:8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.75)}
.thumb .chip{position:absolute;left:10px;top:10px}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.18)}
.prog>i{display:block;height:100%;background:var(--crimson)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.04em;background:rgba(12,10,14,.75);color:var(--fg);text-transform:uppercase}
.chip.ok{background:rgba(95,211,154,.18);color:var(--ok)}
.chip.warn{background:rgba(242,193,78,.16);color:var(--warn)}
.chip.bad{background:rgba(239,100,100,.16);color:var(--bad)}
.chip.amber{background:rgba(255,176,74,.16);color:var(--tungsten)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(6,5,8,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) var(--gutR) calc(env(safe-area-inset-bottom,0px) + 24px) var(--gut);animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;max-width:720px;margin:24px auto;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;overflow:hidden;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.sheet.wide{max-width:980px}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.sheet-body{padding:22px;display:flex;flex-direction:column;gap:16px}
.close-x{position:absolute;right:12px;top:12px;z-index:5;width:38px;height:38px;border-radius:50%;background:rgba(12,10,14,.75);display:grid;place-items:center;font-size:20px}
.fullscreen{position:fixed;inset:0;z-index:90;background:var(--ink);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) var(--gutR) calc(env(safe-area-inset-bottom,0px) + 24px) var(--gut);display:flex;flex-direction:column;animation:fade .3s ease}
.fs-in{width:100%;max-width:760px;margin:auto;display:flex;flex-direction:column;gap:20px}

.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:10px;background:var(--ink-3);border:1px solid var(--line);font-weight:700;transition:border-color .15s, background .15s}
.choice:hover{border-color:var(--fg-faint)}
.choice[aria-pressed="true"]{border-color:var(--tungsten);background:rgba(255,176,74,.1)}
.choice .ic{font-size:20px;width:28px;text-align:center;flex:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:9px 14px;border-radius:8px;background:var(--ink-3);border:1px solid var(--line);font-weight:700;font-family:var(--mono);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--fg-dim)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.f-row{grid-template-columns:1fr}}

/* briefing */
.brief-art{position:relative;min-height:220px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;isolation:isolate;overflow:hidden}
.brief-art h2{font-size:clamp(34px,6vw,56px);text-transform:uppercase}
.stat-line{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--ink-3);border-radius:8px;padding:10px 12px}
.stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint)}
.stat .v{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}

/* player */
.player-ring{position:relative;width:min(78vw,380px);aspect-ratio:1;max-width:100%;margin:0 auto}
.player-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.player-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.player-time{font-family:var(--mono);font-weight:700;font-size:clamp(46px,12vw,76px);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rec{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--crimson)}
.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--crimson);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.paused .rec{color:var(--fg-faint)} .paused .rec::before{animation:none;background:var(--fg-faint)}

/* boss */
.boss-hp{height:14px;border-radius:3px;background:var(--ink-4);overflow:hidden;border:1px solid var(--line)}
.boss-hp>i{display:block;height:100%;background:linear-gradient(90deg,var(--crimson-deep),var(--crimson));transition:width .8s ease}
.breath{position:relative;width:min(64vw,260px);aspect-ratio:1;max-width:100%;margin:10px auto;display:grid;place-items:center}
.breath .orb{position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle at 40% 35%, rgba(255,176,74,.9), rgba(229,122,44,.55) 45%, rgba(232,65,74,.15) 75%);box-shadow:0 0 80px rgba(255,176,74,.35);animation:breathe 12s ease-in-out infinite}
.breath .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,176,74,.35)}
@keyframes breathe{0%{transform:scale(.55)}33%{transform:scale(1)}50%{transform:scale(1)}100%{transform:scale(.55)}}
.breath .lbl{position:relative;font-family:var(--display);font-weight:900;font-size:30px;text-transform:uppercase;letter-spacing:.06em;color:#1d0f04;mix-blend-mode:normal}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--tungsten);height:28px}

/* stats */
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.panel{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font-size:22px;text-transform:uppercase}
.attr{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:10px;background:var(--ink-3)}
.attr .nm{font-weight:800;font-size:14px}
.attr .lv{font-family:var(--mono);font-size:11px;color:var(--fg-faint);letter-spacing:.06em}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;background:var(--ink-3);border:1px solid var(--line)}
.badge .medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:900;font-size:18px;background:var(--ink-4);color:var(--fg-faint)}
.badge.on .medal{background:radial-gradient(circle at 35% 30%, #ffd894, var(--tungsten) 50%, var(--tungsten-deep));color:#2b1504;box-shadow:0 0 22px rgba(255,176,74,.35)}
.badge .bt{font-weight:800;font-size:14px}
.badge .bd{font-size:12.5px;color:var(--fg-dim)}
.badge:not(.on){opacity:.7}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar-row .track{height:10px;border-radius:3px;background:var(--ink-4);overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:3px}
.bar-row .n{font-family:var(--mono);text-align:right;color:var(--fg-dim)}
.week-chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:16px}
.week-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}

const levelFrom = (xp, k = 50) => Math.floor((1 + Math.sqrt(1 + 4 * xp / k)) / 2);

function derive(s) {

  let total = 0;
  s.sessions.forEach(x => { total += x.xp || 0; Object.entries(x.gains || {}).forEach(([k, v]) => attr[k] = (attr[k] || 0) + v); });
  s.urges.forEach(x => { total += x.xp || 0; Object.entries(x.gains || {}).forEach(([k, v]) => attr[k] = (attr[k] || 0) + v); });
  (s.lifts || []).forEach(x => { total += x.xp || 0; Object.entries(x.gains || {}).forEach(([k, v]) => attr[k] = (attr[k] || 0) + v); });
  const level = levelFrom(total);
  const shown = new Set(s.sessions.filter(productive).map(x => x.day));
  // runs
  let cur = 0; { let k = shown.has(today) ? today : addDays(today, -1); while (shown.has(k)) { cur++; k = addDays(k, -1); } }
  const sortedDays = [...shown].sort();
  let best = 0, run = 0, prev = null, comeback = false;
  sortedDays.forEach(d => { if (prev && daysBetween(prev, d) === 1) run++; else { if (prev && daysBetween(prev, d) >= 3) comeback = true; run = 1; } best = Math.max(best, run); prev = d; });
  const last = sortedDays[sortedDays.length - 1] || null;
  const daysSinceLast = last ? daysBetween(last, today) : null;
  const todays = s.sessions.filter(x => x.day === today);
  const focusSec = arr => arr.filter(productive).reduce((a, x) => a + (x.actual || 0), 0);

  const week = []; for (let i = 6; i >= 0; i--) { const k = addDays(today, -i); week.push({ k, min: Math.round(focusSec(s.sessions.filter(x => x.day === k)) / 60) }); }

  const firstDay = s.sessions.length ? s.sessions[0].day : today;
  const span14 = clamp(daysBetween(firstDay, today) + 1, 1, 14);
  const avg14 = Math.round(focusSec(last14) / 60 / span14);
  const urgeCounts = {}; s.urges.forEach(u => urgeCounts[u.urge] = (urgeCounts[u.urge] || 0) + 1);
  const catCounts = {}; s.checkins.forEach(c => { if (c.cat !== "none" && c.cat !== "mood") catCounts[c.cat] = (catCounts[c.cat] || 0) + 1; });
  const topUrge = Object.entries(urgeCounts).sort((a, b) => b[1] - a[1])[0];
  const topCat = Object.entries(catCounts).sort((a, b) => b[1] - a[1])[0];

  const urgesToday = s.urges.filter(u => dayKey(new Date(u.ts)) === today);

  const sess = s.sessions, urges = s.urges;
  const tagDone = (tag) => sess.filter(x => x.outcome === "done" && (x.tags || []).includes(tag)).length;
  const studyMin = Math.round(sess.filter(x => productive(x) && (x.tags || []).includes("study")).reduce((a, x) => a + x.actual, 0) / 60);
  return [
    { id: "first10", t: "The First 10 Minutes", dsc: "One session with 10+ honest focused minutes.", on: sess.some(x => productive(x) && x.actual >= 600), p: "" },
    { id: "scroll", t: "Escaped the Scroll", dsc: "Beat an urge boss and went back to the mission.", on: urges.some(u => u.choice === "return" || u.choice === "shrink"), p: "" },
    { id: "seven", t: "Seven Days of Showing Up", dsc: "Seven days with real progress. They don't need to be in a row.", on: d.shown.size >= 7, p: Math.min(d.shown.size, 7) + "/7" },
    { id: "hunter", t: "The Job Hunter", dsc: "Complete three job-search missions.", on: tagDone("jobs") >= 3, p: Math.min(tagDone("jobs"), 3) + "/3" },
    { id: "upgrade", t: "The Engineer's Upgrade", dsc: "Five hours of focused technical study.", on: studyMin >= 300, p: fmtMin(Math.min(studyMin, 300)) + " / 5h" },
    { id: "customer", t: "First Business Customer", dsc: "A real person paid you. Self-reported in Milestones.", on: !!s.milestones.customer, p: "" },
    { id: "comeback", t: "The Comeback King", dsc: "Came back after two or more days away.", on: d.comeback, p: "" },
    { id: "deep", t: "Deep Cut", dsc: "Complete a 45-minute mission.", on: sess.some(x => x.outcome === "done" && x.planned >= 2700), p: "" },
    { id: "honest", t: "Honest Witness", dsc: "Logged a distracted session truthfully. Data beats pretending.", on: sess.some(x => x.outcome === "distracted"), p: "" },
    { id: "gym8", t: "Showed Up Anyway", dsc: "Log eight gym sessions. The minimum version counts.", on: progSessions(s, "gym").length >= 8, p: Math.min(progSessions(s, "gym").length, 8) + "/8" },
    { id: "recall", t: "It Stuck", dsc: "Complete ten spaced reviews of what you learned.", on: s.reviews.reduce((a, r) => a + (r.done || []).length, 0) >= 10, p: Math.min(s.reviews.reduce((a, r) => a + (r.done || []).length, 0), 10) + "/10" },
    { id: "word", t: "Kept My Word", dsc: "Keep a signed weekly Ulysses contract.", on: s.contracts.some(c => contractEval(s, c, dayKey()).status === "kept"), p: "" },
    { id: "reframe", t: "Reframed", dsc: "Complete a thought record and act on it.", on: s.thoughts.some(t => t.kind !== "defuse"), p: "" },
    { id: "kind", t: "Back on the Horse", dsc: "Run the slip recovery protocol instead of writing off the week.", on: s.slips.length > 0, p: "" },
    { id: "surfer", t: "Urge Surfer", dsc: "Fight ten urge bosses.", on: urges.length >= 10, p: Math.min(urges.length, 10) + "/10" }
  ];
}

/* =========================================================
   MISSION LOGIC
   ========================================================= */
const activeMissions = s => s.missions.filter(m => m.status === "active");
const lastDoneDay = (s, mid) => { const x = s.sessions.filter(z => z.mid === mid && z.outcome === "done").pop(); return x ? x.day : null; };
const lastSession = (s, mid) => s.sessions.filter(z => z.mid === mid).pop() || null;
const epNumber = (s, m) => { const list = s.missions.filter(x => x.season === m.season).sort((a, b) => a.order - b.order); return list.findIndex(x => x.id === m.id) + 1; };
const epCode = (s, m) => seasonOf(m.season).code + ":E" + pad(Math.max(1, epNumber(s, m)));

function pickForCategory(s, cat) {
  const today = dayKey();
  const pool = activeMissions(s).filter(m => (m.tags || []).includes(cat));
  const list = (pool.length ? pool : activeMissions(s).filter(m => m.attr === "courage" || m.attr === "discipline"));
  return list.map(m => {
    const ld = lastDoneDay(s, m.id);
    let sc = 10 - Math.abs(m.minutes - 10) / 4 + (m.attr === "career" || m.attr === "courage" ? 2 : 0);
    if (ld && daysBetween(ld, today) < 2) sc -= 6;
    sc += hashStr(m.id + today) * 1.5;
    return [sc, m];
  }).sort((a, b) => b[0] - a[0]).map(x => x[1])[0] || activeMissions(s)[0];
}

function genDaily(s, date) {
  const act = activeMissions(s);
  const recentCats = new Set(s.checkins.filter(c => daysBetween(dayKey(new Date(c.ts)), date) <= 3).map(c => c.cat));
  const score = m => {
    let sc = (m.attr === "career" || m.attr === "wealth" || m.attr === "courage") ? 3 : 1;
    if ((m.tags || []).some(t => recentCats.has(t))) sc += 4;
    const ld = lastDoneDay(s, m.id); if (ld && daysBetween(ld, date) < 3) sc -= 5;
    const ls = lastSession(s, m.id); if (ls && ls.outcome === "partial") sc += 2;
    if (m.minutes >= 25) sc += 1;
    return sc + hashStr(m.id + date) * 2.5;
  };
  const nonHealth = act.filter(m => m.attr !== "health").map(m => [score(m), m]).sort((a, b) => b[0] - a[0]).map(x => x[1]);
  const priority = nonHealth.find(m => m.minutes >= 10) || nonHealth[0];
  const support = [];
  for (const m of nonHealth) { if (support.length >= 2) break; if (m === priority) continue; if (support.some(x => x.attr === m.attr) || m.attr === (priority && priority.attr)) continue; support.push(m); }
  for (const m of nonHealth) { if (support.length >= 2) break; if (m !== priority && !support.includes(m)) support.push(m); }
  const health = act.filter(m => m.attr === "health" && m.minutes <= 10);
  const well = health.length ? health[Math.floor(hashStr(date) * health.length)] : act.find(m => m.attr === "health");
  return { priority: priority && priority.id, support: support.map(m => m.id), wellbeing: well && well.id, intention: "", review: null };
}

function sessionGains(s, m, outcome, actualSec, plannedSec, flags) {
  const g = {}; const add = (k, v) => { v = Math.round(v); if (v > 0) g[k] = (g[k] || 0) + v; };
  const xpBase = xpFor(Math.round(plannedSec / 60) in BASE_XP ? Math.round(plannedSec / 60) : m.minutes, m.difficulty);
  const today = dayKey();
  const firstToday = !s.sessions.some(x => x.day === today && productive(x));
  // Bonuses need real time on task: at least half the mission, capped at 5 minutes (60s for a 2-minute mission).
  const real = actualSec >= Math.min(plannedSec * 0.5, 300);
  if (outcome === "done") add(m.attr, actualSec >= 30 ? xpBase : xpBase * 0.25);
  else if (outcome === "partial" && actualSec >= 60) add(m.attr, xpBase * 0.5 * clamp(actualSec / plannedSec, 0, 1));
  else if (outcome === "distracted" && actualSec >= 60) add("courage", 10);
  if (outcome !== "distracted" && (real || outcome === "done" && actualSec >= 30)) {
    add("focus", Math.min(actualSec, plannedSec + 600) / 60 * 3);
    if (flags.fromAvoid) add("courage", 25);
    if (flags.viaBoss) add("discipline", 20);
    if (firstToday) add("discipline", 15);
  }
  return g;
}

function coachHome(coach, s, d, prio) {
  const p = prio ? `"${prio.title}"` : "your priority";
  const prioDone = prio && d.todays.some(x => x.mid === prio.id && x.outcome === "done");
  const h = hourNow();
  if (coach === "brutal") {
    if (d.daysSinceLast !== null && d.daysSinceLast >= 2 && d.todays.length === 0) return `${d.daysSinceLast} days off the board. No lecture: the gap is data, and it doesn't erase your XP. What matters is the next 10 minutes. Start ${p}.`;
    if (prioDone) return `Priority done. ${d.minsToday} focused minutes today. That's a professional day. Close this app and get on with your evening.`;
    if (d.todays.length === 0 && h >= 12) return `It's ${timeStr()}. Zero focused minutes so far. The morning's gone; the afternoon isn't. Start ${p} for 10 minutes, before one more video.`;
    if (d.todays.length === 0) return `Day ${d.dayN}. Opening this app isn't progress yet. ${p} is waiting. Start it before you scroll this page.`;
    if (d.distractedToday > d.doneToday) return `${d.distractedToday} sessions lost to distraction today vs ${d.doneToday} finished. The plan's too big or the phone's too close. Go shorter: 10 minutes, phone in another room.`;
    if (d.doneToday >= 1 && !prioDone) return `${d.doneToday} mission${d.doneToday > 1 ? "s" : ""} done, but not the priority. Easy wins are still avoidance if the hard one waits. ${p} next.`;
    return `${d.minsToday} focused minutes today. Decent, not finished. ${p} is still open.`;
  }
  if (d.daysSinceLast !== null && d.daysSinceLast >= 2 && d.todays.length === 0) return `Welcome back. ${d.daysSinceLast} days away happens, and nothing you've built has been lost. Let's make re-entry tiny: two minutes on ${p}, then decide.`;
  if (prioDone) return `You did the important thing today. ${d.minsToday} focused minutes. Let that be enough and enjoy your evening; rest is part of the plan.`;
  if (d.todays.length === 0 && h >= 12) return `The morning slipped away, and that's fine. It's recoverable. Pick ${p}, set 10 minutes, and let starting be the whole goal.`;
  if (d.todays.length === 0) return `Morning. You don't need to solve your whole future today. One important action: ${p}. Ten focused minutes is enough to begin.`;
  if (d.distractedToday > d.doneToday) return `Focus has been slippery today. That tells us the missions are too long right now. Let's drop to a 10-minute version and move the phone out of reach.`;
  if (d.doneToday >= 1 && !prioDone) return `Good momentum: ${d.doneToday} done. Use it. ${p} is the one that moves your life forward; a 10-minute start is enough.`;
  return `${d.minsToday} focused minutes so far. You're in motion. Keep the next step small and specific.`;
}

function coachReview(coach, outcome, m, actualMin) {
  const B = {
    done: [`Done. ${actualMin} minutes, real output. That's how the gap between plans and life closes. Now leave the app.`, `Finished. No applause needed; the result is the reward. What's the next real-world action?`],
    partial: [`Partial counts, but be precise: what stopped you? If it was the task's size, cut it smaller next time. If it was your phone, move it.`, `Some progress. Better than zero, short of done. Book the next session now while you still know where you left off.`],
    distracted: [`Thanks for being honest. Most people lie to their tracker. The distraction won this round. Shorter mission, phone out of the room, and go again within the hour.`, `You got pulled away. No drama, just data. Run a 2-minute restart now rather than "later".`]
  };
  const M = {
    done: [`That's a real win. You chose meaningful progress over easy pleasure. Notice how it feels, then step away from the screen.`, `Well done. You started, you stayed, you finished. Take that feeling into the rest of the day.`],
    partial: [`Partial progress is still progress, and you've already broken the inertia. Write one line on where to resume so restarting is easy.`, `You moved it forward. Next time we'll shrink the target so finishing feels within reach.`],
    distracted: [`Getting distracted doesn't make you a failure. It means the mission was harder than it looked. Logging it honestly helps us spot the pattern. Try two minutes now.`, `It happens to everyone. You noticed, and you came back to report it. That's the skill. Let's try a smaller version.`]
  };
  const pool = (coach === "brutal" ? B : M)[outcome];
  return pool[Math.floor(Math.random() * pool.length)];
}

function coachBoss(coach, choice, urgeKey, genuine) {
  const u = URGES[urgeKey] ? URGES[urgeKey].label.toLowerCase() : "that";
  if (coach === "brutal") {
    if (choice === "return") return `Good. The urge peaked and passed, as urges do. Two minutes. If you want to stop after that, you can. You won't.`;
    if (choice === "break") return genuine === "want" ? `You decided you genuinely want a break. Fine; that's a choice, not an escape. The timer's running. When it ends, you come back.` : `A deliberate break beats a disguised one. It's on the clock. When it ends, no "one more". Come back.`;
    return `Smart move. The task wasn't the problem; its size was. Do the small version now.`;
  }
  if (choice === "return") return `You rode the urge out instead of obeying it. That's the whole skill. Just two minutes; you're allowed to stop after.`;
  if (choice === "break") return `Taking a planned break is a healthy choice, not a failure. Enjoy it fully. I'll remind you when it's time to come back.`;
  return `Great reframe. When a task feels heavy, shrinking it is the most strategic thing you can do. Let's start the small version.`;
}

function coachReply(coach, text, ctx) {
  if (CRISIS_RE.test(text)) return { crisis: true, text: "I'm really glad you said that. This is bigger than a productivity app, and you deserve to talk to a person right now. Lifeline: call 13 11 14 or text 0477 13 11 14, any time, day or night. If you're in immediate danger, call 000.", action: { label: "Show support lines", act: "help" } };
  const it = INTENTS.find(i => i.re.test(text));
  if (it) return { text: it[coach](ctx), action: it.action, intent: it.id };
  return { text: coach === "brutal"
      ? `I don't do vague. What's the one task you're avoiding right now? Name it and I'll turn it into a 10-minute mission.`
      : `Thanks for telling me. Let's make it concrete: which task is weighing on you most? Use "What am I avoiding?" and I'll build a small mission around it.`,
    action: { label: "What am I avoiding?", act: "checkin" } };
}

    <svg width=${size} height=${size} style=${{ transform: "rotate(-90deg)" }} aria-hidden="true">
      <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke="var(--ink-4)" strokeWidth=${stroke}/>
      <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke=${color} strokeWidth=${stroke} strokeLinecap="round" strokeDasharray=${c} strokeDashoffset=${c * (1 - clamp(value, 0, 1))} style=${{ transition: "stroke-dashoffset .8s ease" }}/>
    </svg>
    <div style=${{ position: "absolute", inset: 0, display: "grid", placeItems: "center" }}>${children}</div>
  </div>`;
}
function Rail({ children }) {
  const ref = useRef(null);
  const go = dir => { const el = ref.current; if (el) el.scrollBy({ left: dir * el.clientWidth * 0.85, behavior: "smooth" }); };
  return html`<div className="rail-wrap">
    <button className="rail-arrow l" aria-label="Scroll left" onClick=${() => go(-1)}>‹</button>
    <div className="rail" ref=${ref}>${children}</div>
    <button className="rail-arrow r" aria-label="Scroll right" onClick=${() => go(1)}>›</button>
  </div>`;
}
function MissionCard({ s, m, onOpen, label }) {
  const ls = lastSession(s, m.id);
  const done = s.sessions.filter(x => x.mid === m.id && x.outcome === "done").length;
  const progress = m.status === "done" ? 1 : ls && ls.outcome === "partial" ? clamp(ls.actual / ls.planned, 0.1, 0.9) : null;
  return html`<button className=${"card" + (m.status === "done" ? " done-card" : "")} onClick=${() => onOpen(m)} aria-label=${"Open episode " + m.title}>
    <${Thumb} s=${s} m=${m} progress=${progress}/>
    <div className="body">
      ${label ? html`<span className="eyebrow" style=${{ color: "var(--tungsten)" }}>${label}</span>` : null}
      <div className="t">${m.title}</div>
      <div className="d">${m.desc}</div>
      <div className="m"><span>${epCode(s, m)}</span><span>${m.difficulty.toUpperCase()}</span><span style=${{ color: ATTRS[m.attr].color }}>${ATTRS[m.attr].label.toUpperCase()}</span><span>${xpFor(m.minutes, m.difficulty)} XP</span>${done ? html`<span style=${{ color: "var(--ok)" }}>✓ ${done}</span>` : null}</div>
    </div>
  </button>`;
}

/* =========================================================
   APP
   ========================================================= */
function App() {
  const [s, setS] = useState(() => normalize(Store.loadLocal()));
  const sRef = useRef(s); sRef.current = s;
  const [, force] = useState(0);
  const [view, setView] = useState("home");
  const [ov, setOv] = useState(() => null);      // overlay: {type, ...}
  const [toast, setToast] = useState(null);
  const [tool, setTool] = useState(null);
  const [calmTool, setCalmTool] = useState(null);
  const goCalm = (id, extra) => { setCalmTool(id ? Object.assign({ id }, extra || {}) : null); setView("calm"); setOv(null); try { window.scrollTo(0, 0); } catch (e) {} };
  const logQuickMood = (q, id) => { const c = QUAD_CENTER[q]; update(n => { const ex = n.moods.find(x => x.id === id); if (ex) Object.assign(ex, c); else n.moods.push(Object.assign({ id, ts: Date.now(), tags: [], sleep: null, quick: true }, c)); }); };
  const goTool = (id, extra) => { setTool(Object.assign({ id }, extra || {})); setView("tools"); setOv(null); try { window.scrollTo(0, 0); } catch (e) {} };
  const [now, setNow] = useState(Date.now());
  const browseStart = useRef(Date.now());
  // Time spent resetting in the Green Room never counts as "browsing the app".
  useEffect(() => { browseStart.current = Date.now(); }, [view === "calm"]);
  const [nudgeDismissed, setNudgeDismissed] = useState(0);
  const sample = useRef(null);
  const downloads = useRef(null);

  const update = useCallback((fn, quiet) => {
    setS(prev => { const next = JSON.parse(JSON.stringify(prev)); fn(next); if (!quiet) next.updatedAt = Date.now(); return next; });
  }, []);

  // persistence
  useEffect(() => { Store.saveLocal(s); Cloud.schedule(s); }, [s]);
  useEffect(() => {
    const f = () => force(x => x + 1); Store.listeners.add(f);
    Cloud.init(() => sRef.current, (remote, prefer) => setS(prev => mergeStates(prev, remote, prefer)));
    (async () => {
      try { if (window.claude && window.claude.use) { sample.current = await window.claude.use("sample"); downloads.current = await window.claude.use("downloads"); force(x => x + 1); } } catch (e) {}
    })();
    return () => Store.listeners.delete(f);
  }, []);
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);

  // first-run + daily check-in
  useEffect(() => {
    if (!s.coach) setOv({ type: "coachPick", first: true });
    else if (s.active) setOv(null);
    else setOv({ type: "checkin" });
    // eslint-disable-next-line
  }, []);

  const d = useMemo(() => derive(s), [s]);
  // If account sync delivers a coach choice made on another device, skip the first-run picker here.
  useEffect(() => { if (s.coach && ov && ov.type === "coachPick" && ov.first) setOv(s.active ? null : { type: "checkin" }); }, [s.coach]);
  const today = d.today;

  // ensure today's daily episode exists
  useEffect(() => {
    if (!s.daily[today]) update(n => { n.daily[today] = genDaily(n, today); }, true);
  }, [today, s.daily[today]]);
  const daily = s.daily[today] || genDaily(s, today);
  const byId = id => s.missions.find(m => m.id === id);
  const prio = byId(daily.priority);

  const ctx = { s, d, prio };
  const coach = s.coach || "mentor";

  const flash = (t, sub) => { setToast({ t, sub, id: uid() }); setTimeout(() => setToast(null), 3800); };

  /* ---------- actions ---------- */
  const openBrief = (m, opts = {}) => setOv({ type: "brief", m, opts });
  const startMission = (m, minutes, target, opts = {}) => {
    try { if (!window.__ac) window.__ac = new (window.AudioContext || window.webkitAudioContext)(); window.__ac.resume && window.__ac.resume(); } catch (e) {}
    update(n => {
      if (!n.missions.some(x => x.id === m.id)) n.missions.push(Object.assign({}, m, { order: n.missions.length + 100, createdAt: Date.now() }));
      n.active = { mid: m.id, title: m.title, target: target || "", plannedSec: minutes * 60, startTs: Date.now(), pausedMs: 0, pausedAt: null, fromAvoid: !!opts.fromAvoid, viaBoss: !!opts.viaBoss, moodBefore: opts.moodBefore == null ? null : opts.moodBefore };
      n.brk = null;
    });
    browseStart.current = Date.now();
    setOv(null);
  };
  const quickStart = (m, minutes, opts = {}) => startMission(m, minutes, m.firstStep, opts);
  const finishReview = (outcome, note, moodAfter) => {
    const a = s.active; if (!a) return;
    const m = byId(a.mid) || { id: a.mid, title: a.title, attr: "courage", minutes: Math.round(a.plannedSec / 60), difficulty: "Medium", season: 1, tags: [] };
    const end = a.pausedAt || Date.now();
    const actual = Math.round(clamp((end - a.startTs - a.pausedMs) / 1000, 0, 6 * 3600));
    const gains = sessionGains(s, m, outcome, actual, a.plannedSec, a);
    const xp = Object.values(gains).reduce((x, y) => x + y, 0);
    const sess = { id: uid(), mid: m.id, title: m.title, season: m.season, attr: m.attr, tags: m.tags || [], planned: a.plannedSec, actual, outcome, xp, gains, ts: Date.now(), day: dayKey(), note: note || "", target: a.target, fromAvoid: a.fromAvoid, viaBoss: a.viaBoss, moodBefore: a.moodBefore == null ? null : a.moodBefore, moodAfter: moodAfter == null ? null : moodAfter };
    const beforeAch = achievements(s, d).filter(x => x.on).map(x => x.id);
    const n = JSON.parse(JSON.stringify(s));
    n.sessions.push(sess); n.active = null;
    if (note && outcome !== "done") n.excuses.push({ id: uid(), ts: Date.now(), text: note, src: outcome === "partial" ? "partial session" : "distracted session" });
    if (outcome === "done" && !m.repeat) { const mm = n.missions.find(x => x.id === m.id); if (mm) mm.status = "done"; }
    const after = achievements(n, derive(n)).filter(x => x.on).map(x => x.id);
    const newAch = after.filter(x => !beforeAch.includes(x) && !n.seenAch.includes(x));
    n.seenAch = Array.from(new Set(n.seenAch.concat(newAch)));
    n.updatedAt = Date.now();
    setS(n);
    setOv({ type: "result", sess, m, newAch });
  };
  const runAct = (act) => {
    if (act && act.indexOf("calm:") === 0) { const id = act.slice(5); goCalm(id === "hub" ? null : id); return; }
    if (act === "help") { setOv({ type: "help" }); return; }
    const p = prio || activeMissions(s)[0];
    if (act === "prio10" && p) openBrief(p, { minutes: 10 });
    else if (act === "prio2" && p) openBrief(p, { minutes: 2 });
    else if (act === "boss") setOv({ type: "boss" });
    else if (act === "today") { setOv(null); setView("today"); }
    else if (act === "checkin") setOv({ type: "checkin" });
    else if (act === "break") startBreak(15, null);
    else if (act === "courage") openBrief(pickForCategory(s, "overdue"), { fromAvoid: true });
    else if (act === "diag") goTool("diag", { mid: p && p.id });
    else if (act === "gym" || act === "learn" || act === "asrs" || act === "bank") goTool(act);
    else if (act === "thought") goTool("thought");
    else if (act === "slip") goTool("slip");
    else if (act === "woop") goTool("woop");
    else if (act === "contact") { const m = s.missions.find(x => x.title === "Contact One Potential Customer") || pickForCategory(s, "business"); openBrief(m, {}); }
  };
  const startBreak = (min, urgeId) => {
    update(n => { n.brk = { start: Date.now(), until: Date.now() + min * 60000, min, extended: false }; });
    setOv(null);
    flash(`Planned break: ${min} minutes`, "Enjoy it fully. LIFEFLIX will call you back.");
  };

  const quickLog = (m, minutes, note) => {
    const planned = minutes * 60;
    const gains = sessionGains(s, m, "done", planned, planned, {});
    const xp = Object.values(gains).reduce((a, b) => a + b, 0);
    const sess = { id: uid(), mid: m.id, title: m.title, season: m.season, attr: m.attr, tags: m.tags || [], planned, actual: planned, outcome: "done", xp, gains, ts: Date.now(), day: dayKey(), note: note || "Logged after doing it.", target: "", fromAvoid: false, viaBoss: false, quick: true };
    update(n => { if (!n.missions.some(x => x.id === m.id)) n.missions.push(Object.assign({}, m, { order: n.missions.length + 100, createdAt: Date.now() })); n.sessions.push(sess); });
    flash("+" + xp + " XP", m.title + " · " + minutes + " min logged");
  };
  const saveMission = (m) => update(n => {
    const i = n.missions.findIndex(x => x.id === m.id);
    if (i >= 0) n.missions[i] = Object.assign({}, n.missions[i], m);
    else n.missions.push(Object.assign({ id: uid(), status: "active", order: n.missions.length + 100, createdAt: Date.now() }, m));
  });
  const deleteMission = (id) => update(n => {
    n.missions = n.missions.filter(x => x.id !== id); n.tomb.push(id);
    Object.values(n.daily).forEach(dd => { if (dd.priority === id) dd.priority = null; dd.support = (dd.support || []).filter(x => x !== id); if (dd.wellbeing === id) dd.wellbeing = null; });
    if (n.daily[dayKey()]) { const g = genDaily(n, dayKey()); const t = n.daily[dayKey()]; if (!t.priority) t.priority = g.priority; while (t.support.length < 2 && g.support.length) { const c = g.support.shift(); if (!t.support.includes(c) && c !== t.priority) t.support.push(c); } if (!t.wellbeing) t.wellbeing = g.wellbeing; }
  });

  // break end
  const brkLeft = s.brk ? Math.max(0, Math.round((s.brk.until - now) / 1000)) : 0;
  useEffect(() => {
    if (s.brk && brkLeft === 0 && (!ov || ov.type !== "breakOver")) { beep(); setOv({ type: "breakOver" }); }
  }, [brkLeft, s.brk]);

  // browsing nudge: 5 min in the app without a mission
  const browsingMin = (now - browseStart.current) / 60000;
  const showNudge = !s.active && !s.brk && !ov && view !== "calm" && browsingMin >= 5 + nudgeDismissed * 5;

  const inPlayer = !!s.active;
  const nav = [["home", "Home"], ["today", "Today"], ["calm", "Calm"], ["tools", "Tools"], ["stats", "Player"], ["futures", "Two Futures"], ["coach", "Coach"], ["recap", "Recap"]];
  const navTo = k => { if (k === view && k === "calm") setCalmTool(null); if (k === view && k === "tools") setTool(null); setView(k); };

  return html`<${React.Fragment}>
    ${!inPlayer ? html`<header className="top">
      <div className="top-in">
        <button className="logo" onClick=${() => setView("home")} aria-label="LIFEFLIX home">LIFEFLIX</button>
        <nav className="nav" aria-label="Main">
          ${nav.map(([k, l]) => html`<button key=${k} aria-current=${view === k ? "page" : undefined} onClick=${() => navTo(k)}>${l}</button>`)}
        </nav>
        <button className="coach-pill" onClick=${() => update(n => { n.coach = n.coach === "brutal" ? "mentor" : "brutal"; })} aria-label=${"Coach: " + COACH[coach].name + ". Tap to switch."} title="Switch coach">
          <span className=${"avatar " + coach}>${COACH[coach].init}</span><span className="lbl">${COACH[coach].short}</span><span className="faint" aria-hidden="true">⇄</span>
        </button>
        <button className="icon-btn" aria-label="Settings and data" onClick=${() => setOv({ type: "settings" })}>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 5.5v-3l-2.4-.5a7 7 0 0 0-.8-1.9l1.4-2-2.1-2.1-2 1.4a7 7 0 0 0-1.9-.8L12.5 2h-3l-.5 2.4a7 7 0 0 0-1.9.8l-2-1.4L3 5.9l1.4 2a7 7 0 0 0-.8 1.9L1 10.5v3l2.4.5c.2.7.5 1.3.8 1.9l-1.4 2 2.1 2.1 2-1.4c.6.3 1.2.6 1.9.8l.5 2.4h3l.5-2.4c.7-.2 1.3-.5 1.9-.8l2 1.4 2.1-2.1-1.4-2c.3-.6.6-1.2.8-1.9Z"/></svg>
        </button>
      </div>
    </header>` : null}

    ${!inPlayer ? html`<main>
      ${s.brk ? html`<div className="wrap"><div className="banner break" role="status">
        <div><div className="eyebrow" style=${{ color: "var(--s2)" }}>Planned break</div><div style=${{ fontWeight: 800 }}><span className="mono">${fmtClock(brkLeft)}</span> left. Enjoy it without guilt.</div></div>
        <button className="btn btn-sm btn-line" onClick=${() => update(n => { n.brk = null; })}>End break early</button>
      </div></div>` : null}
      ${showNudge ? html`<div className="wrap"><div className="banner nudge" role="status">
        <div style=${{ display: "flex", gap: "10px", alignItems: "center" }}><span className=${"avatar " + coach}>${COACH[coach].init}</span>
          <span>${coach === "brutal" ? `You've been browsing LIFEFLIX for ${Math.floor(browsingMin)} minutes without starting anything. This app is now the procrastination.` : `You've spent ${Math.floor(browsingMin)} minutes in here. Let's turn that into action: one small mission, then step away.`}</span></div>
        <div className="btn-row"><button className="btn btn-sm btn-amber" onClick=${() => prio && openBrief(prio, { minutes: 10 })}>Start priority</button><button className="btn btn-sm btn-line" onClick=${() => { setNudgeDismissed(x => x + 1); }}>Dismiss</button></div>
      </div></div>` : null}

      ${view === "home" ? html`<${Home} ...${ctx} coach=${coach} daily=${daily} byId=${byId} openBrief=${openBrief} setOv=${setOv} setView=${setView} goTool=${goTool} goCalm=${goCalm}/>` : null}
      ${view === "today" ? html`<${Today} ...${ctx} coach=${coach} daily=${daily} byId=${byId} openBrief=${openBrief} setOv=${setOv} update=${update} goTool=${goTool} quickLog=${quickLog}/>` : null}
      ${view === "stats" ? html`<${Stats} ...${ctx} coach=${coach} update=${update} flash=${flash} goTool=${goTool}/>` : null}
      ${view === "futures" ? html`<${Futures} ...${ctx} update=${update}/>` : null}
      ${view === "coach" ? html`<${CoachChat} ...${ctx} coach=${coach} runAct=${runAct} update=${update} sample=${sample.current} goTool=${goTool}/>` : null}
      ${view === "recap" ? html`<${Recap} ...${ctx} coach=${coach} byId=${byId} update=${update} flash=${flash}/>` : null}
      ${view === "calm" ? html`<${GreenRoom} ...${ctx} coach=${coach} update=${update} openBrief=${openBrief} flash=${flash} calmTool=${calmTool} setCalmTool=${setCalmTool} goTool=${goTool} setOv=${setOv}/>` : null}
      ${view === "tools" ? html`<${Tools} ...${ctx} coach=${coach} update=${update} openBrief=${openBrief} flash=${flash} tool=${tool} setTool=${setTool} quickLog=${quickLog} startBreak=${startBreak} downloads=${downloads.current} goCalm=${goCalm}/>` : null}

      <footer>
        <div style=${{ display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap" }}><${SaveStatus}/></div>
        <p style=${{ marginTop: "8px" }}>LIFEFLIX rewards what you do outside the screen. XP comes only from missions you report honestly. Projections are illustrative, not guarantees.</p>
        <p style=${{ marginTop: "6px" }}>Need to talk to someone? <button className="linkish" onClick=${() => setOv({ type: "help" })}>Lifeline 13 11 14 and other 24/7 support lines</button></p>
      </footer>
    </main>` : null}

    ${!inPlayer && !ov && view !== "calm" ? html`<button className="fab" onClick=${() => setOv({ type: "boss" })} aria-label="I want to escape my task">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M13 3h-2v10h2V3Zm4.8 2.2-1.4 1.4A7 7 0 1 1 7.6 6.6L6.2 5.2A9 9 0 1 0 17.8 5.2Z"/></svg>
      <span>Escape</span></button>` : null}

    ${!inPlayer ? html`<nav className="tabbar" aria-label="Main">
      ${[["home", "Home"], ["today", "Today"], ["calm", "Calm"], ["tools", "Tools"]].map(([k, l]) => html`<button key=${k} aria-current=${view === k ? "page" : undefined} onClick=${() => navTo(k)}><${Icon} k=${k}/>${l}</button>`)}
      <button aria-current=${["stats", "futures", "coach", "recap"].includes(view) ? "page" : undefined} onClick=${() => setOv({ type: "more" })}><${Icon} k="more"/>More</button>
    </nav>` : null}

    ${inPlayer && (!ov || ov.type === "boss") ? html`<${Player} s=${s} coach=${coach} update=${update} byId=${byId} onReview=${() => setOv({ type: "review" })} onEscape=${() => { update(n => { if (n.active && !n.active.pausedAt) n.active.pausedAt = Date.now(); }); setOv({ type: "boss", fromPlayer: true }); }} hidden=${ov && ov.type === "boss"}/>` : null}

    ${ov && ov.type === "coachPick" ? html`<${CoachPick} first=${ov.first} current=${s.coach} onPick=${c => { update(n => { n.coach = c; }); setOv(ov.first ? { type: "checkin" } : null); }} onClose=${() => setOv(null)}/>` : null}
    ${ov && ov.type === "checkin" ? html`<${CheckIn} s=${s} d=${d} coach=${coach} prio=${prio} onMood=${logQuickMood} onCalm=${q => goCalm(q === "red" ? "breathe" : null)} onSkip=${() => { update(n => { n.checkins.push({ id: uid(), ts: Date.now(), cat: "none" }); }); setOv(null); }}
        onPick=${(cat, text) => {
          update(n => { n.checkins.push({ id: uid(), ts: Date.now(), cat, text: text || "" }); });
          if (cat === "mood") { goCalm(null); return; }
          let m;
          if (cat === "other" && text) m = { id: uid(), season: 1, title: text.slice(0, 70), desc: "The task you named when LIFEFLIX asked what you're avoiding.", minutes: 10, difficulty: "Medium", attr: "courage", tags: ["other"], firstStep: "Open whatever you need for this task.", deliverable: "One visible step forward.", repeat: true, status: "active" };
          else m = (cat === "exercise" && progMission(s, "gym")) || (cat === "study" && progMission(s, "learn")) || pickForCategory(s, cat);
          openBrief(m, { fromAvoid: true, avoidCat: cat });
        }}/>` : null}
    ${ov && ov.type === "brief" ? html`<${Briefing} s=${s} d=${d} m=${ov.m} opts=${ov.opts} coach=${coach} onStart=${startMission} onClose=${() => setOv(null)} onEdit=${() => setOv({ type: "edit", m: ov.m })} onDelete=${() => setOv({ type: "confirmDel", m: ov.m })}/>` : null}
    ${ov && ov.type === "edit" ? html`<${EditMission} s=${s} m=${ov.m} season=${ov.season} onSave=${m => { saveMission(m); setOv(null); flash(ov.m ? "Episode updated" : "Episode added", m.title); }} onClose=${() => setOv(null)}/>` : null}
    ${ov && ov.type === "confirmDel" ? html`<${ConfirmDelete} m=${ov.m} onYes=${() => { deleteMission(ov.m.id); setOv(null); flash("Episode deleted", ov.m.title); }} onNo=${() => setOv({ type: "brief", m: ov.m, opts: {} })}/>` : null}
    ${ov && ov.type === "review" ? html`<${Review} s=${s} onSubmit=${finishReview} onBack=${() => { update(n => { if (n.active && n.active.pausedAt) { n.active.pausedMs += Date.now() - n.active.pausedAt; n.active.pausedAt = null; } }); setOv(null); }}/>` : null}
    ${ov && ov.type === "result" ? html`<${Result} s=${s} d=${d} coach=${coach} res=${ov} prio=${prio} byId=${byId} daily=${daily} onNext=${(m, o) => openBrief(m, o || {})} onBreak=${() => startBreak(10, null)} goTool=${goTool} onClose=${() => { setOv(null); setView("home"); browseStart.current = Date.now(); }}/>` : null}
    ${ov && ov.type === "boss" ? html`<${BossFight} s=${s} coach=${coach} goTool=${goTool} prio=${prio} fromPlayer=${ov.fromPlayer}
        onClose=${() => { if (ov.fromPlayer) update(n => { if (n.active && n.active.pausedAt) { n.active.pausedMs += Date.now() - n.active.pausedAt; n.active.pausedAt = null; } }); setOv(null); }}
        onDone=${(log, next) => {
          const gains = {}; if (log.choice === "return") gains.discipline = 10; if (log.choice === "shrink") gains.courage = 10;
          const xp = Object.values(gains).reduce((a, b) => a + b, 0);
          update(n => { n.urges.push(Object.assign({ id: uid(), ts: Date.now(), gains, xp }, log)); });
          if (next.type === "return") {
            if (ov.fromPlayer && s.active) { update(n => { if (n.active) { if (n.active.pausedAt) { n.active.pausedMs += Date.now() - n.active.pausedAt; n.active.pausedAt = null; } n.active.viaBoss = true; } }); setOv(null); }
            else { const m = prio || activeMissions(s)[0]; if (m) startMission(m, 2, m.firstStep, { viaBoss: true }); else setOv(null); }
          } else if (next.type === "break") {
            if (ov.fromPlayer && s.active) finishBreakFromPlayer();
            startBreak(next.min, null);
          } else if (next.type === "shrink") {
            const base = (ov.fromPlayer && s.active && byId(s.active.mid)) || prio || activeMissions(s)[0];
            const small = { id: uid(), season: base ? base.season : 1, title: next.text.slice(0, 70), desc: "A shrunken version of " + (base ? `"${base.title}"` : "your task") + ", made during an urge boss fight.", minutes: 2, difficulty: "Easy", attr: base ? base.attr : "courage", tags: base ? base.tags : ["other"], firstStep: next.text, deliverable: "", repeat: false, status: "active" };
            if (ov.fromPlayer && s.active) finishBreakFromPlayer("Swapped for a smaller action during an urge fight.");
            startMission(small, next.min || 2, next.text, { viaBoss: true });
          }
        }}/>` : null}
    ${ov && ov.type === "breakOver" ? html`<${BreakOver} s=${s} coach=${coach} prio=${prio}
        onReturn=${() => { update(n => { n.brk = null; }); const m = prio || activeMissions(s)[0]; if (m) startMission(m, 2, m.firstStep, { viaBoss: true }); else setOv(null); }}
        onExtend=${() => { update(n => { n.brk = { start: n.brk ? n.brk.start : Date.now(), until: Date.now() + 5 * 60000, min: 5, extended: true }; }); setOv(null); }}
        onDone=${() => { update(n => { n.brk = null; }); setOv(null); }}/>` : null}
    ${ov && ov.type === "help" ? html`<${HelpSheet} onClose=${() => setOv(null)}/>` : null}
    ${ov && ov.type === "more" ? html`<${MoreSheet} view=${view} onGo=${k => { setView(k); setOv(null); try { window.scrollTo(0, 0); } catch (e) {} }} onSettings=${() => setOv({ type: "settings" })} onClose=${() => setOv(null)}/>` : null}
    ${ov && ov.type === "settings" ? html`<${Settings} s=${s} update=${update} setS=${setS} downloads=${downloads.current} onClose=${() => setOv(null)} flash=${flash} openCoach=${() => setOv({ type: "coachPick" })}/>` : null}

    ${toast ? html`<div className="toast" role="status" key=${toast.id}><span className="avatar mentor" aria-hidden="true">★</span><div><div style=${{ fontWeight: 800 }}>${toast.t}</div>${toast.sub ? html`<div className="dim" style=${{ fontSize: "13px" }}>${toast.sub}</div>` : null}</div></div>` : null}
  <//>`;

  function finishBreakFromPlayer(why) {
    // The player chose a break mid-mission: close the session as partial progress, honestly timed.
    const a = sRef.current.active; if (!a) return;
    const m = byId(a.mid); if (!m) { update(n => { n.active = null; }); return; }
    const end = a.pausedAt || Date.now();
    const actual = Math.round(clamp((end - a.startTs - a.pausedMs) / 1000, 0, 6 * 3600));
    const outcome = actual >= 60 ? "partial" : "distracted";
    const gains = sessionGains(sRef.current, m, outcome, actual, a.plannedSec, a);
    const xp = Object.values(gains).reduce((x, y) => x + y, 0);
    update(n => { n.sessions.push({ id: uid(), mid: m.id, title: m.title, season: m.season, attr: m.attr, tags: m.tags || [], planned: a.plannedSec, actual, outcome, xp, gains, ts: Date.now(), day: dayKey(), note: why || "Stopped for a planned break.", target: a.target, fromAvoid: a.fromAvoid, viaBoss: a.viaBoss }); n.active = null; });
  }
}

function beep() {
  try {
    const ac = window.__ac || new (window.AudioContext || window.webkitAudioContext)(); window.__ac = ac;
    [0, 0.25, 0.5].forEach((t, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = [660, 880, 990][i]; g.gain.setValueAtTime(0.0001, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(0.25, ac.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.35); o.connect(g).connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.4); });
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } catch (e) {}
}

function SaveStatus() {
  const L = Store.local, C = Store.cloud;
  let cls = "save-dot", txt;
  const ago = Store.lastSync ? Math.round((Date.now() - Store.lastSync) / 1000) : null;
  const agoTxt = ago === null ? "" : ago < 60 ? ` · synced ${ago}s ago` : ago < 3600 ? ` · synced ${Math.round(ago / 60)} min ago` : ` · synced ${Math.round(ago / 3600)} h ago`;
  if (C === "ok") { cls += " cloud"; txt = "Saved on this device and synced to your Claude account" + agoTxt; }
  else if (C === "full") { cls += " bad"; txt = "Account storage is full; saved on this device only. Export a backup."; }
  else if (C === "connecting") { cls += " ok"; txt = "Saved on this device · connecting to your account…"; }
  else if (L === "ok") { cls += " ok"; txt = C === "error" ? "Saved on this device only (account sync failed)" : "Saved on this device"; }
  else if (L === "blocked" && C !== "ok") { cls += " bad"; txt = "Not saved: browser storage is blocked here. Export your data before closing."; }
  else txt = "Checking storage…";
  return html`<span style=${{ display: "inline-flex", gap: "8px", alignItems: "center" }}><span className=${cls}></span><span>${txt}</span></span>`;
}

/* =========================================================
   PLAYER (distraction-free mission screen)
   ========================================================= */
function Player({ s, coach, update, onReview, onEscape, hidden, byId }) {
  const a = s.active;
  const [park, setPark] = useState("");
  const [parkedN, setParkedN] = useState(0);
  const pm = a && byId ? byId(a.mid) : null;
  const [t, setT] = useState(Date.now());
  const fired = useRef(false);
  useEffect(() => { const i = setInterval(() => setT(Date.now()), 250); return () => clearInterval(i); }, []);
  useEffect(() => {
    let lock = null;
    (async () => { try { if (navigator.wakeLock) lock = await navigator.wakeLock.request("screen"); } catch (e) {} })();
    return () => { try { lock && lock.release(); } catch (e) {} };
  }, []);
  if (!a) return null;
  const elapsed = Math.max(0, ((a.pausedAt || t) - a.startTs - a.pausedMs) / 1000);
  const left = Math.max(0, a.plannedSec - elapsed);
  const paused = !!a.pausedAt;
  if (left <= 0 && !fired.current && !hidden) { fired.current = true; setTimeout(() => { beep(); update(n => { if (n.active && !n.active.pausedAt) n.active.pausedAt = n.active.startTs + n.active.pausedMs + n.active.plannedSec * 1000; }); onReview(); }, 0); }
  const size = 380, stroke = 10, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const frac = a.plannedSec ? left / a.plannedSec : 0;
  const togglePause = () => update(n => { const x = n.active; if (!x) return; if (x.pausedAt) { x.pausedMs += Date.now() - x.pausedAt; x.pausedAt = null; } else x.pausedAt = Date.now(); });
  const addFive = () => { fired.current = false; update(n => { if (n.active) n.active.plannedSec += 300; }); };
  const endEarly = () => { update(n => { if (n.active && !n.active.pausedAt) n.active.pausedAt = Date.now(); }); onReview(); };
  if (hidden) return null;
  return html`<div className=${"fullscreen" + (paused ? " paused" : "")} role="main" aria-label="Mission in progress">
    <div className="fs-in" style=${{ textAlign: "center", gap: "18px" }}>
      <div><span className="rec">${paused ? "PAUSED" : "MISSION LIVE"}</span></div>
      <h1 style=${{ fontSize: "clamp(30px,6vw,52px)", textTransform: "uppercase" }}>${a.title}</h1>
      ${a.target ? html`<p className="dim" style=${{ fontSize: "16px" }}>First action: <b style=${{ color: "var(--fg)" }}>${a.target}</b></p>` : null}
      <div className="player-ring">
        <svg viewBox=${`0 0 ${size} ${size}`} aria-hidden="true">
          <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke="var(--ink-3)" strokeWidth=${stroke}/>
          <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke=${paused ? "var(--fg-faint)" : "var(--tungsten)"} strokeWidth=${stroke} strokeLinecap="round" strokeDasharray=${c} strokeDashoffset=${c * (1 - frac)} style=${{ transition: "stroke-dashoffset .25s linear" }}/>
        </svg>
        <div className="player-center">
          <div className="player-time" role="timer" aria-live="off">${fmtClock(left)}</div>
          <div className="eyebrow">of ${fmtClock(a.plannedSec)} · ${fmtClock(elapsed)} focused</div>
        </div>
      </div>
      <div className="btn-row" style=${{ justifyContent: "center" }}>
        <button className="btn btn-primary" onClick=${togglePause}>${paused ? "▶ Resume" : "❚❚ Pause"}</button>
        <button className="btn btn-ghost" onClick=${addFive}>+5 min</button>
        <button className="btn btn-ghost" onClick=${endEarly}>Finish & review</button>
      </div>
      ${pm && pm.link ? html`<a className="btn btn-line" href=${pm.link} target="_blank" rel="noopener noreferrer" style=${{ alignSelf: "center", textDecoration: "none" }}>Open the lesson ↗</a>` : null}
      <form className="park" onSubmit=${e => { e.preventDefault(); const t = park.trim(); if (!t) return; update(n => { n.parked.push({ id: uid(), ts: Date.now(), text: t, mid: a.mid, status: "inbox" }); }); setPark(""); setParkedN(parkedN + 1); }}>
        <input id="player-park" value=${park} onInput=${e => setPark(e.target.value)} placeholder="Stray thought? Park it here instead of acting on it" aria-label="Park a stray thought"/>
        <button className="btn btn-ghost" type="submit" disabled=${!park.trim()}>Park</button>
      </form>
      ${parkedN ? html`<p className="note" style=${{ marginTop: "-10px" }}>${parkedN} parked. You'll sort them after the mission.</p>` : null}
      <button className="btn btn-danger" style=${{ alignSelf: "center" }} onClick=${onEscape}>I want to escape this task</button>
      <p className="note">${coach === "brutal" ? "Close every other tab. This screen is all you need. The phone stays face down." : "Just this one thing. If your mind wanders, notice it and come back to the first action."}</p>
    </div>
  </div>`;
}

        <button className="choice" onClick=${() => onSubmit("partial", note)}><span className="ic" style=${{ color: "var(--warn)" }}>◐</span><div><div>I made partial progress</div><div className="note" style=${{ fontWeight: 500 }}>Real work happened, but it isn't finished.</div></div></button>

      </div>
      <label className="f" htmlFor="rv-note">Optional note: where to resume, or what got in the way
        <input id="rv-note" value=${note} onInput=${e => setNote(e.target.value)} placeholder="e.g. Stopped at bullet 2, need the project value from the FAT report"/>
      </label>
      <button className="btn btn-line btn-sm" style=${{ alignSelf: "flex-start" }} onClick=${onBack}>← Back to the timer</button>
    </div>
  </div>`;
}

/* =========================================================
   RESULT + EXIT TO REAL LIFE
