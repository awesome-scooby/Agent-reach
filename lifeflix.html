function Result({ s, d, coach, res, prio, byId, daily, onNext, onBreak, onClose, goTool }) {
  const { sess, m, newAch } = res;
  const [shown, setShown] = useState(0);
  useEffect(() => { let v = 0; const step = Math.max(1, Math.round(sess.xp / 30)); const t = setInterval(() => { v = Math.min(sess.xp, v + step); setShown(v); if (v >= sess.xp) clearInterval(t); }, 25); return () => clearInterval(t); }, []);
  const line = useMemo(() => coachReview(coach, sess.outcome, m, Math.round(sess.actual / 60)), []);
  const ach = achievements(s, d).filter(a => newAch.includes(a.id));
  const parkedNow = s.parked.filter(x => x.mid === m.id && x.status === "inbox" && x.ts >= sess.ts - sess.actual * 1000 - 120000);
  const ids = [daily.priority, ...(daily.support || []), daily.wellbeing].filter(Boolean);
  const nextM = ids.map(byId).filter(x => x && x.status === "active" && !d.todays.some(z => z.mid === x.id && z.outcome === "done"))[0];
  const smaller = sess.outcome === "distracted" ? Object.assign({}, m) : null;
  return html`<div className="fullscreen" role="dialog" aria-modal="true" aria-label="Mission result">
    <div className="fs-in">
      <span className="eyebrow">${sess.outcome === "done" ? "Episode complete" : sess.outcome === "partial" ? "Partial progress logged" : "Logged honestly"} · ${fmtMin(sess.actual / 60)} focused</span>
      <div className="xp-pop" aria-label=${sess.xp + " XP earned"}>+${shown} XP</div>
      ${Object.keys(sess.gains).length ? html`<div style=${{ display: "grid", gap: "6px", gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))" }}>
        ${Object.entries(sess.gains).map(([k, v], i) => html`<div key=${k} className="gain" style=${{ animationDelay: i * 0.08 + "s" }}><span style=${{ color: ATTRS[k].color }}>${ATTRS[k].label}</span><span className="mono">+${v}</span></div>`)}
      </div>` : html`<p className="dim" style=${{ textAlign: "center" }}>No XP this time. That's the honest result, and it's still useful data.</p>`}
      ${parkedNow.length ? html`<div className="panel"><h3>You parked ${parkedNow.length} thought${parkedNow.length > 1 ? "s" : ""}</h3><ul className="list">${parkedNow.map(x => html`<li key=${x.id}><span>${x.text}</span></li>`)}</ul><div><button className="btn btn-sm btn-line" onClick=${() => goTool("parked")}>Sort them now</button></div></div>` : null}
      ${m.prog === "learn" && sess.outcome !== "distracted" ? html`<div className="rx"><span className="eyebrow" style=${{ color: "var(--tungsten)" }}>Make it stick</span><p>Before you close the lesson tab: write the three key points from memory. Recalling it now is what moves it into long-term memory.</p><div><button className="btn btn-sm btn-amber" onClick=${() => goTool("learn", { recall: true })}>Recall check (2 min)</button></div></div>` : null}
      ${ach.map(a => html`<div key=${a.id} className="badge on" style=${{ animation: "pop .7s cubic-bezier(.2,1.4,.4,1) both" }}><div className="medal">★</div><div><div className="eyebrow" style=${{ color: "var(--tungsten)" }}>Achievement unlocked</div><div className="bt">${a.t}</div><div className="bd">${a.dsc}</div></div></div>`)}
      <div className=${"coach-band " + coach}><span className=${"avatar " + coach}>${COACH[coach].init}</span><div><div className="who">${COACH[coach].name}</div><p>${line}</p></div></div>
      <div className="panel" style=${{ background: "var(--ink-2)" }}>
        <h3>Now leave the app</h3>
        <p className="dim">${nextM ? html`The next real-world action is <b style=${{ color: "var(--fg)" }}>${nextM.title}</b>. Start it now, take a planned break, or close LIFEFLIX and get on with your day.` : "Today's episode is covered. Close LIFEFLIX and go live the part of the series that happens off-screen."}</p>
        <div className="btn-row">
          ${smaller ? html`<button className="btn btn-amber" onClick=${() => onNext(smaller, { minutes: 2 })}>Retry as 2 minutes</button>` : null}
          ${nextM && !smaller ? html`<button className="btn btn-amber" onClick=${() => onNext(nextM)}>Start: ${nextM.title}</button>` : null}
          <button className="btn btn-ghost" onClick=${onBreak}>10-minute planned break</button>
          ${sess.outcome !== "done" ? html`<button className="btn btn-ghost" onClick=${() => goTool("diag", { mid: m.id })}>Diagnose why (1 min)</button>` : null}
          <button className="btn btn-line" onClick=${onClose}>Done for now</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* =========================================================
   URGE BOSS FIGHT
   ========================================================= */
function BossFight({ s, coach, prio, fromPlayer, onClose, onDone, goTool }) {
  const [step, setStep] = useState(0);
  const [urge, setUrge] = useState(null);
  const [other, setOther] = useState("");
  const [before, setBefore] = useState(7);
  const [after, setAfter] = useState(5);
  const [genuine, setGenuine] = useState(null);
  const [choice, setChoice] = useState(null);
  const [secs, setSecs] = useState(0);
  const [shrinkText, setShrinkText] = useState("");
  const [brkMin, setBrkMin] = useState(10);
  const BREATH = 72;
  useEffect(() => { if (step !== 2) return; const t0 = Date.now(); const i = setInterval(() => setSecs(Math.min(BREATH, (Date.now() - t0) / 1000)), 200); return () => clearInterval(i); }, [step]);
  const boss = urge ? URGES[urge].boss : "The Urge";
  const phase = (() => { const c = secs % 12; return c < 4 ? "Breathe in" : c < 6 ? "Hold" : "Breathe out"; })();
  const hp = step < 2 ? before * 10 : step === 2 ? Math.round(before * 10 - (before * 10 * 0.6) * (secs / BREATH)) : after * 10;
  const curTask = fromPlayer && s.active ? s.active.title : prio ? prio.title : "your task";
  const pastUrges = s.urges.filter(u => u.urge === urge);
  const log = () => ({ urge, urgeText: urge === "other" ? other : "", before, after, genuine, choice, mid: (fromPlayer && s.active) ? s.active.mid : prio ? prio.id : null, fromPlayer: !!fromPlayer });
  return html`<div className="fullscreen" role="dialog" aria-modal="true" aria-label="Urge boss fight" style=${{ background: "radial-gradient(80% 60% at 50% 0%, rgba(232,65,74,.18), transparent 60%), var(--ink)" }}>
    <div className="fs-in">
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: "12px" }}>
        <span className="eyebrow" style=${{ color: "var(--crimson)" }}>Urge boss fight · Round ${Math.min(step + 1, 5)} of 5</span>
        <button className="btn btn-sm btn-line" onClick=${onClose}>${fromPlayer ? "Back to mission" : "Close"}</button>
      </div>
      <div>
        <div style=${{ display: "flex", justifyContent: "space-between", marginBottom: "6px" }}><b style=${{ fontFamily: "var(--display)", fontSize: "24px", textTransform: "uppercase", letterSpacing: ".03em" }}>${boss}</b><span className="mono dim">${Math.max(0, hp)} HP</span></div>
        <div className="boss-hp" role="progressbar" aria-label="Urge strength" aria-valuemin="0" aria-valuemax="100" aria-valuenow=${Math.max(0, hp)}><i style=${{ width: clamp(hp, 0, 100) + "%" }}></i></div>
      </div>

      ${step === 0 ? html`<${React.Fragment}>
        <h1 style=${{ fontSize: "clamp(36px,7vw,64px)", textTransform: "uppercase" }}>What do you feel like doing instead?</h1>
        <p className="dim">You were about to leave "${curTask}". Name the urge. Urges are normal; acting on them automatically is the habit we're changing.</p>
        <div className="choice-grid">${Object.entries(URGES).map(([k, u]) => html`<button key=${k} className="choice" aria-pressed=${urge === k} onClick=${() => { setUrge(k); if (k !== "other") setStep(1); }}>${u.label}</button>`)}</div>
        ${urge === "other" ? html`<div style=${{ display: "flex", gap: "8px" }}><input id="boss-other" autoFocus placeholder="What's pulling at you?" value=${other} onInput=${e => setOther(e.target.value)}/><button className="btn btn-amber" disabled=${!other.trim()} onClick=${() => setStep(1)}>Next</button></div>` : null}
      <//>` : null}

      ${step === 1 ? html`<${React.Fragment}>
        <h1 style=${{ fontSize: "clamp(36px,7vw,64px)", textTransform: "uppercase" }}>How strong is the urge?</h1>
        <label className="f" htmlFor="boss-before">Urge intensity: <span className="mono" style=${{ color: "var(--fg)", fontSize: "20px" }}>${before}/10</span>
          <input id="boss-before" type="range" min="0" max="10" value=${before} onInput=${e => setBefore(Number(e.target.value))}/>
        </label>
        ${pastUrges.length ? html`<p className="note">You've faced ${boss} ${pastUrges.length} time${pastUrges.length > 1 ? "s" : ""} before. Average intensity after breathing: ${(pastUrges.reduce((a, u) => a + u.after, 0) / pastUrges.length).toFixed(1)}/10.</p>` : null}
        <p className="dim">Next: 72 seconds of slow breathing. Urges rise, peak and fade like a wave, usually within a few minutes, if you don't feed them.</p>
        <button className="btn btn-amber" onClick=${() => { setSecs(0); setStep(2); }}>Start breathing</button>
      <//>` : null}

      ${step === 2 ? html`<${React.Fragment}>
        <div className="breath" aria-hidden="true"><div className="ring"></div><div className="orb"></div><div className="lbl">${phase}</div></div>
        <p className="sr" aria-live="polite" style=${{ textAlign: "center", fontWeight: 700 }}>${phase} · <span className="mono">${Math.ceil(BREATH - secs)}s</span></p>
        <p className="dim" style=${{ textAlign: "center" }}>In for 4, hold for 2, out for 6. Notice where the urge sits in your body. You don't have to do anything about it.</p>
        <button className="btn btn-amber" style=${{ alignSelf: "center" }} disabled=${secs < BREATH && secs < 45} onClick=${() => { setAfter(Math.max(0, before - 2)); setStep(3); }}>${secs >= BREATH ? "Continue" : secs >= 45 ? "I'm ready" : "Keep breathing…"}</button>
      <//>` : null}

      ${step === 3 ? html`<${React.Fragment}>
        <h1 style=${{ fontSize: "clamp(32px,6vw,56px)", textTransform: "uppercase" }}>Is this something you genuinely want, or are you escaping discomfort?</h1>
        <label className="f" htmlFor="boss-after">Urge intensity now: <span className="mono" style=${{ color: "var(--fg)", fontSize: "20px" }}>${after}/10</span> <span className="faint">(was ${before})</span>
          <input id="boss-after" type="range" min="0" max="10" value=${after} onInput=${e => setAfter(Number(e.target.value))}/>
        </label>
        <div className="seg" role="group" aria-label="Genuine want or escape">
          <button aria-pressed=${genuine === "want"} onClick=${() => setGenuine("want")}>I genuinely want it</button>
          <button aria-pressed=${genuine === "escape"} onClick=${() => setGenuine("escape")}>I'm escaping discomfort</button>
          <button aria-pressed=${genuine === "unsure"} onClick=${() => setGenuine("unsure")}>Not sure</button>
        </div>
        <button className="btn btn-amber" disabled=${!genuine} onClick=${() => setStep(4)}>Choose your move</button>
      <//>` : null}

      ${step === 4 ? html`<${React.Fragment}>
        <h1 style=${{ fontSize: "clamp(36px,7vw,64px)", textTransform: "uppercase" }}>Your move</h1>
        <p className="dim">${coach === "brutal" ? "All three are legitimate. Choosing beats drifting. Pick on purpose." : "There's no wrong answer here. A planned break is a good choice. Drifting is the only thing we're avoiding."}</p>
        <div style=${{ display: "grid", gap: "10px" }}>
          <button className="choice" aria-pressed=${choice === "return"} onClick=${() => setChoice("return")}><span className="ic">↩</span><div><div>Return to my mission for just 2 minutes</div><div className="note" style=${{ fontWeight: 500 }}>${fromPlayer ? "Your paused timer resumes." : `Starts 2 minutes on "${curTask}".`} +10 Discipline</div></div></button>
          <button className="choice" aria-pressed=${choice === "break"} onClick=${() => setChoice("break")}><span className="ic">☕</span><div><div>Take a deliberate, time-limited break</div><div className="note" style=${{ fontWeight: 500 }}>Enjoy it fully. A timer calls you back.</div></div></button>
          <button className="choice" aria-pressed=${choice === "shrink"} onClick=${() => setChoice("shrink")}><span className="ic">⇲</span><div><div>Change the task into a smaller action</div><div className="note" style=${{ fontWeight: 500 }}>Make it so small it's hard to refuse. +10 Courage</div></div></button>
        </div>
        ${choice === "break" ? html`<div><div className="eyebrow" style=${{ marginBottom: "8px" }}>Break length</div><div className="seg" role="group" aria-label="Break length">${[5, 10, 15, 20].map(n => html`<button key=${n} aria-pressed=${brkMin === n} onClick=${() => setBrkMin(n)}>${n} min</button>`)}</div>${fromPlayer ? html`<p className="note" style=${{ marginTop: "8px" }}>Your current mission will be logged as partial progress with the time you've actually spent.</p>` : null}</div>` : null}
        ${s.woop.filter(w => w.active).length ? html`<div className="note"><b style=${{ color: "var(--tungsten)" }}>You planned for this moment:</b> ${s.woop.filter(w => w.active).slice(-2).map(w => `If ${w.ifs}, then ${w.then}.`).join(" ")}</div>` : null}
        ${choice === "break" && s.programs.bank.on ? html`<div className="note"><b style=${{ color: "var(--s2)" }}>Screen bank:</b> ${bankBalance(s)} min earned and available. Spend it from Tools › Screen-time bank, and it's guilt-free.</div>` : null}
        ${choice === "break" && s.bundles.length ? html`<div className="note"><b style=${{ color: "var(--s2)" }}>Better deal:</b> save "${s.bundles[0].want}" for your bundled mission instead of spending it now.</div>` : null}
        ${choice === "shrink" ? html`<label className="f" htmlFor="boss-shrink">The smaller action (2 minutes)
          <input id="boss-shrink" autoFocus value=${shrinkText} onInput=${e => setShrinkText(e.target.value)} placeholder=${"e.g. Write only the first sentence of " + curTask}/></label>` : null}
        <button className="btn btn-amber" disabled=${!choice || (choice === "shrink" && !shrinkText.trim())} onClick=${() => setStep(5)}>Lock it in</button>
      <//>` : null}

      ${step === 5 ? html`<${React.Fragment}>
        <h1 style=${{ fontSize: "clamp(36px,7vw,64px)", textTransform: "uppercase" }}>${before - after >= 2 ? boss + " weakened" : "You chose on purpose"}</h1>
        <p className="mono dim">Urge ${before}/10 → ${after}/10</p>
        <div className=${"coach-band " + coach}><span className=${"avatar " + coach}>${COACH[coach].init}</span><div><div className="who">${COACH[coach].name}</div><p>${coachBoss(coach, choice, urge, genuine)}</p></div></div>
        <button className="btn btn-amber" onClick=${() => onDone(log(), choice === "return" ? { type: "return" } : choice === "break" ? { type: "break", min: brkMin } : { type: "shrink", text: shrinkText.trim(), min: 2 })}>
          ${choice === "return" ? "▶ Back to it: 2 minutes" : choice === "break" ? `Start ${brkMin}-minute break` : "▶ Start the small version"}
        </button>
      <//>` : null}
    </div>
  </div>`;
}

function BreakOver({ s, coach, prio, onReturn, onExtend, onDone }) {
  const ext = s.brk && s.brk.extended;
  return html`<div className="fullscreen" role="dialog" aria-modal="true" aria-label="Break is over">
    <div className="fs-in">
      <span className="eyebrow" style=${{ color: "var(--s2)" }}>Planned break complete</span>
      <h1 style=${{ fontSize: "clamp(44px,9vw,88px)", textTransform: "uppercase" }}>Break's over.</h1>
      <p style=${{ fontSize: "17px" }}>${coach === "brutal" ? `You took the break you chose. That was the deal. Now honour the other half: two minutes on "${prio ? prio.title : "your priority"}".` : `Hope that was a good break. Let's ease back in. Just two minutes on "${prio ? prio.title : "your priority"}" and see how it feels.`}</p>
      <div className="btn-row">
        <button className="btn btn-amber" onClick=${onReturn}>▶ Return for 2 minutes</button>
        ${!ext ? html`<button className="btn btn-ghost" onClick=${onExtend}>Extend 5 minutes (once)</button>` : null}

/* =========================================================
   TODAY (daily episode engine)
   ========================================================= */
function Today({ s, d, prio, coach, daily, byId, openBrief, setOv, update, goTool, quickLog }) {
  const today = d.today;
  const [intent, setIntent] = useState(daily.intention || "");
  const [reviewing, setReviewing] = useState(false);
  useEffect(() => setIntent(daily.intention || ""), [today]);
  const slots = [["priority", "High-impact priority", daily.priority], ["support0", "Supporting mission", (daily.support || [])[0]], ["support1", "Supporting mission", (daily.support || [])[1]], ["wellbeing", "Wellbeing action", daily.wellbeing]];
  const doneIds = new Set(d.todays.filter(x => x.outcome === "done").map(x => x.mid));
  const partIds = new Set(d.todays.filter(x => x.outcome === "partial").map(x => x.mid));
  const swap = (key) => update(n => {
    const dd = n.daily[today]; if (!dd) return;
    const cur = key === "priority" ? dd.priority : key === "wellbeing" ? dd.wellbeing : dd.support[Number(key.slice(-1))];
    const used = new Set([dd.priority, dd.wellbeing, ...(dd.support || [])]);
    const curM = n.missions.find(x => x.id === cur);
    const wantHealth = key === "wellbeing";
    const pool = n.missions.filter(m => m.status === "active" && !used.has(m.id) && (wantHealth ? m.attr === "health" : m.attr !== "health"));
    if (!pool.length) return;
    const idx = Math.floor(hashStr(cur + Date.now()) * pool.length);
    const pick = pool[idx].id;
    if (key === "priority") dd.priority = pick; else if (key === "wellbeing") dd.wellbeing = pick; else dd.support[Number(key.slice(-1))] = pick;
  });
  // research trap + car question
  const wk = s.urges.filter(u => (Date.now() - u.ts) < 7 * 86400000);
  const ideaUrges = wk.filter(u => u.urge === "ideas").length;
  const bizPartials = s.sessions.filter(x => (x.tags || []).includes("business") && x.outcome === "partial" && (Date.now() - x.ts) < 7 * 86400000).length;
  const carUrges = wk.filter(u => u.urge === "products").length;
  const contact = s.missions.find(x => x.title === "Contact One Potential Customer" && x.status === "active");
  const [carAns, setCarAns] = useState(null);
  const planned = slots.map(x => x[2]).filter(Boolean);
  const plannedDone = planned.filter(id => doneIds.has(id)).length;
  const prioDone = prio && doneIds.has(prio.id);
  return html`<div className="wrap section">
    <div className="row-head" style=${{ alignItems: "flex-end", flexWrap: "wrap" }}>
      <div><span className="eyebrow">${seasonOf(1).code}:E${pad(Math.min(d.dayN, 30))} · ${niceDate(today)}</span><h2 style=${{ fontSize: "clamp(38px,7vw,64px)", marginTop: "6px" }}>Today's Episode</h2></div>
      <div className="mono dim" style=${{ fontSize: "13px" }}>${plannedDone}/${planned.length} done · ${d.minsToday} focused min · ${d.urgesToday.length} urges fought</div>
    </div>

    <${ProgramsToday} s=${s} d=${d} coach=${coach} openBrief=${openBrief} quickLog=${quickLog} goTool=${goTool}/>
    <div className="panel" style=${{ marginBottom: "14px" }}>
      <label className="f" htmlFor="today-intent">Implementation intention: when and where will the priority happen?
        <input id="today-intent" value=${intent} placeholder=${prio ? `When I sit down after breakfast at my desk, I will ${(prio.firstStep || "start " + prio.title).replace(/\.$/, "").toLowerCase()}.` : "When ___ at ___, I will ___."} onInput=${e => setIntent(e.target.value)} onBlur=${() => update(n => { if (n.daily[today]) n.daily[today].intention = intent; })}/>
      </label>
      <p className="note">Plans that name a time, a place and a first action are far more likely to happen than "I'll do it today".</p>
    </div>

    <div style=${{ display: "grid", gap: "10px" }}>
      ${slots.map(([key, lab, id]) => { const m = byId(id); if (!m) return html`<div key=${key} className="slot"><div></div><div className="dim">No mission available for this slot. Add one from Home.</div><div></div></div>`;
        const st = doneIds.has(m.id) ? html`<span className="chip ok">Done</span>` : partIds.has(m.id) ? html`<span className="chip warn">Partial</span>` : null;
        return html`<div key=${key} className=${"slot" + (key === "priority" ? " prio" : "")}>
          <div className="slot-thumb"><${Thumb} s=${s} m=${m}/></div>
          <div style=${{ minWidth: 0 }}><div className="lab">${lab} · ${m.minutes} min · ${xpFor(m.minutes, m.difficulty)} XP</div><div className="ti">${m.title} ${st}</div><div className="note">${m.deliverable || m.desc}</div></div>
          <div className="acts">
            <button className="btn btn-sm btn-amber" onClick=${() => openBrief(m, {})}>▶ Start</button>
            ${key === "priority" ? html`<button className="btn btn-sm btn-line" onClick=${() => openBrief(m, { minutes: 2 })}>Overwhelmed: 2 min</button>` : null}
            <button className="btn btn-sm btn-line" onClick=${() => swap(key)} aria-label=${"Swap " + lab}>Swap</button>
            <input type="time" id=${"slot-time-" + key} aria-label=${"Scheduled time for " + lab} value=${(daily.times || {})[key] || ""} onChange=${e => { const v = e.target.value; update(n => { const dd = n.daily[today]; if (dd) { dd.times = dd.times || {}; dd.times[key] = v; } }); }} style=${{ width: "auto", padding: "6px 8px", fontFamily: "var(--mono)", fontSize: "13px" }}/>
          </div>
        </div>`; })}
    </div>

    ${(ideaUrges >= 2 || bizPartials >= 2) ? html`<div className="challenge" style=${{ marginTop: "16px" }}>
      <span className="eyebrow" style=${{ color: "var(--crimson)" }}>Research trap detected</span>
      <b style=${{ fontSize: "17px" }}>${ideaUrges >= 2 ? `You've wanted to browse business ideas ${ideaUrges} times this week.` : `${bizPartials} business sessions this week ended as "partial".`}</b>
      <p className="dim">${coach === "brutal" ? "More research won't produce a customer. Choose one offer and contact one potential customer. Today." : "Exploring feels productive because it's safe. Let's trade one research session for one real conversation."}</p>
      ${contact ? html`<div><button className="btn btn-sm btn-amber" onClick=${() => openBrief(contact, {})}>▶ Contact one potential customer</button></div>` : null}
    </div>` : null}

    ${carUrges >= 1 ? html`<div className="challenge" style=${{ marginTop: "16px" }}>
      <span className="eyebrow" style=${{ color: "var(--crimson)" }}>Spec-Sheet Hydra check</span>
      <b style=${{ fontSize: "17px" }}>You've wanted to research cars or products ${carUrges} time${carUrges > 1 ? "s" : ""} this week. Is this research needed for a decision you're ready to make in the next 30 days?</b>
      ${carAns === null ? html`<div className="btn-row"><button className="btn btn-sm btn-line" onClick=${() => setCarAns("yes")}>Yes, I'm deciding soon</button><button className="btn btn-sm btn-line" onClick=${() => setCarAns("no")}>No, honestly</button></div>` : null}
      ${carAns === "yes" ? html`<p className="dim">Then make it a decision session, not a browsing session: 25 minutes, a written budget ceiling, three options, one choice. Add it as an episode.</p><div><button className="btn btn-sm btn-amber" onClick=${() => setOv({ type: "edit", m: null, season: 5 })}>Add a 25-min decision episode</button></div>` : null}
      ${carAns === "no" ? html`<p className="dim">${coach === "brutal" ? "Then it's entertainment wearing a productivity costume. Park it until the $150K offer lands." : "That's an honest answer. Park the browsing for a planned break, and treat it as fun rather than progress."}</p>` : null}
    </div>` : null}

    <div className="panel" style=${{ marginTop: "16px" }}>
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: "10px", flexWrap: "wrap" }}>
        <h3>End-of-day review</h3>
        ${daily.review ? html`<span className="chip ok">Reviewed</span>` : html`<button className="btn btn-sm btn-amber" onClick=${() => setReviewing(true)}>Review today</button>`}
      </div>
      ${reviewing || daily.review ? html`<${DayReview} s=${s} d=${d} coach=${coach} daily=${daily} byId=${byId} prioDone=${prioDone} plannedDone=${plannedDone} planned=${planned.length} doneIds=${doneIds}
        onSave=${rv => { update(n => { n.daily[today].review = rv; if (rv.block) n.excuses.push({ id: uid(), ts: Date.now(), text: rv.block, src: "day review" }); const tk = addDays(today, 1); if (!n.daily[tk]) n.daily[tk] = genDaily(n, tk); if (rv.tomorrow) n.daily[tk].intention = rv.tomorrow; }); setReviewing(false); }}/>` : html`<p className="dim">At the end of the day, take two minutes to compare what you planned with what happened.</p>`}
    </div>
  </div>`;
}

function DayReview({ s, d, coach, daily, byId, prioDone, plannedDone, planned, doneIds, onSave }) {
  const [rating, setRating] = useState(daily.review ? daily.review.rating : 0);
  const [block, setBlock] = useState(daily.review ? daily.review.block : "");
  const [tomorrow, setTomorrow] = useState(daily.review ? daily.review.tomorrow : "");
  const prio = byId(daily.priority);
  const lines = [];
  lines.push(`You planned ${planned} missions and completed ${plannedDone}.`);
  lines.push(prioDone ? `The priority, "${prio.title}", is done.` : prio ? `The priority, "${prio.title}", was not completed.` : "");
  lines.push(`${d.minsToday} focused minutes across ${d.todays.length} session${d.todays.length === 1 ? "" : "s"}${d.distractedToday ? `, ${d.distractedToday} lost to distraction` : ""}.`);
  if (d.urgesToday.length) lines.push(`${d.urgesToday.length} urge${d.urgesToday.length > 1 ? "s" : ""} fought: ${d.urgesToday.filter(u => u.choice !== "break").length} turned back to work, ${d.urgesToday.filter(u => u.choice === "break").length} planned break${d.urgesToday.filter(u => u.choice === "break").length === 1 ? "" : "s"}.`);
  const verdict = prioDone ? (coach === "brutal" ? "Verdict: a day that moved your life forward. Repeat it." : "Verdict: you did what mattered. That's a good day.")
    : d.minsToday >= 25 ? (coach === "brutal" ? "Verdict: busy, but the priority waited. Tomorrow it goes first, before anything easy." : "Verdict: real effort, just not on the main thing. Tomorrow, let's put the priority first.")
    : (coach === "brutal" ? "Verdict: not much moved today. That's a fact about today, not about who you are. Tomorrow's first action decides the next one." : "Verdict: a quiet day. It happens. The most useful thing now is a tiny, specific plan for tomorrow morning.");
  return html`<div style=${{ display: "flex", flexDirection: "column", gap: "12px" }}>
    <div style=${{ display: "grid", gap: "4px" }}>${lines.filter(Boolean).map((l, i) => html`<p key=${i}>${l}</p>`)}<p style=${{ fontWeight: 800, marginTop: "4px" }}>${verdict}</p></div>
    <div><div className="eyebrow" style=${{ marginBottom: "6px" }}>How did today go, by your own standard?</div>
      <div className="seg" role="group" aria-label="Rating">${[1, 2, 3, 4, 5].map(n => html`<button key=${n} aria-pressed=${rating === n} onClick=${() => setRating(n)}>${n}</button>`)}</div></div>
    <label className="f" htmlFor="dr-block">What got in the way? (genuine obstacle or avoidance? Be specific)<input id="dr-block" value=${block} onInput=${e => setBlock(e.target.value)}/></label>
    <label className="f" htmlFor="dr-tom">Tomorrow's first action (becomes tomorrow's intention)<input id="dr-tom" value=${tomorrow} onInput=${e => setTomorrow(e.target.value)} placeholder="When I get to my desk at 7:30, I will open the CV and fix bullet 2."/></label>
    <div><button className="btn btn-amber btn-sm" disabled=${!rating} onClick=${() => onSave({ rating, block, tomorrow, at: Date.now(), planned, plannedDone, mins: d.minsToday })}>${daily.review ? "Update review" : "Save review"}</button></div>
  </div>`;
}

   STATS / PLAYER DASHBOARD

function Stats({ s, d, coach, update, flash, goTool }) {

  const maxAttr = Math.max(...ATTR_KEYS.map(k => d.attr[k]), 1);
  const lvFrac = (d.total - d.lvStart) / Math.max(1, d.lvNext - d.lvStart);
  const maxWeek = Math.max(...d.week.map(w => w.min), 1);
  const urgeRows = Object.entries(d.urgeCounts).sort((a, b) => b[1] - a[1]);
  const catRows = Object.entries(d.catCounts).sort((a, b) => b[1] - a[1]);
  const maxU = Math.max(1, ...urgeRows.map(x => x[1])), maxC = Math.max(1, ...catRows.map(x => x[1]));
  const genuineEsc = s.urges.filter(u => u.genuine === "escape").length;
  const cal = []; for (let i = 0; i < 30; i++) { const k = addDays(s.seasonStart, i); cal.push({ k, i, on: d.shown.has(k), future: k > d.today, today: k === d.today }); }

  return html`<div className="wrap section" style=${{ display: "flex", flexDirection: "column", gap: "16px" }}>
    <div className="row-head"><h2 style=${{ fontSize: "clamp(38px,7vw,64px)" }}>Player</h2><span className="eyebrow">Real data only</span></div>
    <div className="grid-2">
      <div className="panel">
        <div style=${{ display: "flex", gap: "16px", alignItems: "center" }}>
          <${Ring} value=${lvFrac} size=${96} stroke=${8}><div style=${{ textAlign: "center" }}><div className="big-num" style=${{ fontSize: "36px" }}>${d.level}</div><div className="eyebrow" style=${{ fontSize: "9px" }}>Level</div></div><//>
          <div style=${{ minWidth: 0 }}><div className="eyebrow">Rank</div><div style=${{ fontFamily: "var(--display)", fontWeight: 900, fontSize: "32px", textTransform: "uppercase", lineHeight: 1 }}>${d.rank}</div>
            <div className="mono dim" style=${{ fontSize: "13px", marginTop: "6px" }}>${d.total} XP · ${d.lvNext - d.total} to level ${d.level + 1}</div></div>
        </div>
        <div className="grid-3" style=${{ gridTemplateColumns: "repeat(3,1fr)" }}>
          <div className="stat"><div className="k">Days shown up</div><div className="v">${d.shown.size}</div></div>
          <div className="stat"><div className="k">Current run</div><div className="v">${d.cur}</div></div>
          <div className="stat"><div className="k">Best run</div><div className="v">${d.best}</div></div>
          <div className="stat"><div className="k">Focus total</div><div className="v">${fmtMin(d.totalFocusMin)}</div></div>
          <div className="stat"><div className="k">Missions done</div><div className="v">${s.sessions.filter(x => x.outcome === "done").length}</div></div>
          <div className="stat"><div className="k">Urges fought</div><div className="v">${s.urges.length}</div></div>
        </div>
        <p className="note">Runs end; progress doesn't. Missing a day never removes XP, levels or badges.</p>
      </div>
      <div className="panel">
        <h3>Attributes</h3>
        <div className="grid-3" style=${{ gridTemplateColumns: "repeat(auto-fill,minmax(100px,1fr))" }}>
          ${ATTR_KEYS.map(k => { const xp = d.attr[k]; const L = levelFrom(xp, 25); const fr = (xp - levelStart(L, 25)) / Math.max(1, levelStart(L + 1, 25) - levelStart(L, 25));
            return html`<div key=${k} className="attr" title=${ATTRS[k].how}><${Ring} value=${fr} size=${64} stroke=${6} color=${ATTRS[k].color}><${Glyph} k=${k} size=${22} color=${ATTRS[k].color}/><//><div className="nm">${ATTRS[k].label}</div><div className="lv">LV ${L} · ${xp} XP</div></div>`; })}
        </div>
        <p className="note">${ATTR_KEYS.map(k => ATTRS[k].label + ": " + ATTRS[k].how.toLowerCase()).join(". ")}.</p>
      </div>
    </div>

    <div className="grid-2">
      <div className="panel">
        <h3>Focus, last 7 days</h3>
        <div className="week-chart" role="img" aria-label=${"Focused minutes per day: " + d.week.map(w => w.min).join(", ")}>
          ${d.week.map(w => html`<div key=${w.k} className="col"><span className="v">${w.min || ""}</span><div className=${"b" + (w.min ? "" : " zero")} style=${{ height: (w.min / maxWeek) * 100 + "%" }}></div><span className="dl">${DOW[(parseDay(w.k).getDay() + 6) % 7]}</span></div>`)}
        </div>
        <p className="note">14-day average: ${d.avg14} focused min/day (honest sessions only: completed or partial).</p>
      </div>
      <div className="panel">
        <h3>Season 1: The Comeback</h3>
        <div className="cal">${cal.map(c => html`<i key=${c.k} className=${(c.on ? "on " : "") + (c.future ? "future " : "") + (c.today ? "today" : "")} title=${niceDate(c.k)}>${c.i + 1}</i>`)}</div>
        <p className="note">Lit days = at least one completed or partial mission. Season started ${niceDate(s.seasonStart)}.</p>
      </div>
    </div>

    <div className="grid-2">
      <div className="panel">
        <h3>Avoidance patterns</h3>
        ${urgeRows.length || catRows.length ? html`<${React.Fragment}>
          ${urgeRows.length ? html`<div><div className="eyebrow" style=${{ marginBottom: "8px" }}>What you wanted to escape into</div><div className="bars">${urgeRows.map(([k, n]) => html`<div key=${k} className="bar-row"><span>${URGES[k] ? URGES[k].label : k}</span><div className="track"><i style=${{ width: n / maxU * 100 + "%", background: "var(--crimson)" }}></i></div><span className="n">${n}</span></div>`)}</div></div>` : null}

        <div style=${{ display: "grid", gap: "8px" }}>
          ${MS.map(([k, l]) => html`<div key=${k} className=${"badge" + (s.milestones[k] ? " on" : "")} style=${{ justifyContent: "space-between" }}>
            <div style=${{ display: "flex", gap: "12px", alignItems: "center" }}><div className="medal" style=${{ width: "34px", height: "34px", fontSize: "14px" }}>${s.milestones[k] ? "✓" : "·"}</div><div><div className="bt">${l}</div>${s.milestones[k] ? html`<div className="bd">${niceDate(dayKey(new Date(s.milestones[k])))}</div>` : null}</div></div>
            <button className="btn btn-sm btn-line" onClick=${() => { update(n => { if (n.milestones[k]) delete n.milestones[k]; else n.milestones[k] = Date.now(); }); if (!s.milestones[k]) flash("Milestone recorded", l); }}>${s.milestones[k] ? "Undo" : "It happened"}</button>
          </div>`)}
        </div>
      </div>
    </div>

    <${InsightPanels} s=${s} d=${d} goTool=${goTool}/>
    <div className="panel">
      <h3>Achievements · ${achs.filter(a => a.on).length}/${achs.length}</h3>
      <div style=${{ display: "grid", gap: "10px", gridTemplateColumns: "repeat(auto-fill,minmax(min(100%,260px),1fr))" }}>
        ${achs.map(a => html`<div key=${a.id} className=${"badge" + (a.on ? " on" : "")}><div className="medal">${a.on ? "★" : "?"}</div><div><div className="bt">${a.t}</div><div className="bd">${a.dsc}${!a.on && a.p ? " · " + a.p : ""}</div></div></div>`)}
      </div>
    </div>
  </div>`;
}

/* =========================================================
   TWO FUTURES
   ========================================================= */
function Futures({ s, d, update }) {
  const sim = s.sim;
  const avoidPace = sim.avoid != null ? sim.avoid : (d.avg14 || 10);
  const setSim = (k, v) => update(n => { n.sim[k] = v; });
  const setA = (k, v) => update(n => { n.sim.assume[k] = v; });
  const setSplit = (k, v) => update(n => { n.sim.split[k] = v; });
  const splitTotal = Object.values(sim.split).reduce((a, b) => a + b, 0) || 1;
  const sh = k => sim.split[k] / splitTotal;
  const hours = (minPerDay, days) => minPerDay * (sim.days / 7) * days / 60;
  const points = [["30 days", 30], ["90 days", 90], ["1 year", 365], ["3 years", 1095]];
  const A = sim.assume;
  const outB = days => { const h = hours(sim.target, days); return { h, learn: h * sh("learn"), apps: Math.floor(h * sh("jobs") / A.appHours), biz: h * sh("biz"), money: h * sh("money") }; };
  const outA = days => { const h = hours(avoidPace, days); return { h, learn: h * sh("learn"), apps: Math.floor(h * sh("jobs") / A.appHours), biz: h * sh("biz"), money: h * sh("money") }; };
  const courses = learnH => { const out = []; if (learnH >= A.p6Hours) out.push("P6 fundamentals"); if (learnH >= A.p6Hours + A.protHours) out.push("protection fundamentals"); if (learnH >= (A.p6Hours + A.protHours) * 2.5) out.push("deeper commissioning / advanced P6"); return out; };
  const num = (id, label, val, onC, step = 1, suffix) => html`<label className="f" htmlFor=${id}>${label}<div style=${{ display: "flex", gap: "6px", alignItems: "center" }}><input id=${id} type="number" min="0" step=${step} value=${val} onInput=${e => { const v = parseFloat(e.target.value); if (!isNaN(v) && v >= 0) onC(v); }} style=${{ maxWidth: "110px" }}/>${suffix ? html`<span className="faint">${suffix}</span>` : null}</div></label>`;
  const b90 = outB(90), b365 = outB(365), b1095 = outB(1095), b30 = outB(30), a365 = outA(365), a1095 = outA(1095);
  const fmtH = h => h < 10 ? h.toFixed(1) + "h" : Math.round(h) + "h";
  return html`<div className="wrap section" style=${{ display: "flex", flexDirection: "column", gap: "16px" }}>
    <div><span className="eyebrow">Consequence simulator</span><h2 style=${{ fontSize: "clamp(38px,7vw,64px)", marginTop: "6px" }}>Two Futures: which one are you building?</h2>
      <p className="dim" style=${{ marginTop: "8px", maxWidth: "70ch" }}>These are illustrative projections of cumulative focused hours, built from assumptions you can edit. They are not predictions of salary, job offers or income. Hours are the one thing you control; outcomes also depend on the market, luck and quality of work.</p></div>

    <div className="panel">
      <div className="grid-2">
        <label className="f" htmlFor="fx-target">Timeline B: focused minutes per day <span className="mono" style=${{ color: "var(--tungsten)", fontSize: "22px" }}>${sim.target} min</span>
          <input id="fx-target" type="range" min="0" max="240" step="5" value=${sim.target} onInput=${e => setSim("target", Number(e.target.value))}/></label>
        <label className="f" htmlFor="fx-avoid">Timeline A: pace if avoidance continues <span className="mono" style=${{ color: "var(--fg)", fontSize: "22px" }}>${avoidPace} min</span>
          <input id="fx-avoid" type="range" min="0" max="120" step="5" value=${avoidPace} onInput=${e => setSim("avoid", Number(e.target.value))}/></label>
      </div>
      <div className="btn-row" style=${{ alignItems: "center" }}>
        <button className="btn btn-sm btn-line" onClick=${() => setSim("avoid", d.avg14)}>Set A to my real 14-day average (${d.avg14} min)</button>
        <label className="f" htmlFor="fx-days" style=${{ flexDirection: "row", alignItems: "center", gap: "8px" }}>Days per week<select id="fx-days" value=${sim.days} onChange=${e => setSim("days", Number(e.target.value))} style=${{ width: "auto" }}>${[3, 4, 5, 6, 7].map(n => html`<option key=${n} value=${n}>${n}</option>`)}</select></label>
      </div>
    </div>

    <div className="tl">
      ${points.map(([lab, days]) => { const a = outA(days), b = outB(days); const mx = Math.max(a.h, b.h, 1);
        return html`<div key=${lab} className="tl-card"><div className="when">${lab}</div>
          <div className="hbar"><span className="dim">A · avoidance</span><div className="tr"><i style=${{ width: a.h / mx * 100 + "%", background: "var(--fg-faint)" }}></i></div><span className="mono">${fmtH(a.h)}</span></div>
          <div className="hbar"><span>B · consistent action</span><div className="tr"><i style=${{ width: b.h / mx * 100 + "%", background: "var(--tungsten)" }}></i></div><span className="mono" style=${{ color: "var(--tungsten)" }}>${fmtH(b.h)}</span></div>
          <div className="note">Gap: <b className="mono" style=${{ color: "var(--fg)" }}>${fmtH(b.h - a.h)}</b>${b.h - a.h > 40 ? ` ≈ ${Math.round((b.h - a.h) / 38)} full work weeks` : ""}</div>
        </div>`; })}
    </div>

    <div className="grid-2">
      <div className="panel future-col a">
        <h3 style=${{ color: "var(--fg-dim)" }}>Timeline A · Avoidance continues</h3>
        <div className="item"><b>30 days</b>Same CV. ${outA(30).apps} tailored application${outA(30).apps === 1 ? "" : "s"} at most. Another business idea researched, none launched. The plan for Melbourne still lives in your head.</div>
        <div className="item"><b>90 days</b>${outA(90).learn < A.p6Hours ? "P6 still on the someday list." : "Some P6 progress, unevenly."} Salary likely unchanged around today's level. Early 2027 approaches with the job search not started.</div>
        <div className="item"><b>1 year</b>${fmtH(a365.h)} of focused effort in total. Possible outcome: you move to Melbourne on hope rather than an offer, or the move slips again. The $150K–$200K band stays "next year".</div>
        <div className="item"><b>3 years</b>${fmtH(a1095.h)}. The ambition is intact, and so is the gap. Age 36 with the same plans, refined many times.</div>
      </div>
      <div className="panel future-col b">
        <h3 style=${{ color: "var(--tungsten)" }}>Timeline B · Consistent action</h3>
        <div className="item"><b>30 days · ${fmtH(b30.h)}</b>Enough time for a rebuilt CV and LinkedIn, ~${b30.apps} tailored applications, and ${fmtH(b30.learn)} of technical study. One business offer chosen and ${b30.biz >= 2 ? "first customers contacted" : "a first message drafted"}.</div>
        <div className="item"><b>90 days · ${fmtH(b90.h)}</b>${courses(b90.learn).length ? "Time to complete " + courses(b90.learn).join(" and ") + "." : `${fmtH(b90.learn)} of study banked toward P6 (assumed ${A.p6Hours}h).`} ~${b90.apps} applications sent, which means real interview practice and real salary data. ${fmtH(b90.biz)} on the business: ${b90.biz >= A.bizHours ? "enough to have tested the offer with real customers." : "validation under way."}</div>
        <div className="item"><b>1 year · ${fmtH(b365.h)}</b>${courses(b365.learn).length ? "Learning milestones reachable: " + courses(b365.learn).join(", ") + "." : ""} A Melbourne move timed around an offer rather than hope. Possible (not guaranteed): a role in the $150K+ band, given your degree, master's and switchboard experience.</div>
        <div className="item"><b>3 years · ${fmtH(b1095.h)}</b>Compounding: deeper technical credibility, a tested side business with ${fmtH(b1095.biz)} invested, a deposit plan with ${fmtH(b1095.money)} of deliberate money management behind it. The $300K combined-income goal becomes a plan with evidence instead of a wish.</div>
      </div>
    </div>

    <details className="panel">
      <summary style=${{ cursor: "pointer", fontWeight: 800 }}>Edit assumptions</summary>
      <div style=${{ display: "flex", flexDirection: "column", gap: "14px", marginTop: "12px" }}>
        <div className="eyebrow">How focused time is split (normalised to 100%)</div>
        <div className="grid-2">
          ${[["learn", "Technical learning"], ["jobs", "Job search"], ["biz", "Business"], ["money", "Money & admin"]].map(([k, l]) => html`<label key=${k} className="f" htmlFor=${"fx-sp-" + k}>${l}: <span className="mono" style=${{ color: "var(--fg)" }}>${Math.round(sh(k) * 100)}%</span><input id=${"fx-sp-" + k} type="range" min="0" max="100" step="5" value=${sim.split[k]} onInput=${e => setSplit(k, Number(e.target.value))}/></label>`)}
        </div>
        <div className="grid-2">
          ${num("fx-app", "Hours per tailored application", A.appHours, v => setA("appHours", Math.max(0.25, v)), 0.25, "hours")}
          ${num("fx-p6", "Hours to P6 fundamentals", A.p6Hours, v => setA("p6Hours", v), 1, "hours")}
          ${num("fx-prot", "Hours to protection fundamentals", A.protHours, v => setA("protHours", v), 1, "hours")}
          ${num("fx-biz", "Hours to test an offer with real customers", A.bizHours, v => setA("bizHours", v), 1, "hours")}
        </div>
        <p className="note">Defaults are rough planning guesses, not course specifications. Replace them with figures from the actual courses or programs you choose.</p>
      </div>
    </details>
  </div>`;
}

/* =========================================================
   COACH CHAT
   ========================================================= */
function CoachChat({ s, d, prio, coach, runAct, update, sample, goTool }) {
  const [msgs, setMsgs] = useState(() => [{ who: "co", coach, text: coach === "brutal" ? "Talk to me. What's going on?" : "I'm here. What's happening right now?", action: null }]);
  const [text, setText] = useState("");
  const [live, setLive] = useState(false);
  const [busy, setBusy] = useState(false);
  const endRef = useRef(null);
  useEffect(() => { if (endRef.current) endRef.current.scrollTop = endRef.current.scrollHeight; }, [msgs]);
  const QUICK = ["I feel anxious.", "I'm feeling low.", "I keep researching instead of doing.", "I'm bored.", "I don't feel like working.", "I wasted the whole morning.", "I want to watch YouTube.", "I have too many goals.", "I'll start tomorrow.", "I'm afraid I won't succeed."];
  const send = async (t) => {
    t = (t || "").trim(); if (!t || busy) return;
    setText("");
    const ctx = { s, d, prio };
    const base = coachReply(coach, t, ctx);
    const guard = moodGuard(s);
    if (base.intent && EXCUSE_INTENTS.includes(base.intent)) update(n => { n.excuses.push({ id: uid(), ts: Date.now(), text: t, src: "coach chat" }); });
    if (!base.crisis && !guard && coach === "brutal" && s.prefs.noMercy && base.intent && EXCUSE_INTENTS.includes(base.intent)) { const nm = noMercyLine(s, d, prio); if (nm) base.text = base.text + "\n\n" + nm; }
    if (!base.crisis && /hopeless/i.test(t)) base.text = base.text + "\n\nIf hopelessness has lasted more than a couple of weeks, please talk to a GP, or call Beyond Blue on 1300 22 4636 (24/7).";
    const next = msgs.concat([{ who: "me", text: t }]);
    if (live && sample && !base.crisis) {
      const idx = next.length;
      setMsgs(next.concat([{ who: "co", coach, text: "…", action: base.action, live: true }]));
      setBusy(true);
      const persona = coach === "brutal"
        ? "You are 'The Brutal Truth' coach: direct, firm, evidence-based, challenges excuses, distinguishes real obstacles from avoidance. Never humiliating or abusive. No flattery."
        : "You are 'The Strategist' coach: calm, warm, intelligent, understands task avoidance, makes starting easier with small concrete steps.";
      const facts = `User profile: 33, Perth, electrical & electronics engineering degree, master's in engineering management, ~3 years Australian project engineering (switchboards, switchrooms, procurement, manufacturing, scheduling). Earns about AUD 115k, aims for 150-200k, relocating to Melbourne early 2027, long-term 300k combined income, first home. Struggles with novelty-seeking, research instead of action, avoidance. No clinical diagnosis assumed. If the user raises anxiety, stress, low mood or sleep, be supportive and practical (no shaming, even as the Brutal coach) and suggest one specific Green Room tool: cyclic sighing, 5-4-3-2-1 grounding, the worry sorter, a brisk walk, morning daylight, reaching out to someone, or the wind-down plan. If there is any hint of self-harm, give Lifeline 13 11 14 and 000.
Tracked today: ${d.minsToday} focused minutes, ${d.doneToday} done, ${d.partialToday} partial, ${d.distractedToday} distracted, ${d.urgesToday.length} urges fought. 14-day average ${d.avg14} min/day. Most common urge: ${d.topUrge ? URGES[d.topUrge].label : "none yet"}. Most avoided: ${d.topCat ? CATS[d.topCat].label : "none yet"}. Today's priority mission: ${prio ? prio.title + " (" + prio.minutes + " min)" : "none"}.`;
      const history = next.slice(-6).map(m => (m.who === "me" ? "User: " : "Coach: ") + m.text).join("\n");
      const prompt = `${persona}\n\n${facts}\n\nConversation so far:\n${history}\n\nReply as the coach in under 110 words, plain text, no lists or headings. Use the tracked data where relevant, never invent completed actions, and end with exactly one concrete next action the user can start within 10 minutes.`;
      try {
        const r = await sample(prompt, { modelTier: "quick", cache: false, onText: ({ text }) => setMsgs(cur => cur.map((m, i) => i === idx ? Object.assign({}, m, { text }) : m)) });
        setMsgs(cur => cur.map((m, i) => i === idx ? Object.assign({}, m, { text: r.text }) : m));
      } catch (e) {
        setMsgs(cur => cur.map((m, i) => i === idx ? Object.assign({}, m, { text: base.text, live: false, err: e && e.code === "not_granted" ? "Live coach not allowed; showing the scripted coach." : "Live coach unavailable; showing the scripted coach." }) : m));
        if (e && e.code === "not_granted") setLive(false);
      }
      setBusy(false);
    } else {
      setMsgs(next.concat([{ who: "co", coach, text: base.text, action: base.action }]));
    }
  };
  return html`<div className="wrap section" style=${{ display: "flex", flexDirection: "column", gap: "14px", maxWidth: "860px" }}>
    <div><span className="eyebrow">Coach</span><h2 style=${{ fontSize: "clamp(38px,7vw,64px)", marginTop: "6px" }}>Talk it through</h2>
      <p className="dim" style=${{ marginTop: "6px" }}>${live ? "Live mode: replies come from Claude using your tracked stats. The first reply asks your permission." : "Scripted mode: instant rule-based replies that use your tracked data. This is not live AI."}</p></div>
    <div className="btn-row" style=${{ alignItems: "center" }}>
      <div className="seg" role="group" aria-label="Coach personality">
        <button aria-pressed=${coach === "brutal"} onClick=${() => update(n => { n.coach = "brutal"; })}>Brutal Truth</button>
        <button aria-pressed=${coach === "mentor"} onClick=${() => update(n => { n.coach = "mentor"; })}>Strategist</button>
      </div>
      ${coach === "brutal" ? html`<label style=${{ display: "flex", gap: "8px", alignItems: "center", fontWeight: 700, fontSize: "14px" }}><input id="chat-nomercy" type="checkbox" style=${{ width: "20px", height: "20px" }} checked=${!!s.prefs.noMercy} onChange=${e => { const v = e.target.checked; update(n => { n.prefs.noMercy = v; }); }}/>No Mercy mode</label>` : null}
      ${sample ? html`<div className="seg" role="group" aria-label="Reply mode"><button aria-pressed=${!live} onClick=${() => setLive(false)}>Scripted</button><button aria-pressed=${live} onClick=${() => setLive(true)}>Live (Claude)</button></div>` : html`<span className="note">Live AI isn't available in this view; scripted coach active.</span>`}
    </div>
    <div className="panel" style=${{ padding: "14px" }}>
      <div className="chat" ref=${endRef} aria-live="polite">
        ${msgs.map((m, i) => html`<div key=${i} className=${"msg " + m.who + (m.who === "co" ? " " + (m.coach || coach) : "")}>
          ${m.text}
          ${m.err ? html`<div className="note" style=${{ marginTop: "6px" }}>${m.err}</div>` : null}
          ${m.action ? html`<div style=${{ marginTop: "10px" }}><button className="btn btn-sm btn-amber" onClick=${() => runAct(m.action.act)}>${m.action.label}</button></div>` : null}
        </div>`)}
      </div>
      <div className="chips">${QUICK.map(q => html`<button key=${q} onClick=${() => send(q)} disabled=${busy}>${q}</button>`)}</div>
      <form style=${{ display: "flex", gap: "8px" }} onSubmit=${e => { e.preventDefault(); send(text); }}>
        <input id="coach-input" value=${text} onInput=${e => setText(e.target.value)} placeholder="Tell your coach what's going on…" aria-label="Message your coach"/>
        <button className="btn btn-amber" type="submit" disabled=${!text.trim() || busy}>Send</button>
      </form>
    </div>
  </div>`;
}

/* =========================================================
   WEEKLY RECAP
   ========================================================= */
function Recap({ s, d, coach, byId, update, flash }) {
  const [off, setOff] = useState(0);
  const ws = addDays(weekStartKey(d.today), off * 7), we = addDays(ws, 6);
  const inWeek = k => k >= ws && k <= we;
  const sess = s.sessions.filter(x => inWeek(x.day));
  const urges = s.urges.filter(u => inWeek(dayKey(new Date(u.ts))));
  const checks = s.checkins.filter(c => inWeek(dayKey(new Date(c.ts))) && c.cat !== "none" && c.cat !== "mood");
  const done = sess.filter(x => x.outcome === "done");
  const focusMin = Math.round(sess.filter(productive).reduce((a, x) => a + x.actual, 0) / 60);
  const daysShown = new Set(sess.filter(productive).map(x => x.day)).size;
  const byAttr = {}; sess.filter(productive).forEach(x => byAttr[x.attr] = (byAttr[x.attr] || 0) + 1);
  const uc = {}; urges.forEach(u => uc[u.urge] = (uc[u.urge] || 0) + 1);
  const cc = {}; checks.forEach(c => cc[c.cat] = (cc[c.cat] || 0) + 1);
  const topU = Object.entries(uc).sort((a, b) => b[1] - a[1]);
  const topC = Object.entries(cc).sort((a, b) => b[1] - a[1]);
  const postponed = []; for (let i = 0; i < 7; i++) { const k = addDays(ws, i); if (k >= d.today) break; const dd = s.daily[k]; if (!dd || !dd.priority) continue; const ok = s.sessions.some(x => x.day === k && x.mid === dd.priority && x.outcome === "done"); if (!ok) { const m = byId(dd.priority); if (m && !postponed.some(p => p.id === m.id)) postponed.push(m); } }
  const useful = done.slice().sort((a, b) => b.xp - a.xp).slice(0, 3);
  const partialsOpen = activeMissions(s).filter(m => { const ls = lastSession(s, m.id); return ls && ls.outcome === "partial"; });
  const prios = [];
  if ((byAttr.career || 0) < 3) prios.push("Book three 25-minute career sessions (CV, one application, P6) into specific calendar slots.");
  if (topC[0]) prios.push(`Face "${CATS[topC[0][0]].label.toLowerCase()}" first thing Monday with a 10-minute mission, before email.`);
  if (partialsOpen[0]) prios.push(`Finish "${partialsOpen[0].title}". It's started; don't let it stall.`);
  if ((uc.ideas || 0) >= 1) prios.push("Turn business research into contact: message one potential customer.");
  if ((byAttr.health || 0) < 2) prios.push("Two wellbeing missions (walk or strength) to protect your energy.");
  ["Send one tailored application to a role in your target salary band.", "Set up an automatic savings transfer on payday.", "Plan next week on Sunday in a 25-minute weekly planning session."].forEach(x => { if (prios.length < 3 && !prios.includes(x)) prios.push(x); });
  const verdict = sess.length === 0
    ? (coach === "brutal" ? "Nothing logged this week. Either it happened off the record, or it didn't happen. Either way, next week starts with one 10-minute mission." : "A blank week on the tracker. That says nothing about your worth; it just means next week starts small. One 10-minute mission on Monday.")
    : (coach === "brutal" ? `${done.length} missions done, ${fmtMin(focusMin)} focused, ${daysShown} of 7 days shown up. ${postponed.length ? `The priority slipped ${postponed.length} time${postponed.length > 1 ? "s" : ""}; that's the pattern to break.` : "You did the priorities. Raise the bar slightly."}` : `${done.length} missions done and ${fmtMin(focusMin)} of focus across ${daysShown} days. ${postponed.length ? "Some priorities slipped, which tells us where to make things smaller next week." : "You kept your priorities. That's real consistency."}`);
  return html`<div className="wrap section" style=${{ display: "flex", flexDirection: "column", gap: "16px" }}>
    <div className="recap-open">
      <div className="grain"></div>
      <span className="eyebrow">${niceDate(ws)} – ${niceDate(we)}</span>
      <h2 key=${ws} style=${{ marginTop: "10px" }}>Previously on your life…</h2>
      <div className="btn-row" style=${{ justifyContent: "center", marginTop: "16px" }}>
        <button className="btn btn-sm btn-line" onClick=${() => setOff(off - 1)}>‹ Earlier week</button>
        <button className="btn btn-sm btn-line" disabled=${off >= 0} onClick=${() => setOff(off + 1)}>Later week ›</button>
      </div>
    </div>
    <div className=${"coach-band " + coach}><span className=${"avatar " + coach}>${COACH[coach].init}</span><div><div className="who">${COACH[coach].name} · weekly verdict</div><p>${verdict}</p></div></div>
    <div className="grid-3" style=${{ gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))" }}>
      <div className="stat"><div className="k">Missions done</div><div className="v">${done.length}</div></div>
      <div className="stat"><div className="k">Focus time</div><div className="v">${fmtMin(focusMin)}</div></div>
      <div className="stat"><div className="k">Days shown up</div><div className="v">${daysShown}/7</div></div>
      <div className="stat"><div className="k">Urges fought</div><div className="v">${urges.length}</div></div>
      <div className="stat"><div className="k">Career sessions</div><div className="v">${byAttr.career || 0}</div></div>
      <div className="stat"><div className="k">Wealth / business</div><div className="v">${byAttr.wealth || 0}</div></div>
    </div>
    <div className="grid-2">
      <div className="panel"><h3>Missions completed</h3>${done.length ? html`<ul className="list">${done.map(x => html`<li key=${x.id}><span>${x.title}</span><span>${niceDate(x.day)} · +${x.xp}</span></li>`)}</ul>` : html`<p className="dim">None this week.</p>`}</div>
      <div className="panel"><h3>Avoidance patterns</h3>

const TOOLS = [
  { id: "diag", t: "Why am I procrastinating?", src: "Piers Steel · The Procrastination Equation", min: "1 min", d: "Score expectancy, value, impulsiveness and delay for one task. Get the fix that targets your weakest factor.", why: "Steel's meta-analysis of hundreds of procrastination studies found that avoidance rises when you doubt success, find the task dull, are easily distracted, or the payoff is far away. Fix the weakest factor, not all of them." },
  { id: "woop", t: "WOOP plan", src: "Gabriele Oettingen · Rethinking Positive Thinking", min: "3 min", d: "Wish, Outcome, Obstacle, Plan. Turns a fantasy into an if-then plan for the exact moment you usually bail.", why: "Positive fantasies alone can reduce effort: the brain enjoys the imagined future as if it already happened. Pairing the wish with your inner obstacle, then an if-then plan (Gollwitzer's implementation intentions), reliably increases follow-through. This is the direct antidote to 'planning feels better than doing'." },
  { id: "thought", t: "Thought record", src: "David Burns · Feeling Good (TIC-TOC) · Bill Knaus · The Procrastination Workbook", min: "4 min", d: "Catch the task-interfering thought, name the distortion, write a task-oriented answer, then act.", why: "In cognitive therapy, avoidance is often driven by automatic thoughts ('I'll do it when I feel like it', 'it has to be perfect'). Writing them down and answering them weakens their grip. Burns calls these TICs (task-interfering cognitions) and TOCs (task-oriented cognitions)." },
  { id: "defuse", t: "Unhook from a thought", src: "Russ Harris · The Happiness Trap · Steven Hayes (ACT)", min: "2 min", d: "Watch the thought instead of obeying it. Then do the next valued action with the thought still there.", why: "Acceptance and Commitment Therapy doesn't try to win the argument with a thought. It changes your relationship to it: 'I'm having the thought that I'll fail' is a thought, not an instruction." },
  { id: "values", t: "Values compass", src: "Steven Hayes (ACT) · Wilson's Valued Living Questionnaire", min: "5 min", d: "Rate how important each life area is and how consistently you lived it this week. The biggest gap gets a mission.", why: "Goals end; values don't. When a task is linked to something you genuinely care about, it becomes easier to tolerate discomfort for it. The importance-vs-consistency gap shows where avoidance costs you most." },
  { id: "slip", t: "Slip recovery protocol", src: "Kristin Neff · Self-Compassion · Marlatt & Gordon · Relapse Prevention", min: "3 min", d: "For after a lost day or week. Stops one slip turning into a collapse.", why: "Marlatt called it the abstinence violation effect: after one slip, people decide 'I've blown it' and give up entirely. Research on self-compassion (Neff; Wohl et al., 2010) shows that people who forgive a lapse procrastinate less afterwards, while self-criticism predicts more avoidance." },
  { id: "bundle", t: "Temptation bundles", src: "Katy Milkman · How to Change", min: "1 min", d: "Lock a guilty pleasure to a task you avoid: the pleasure is only allowed during the task.", why: "In Milkman's gym study, people who could only listen to gripping audiobooks at the gym went more often. You turn the thing you'd escape into the reward for showing up." },
  { id: "contract", t: "Ulysses contract", src: "Commitment devices: Giné, Karlan & Zinman (2010) · Milkman's fresh-start effect", min: "3 min", d: "Sign this week's commitment, set a real stake, name a referee. Binds future-you while present-you is willing.", why: "Ulysses had himself tied to the mast because he knew he'd give in to the Sirens later. Commitment contracts with a stake and a referee measurably improve follow-through. Loss aversion makes a stake you'd hate to pay more motivating than a reward." }
];

const money = n => "$" + Math.round(n).toLocaleString("en-AU");
const weeklyGap = s => Math.max(0, (s.profile.target || 0) - (s.profile.salary || 0)) / 52;
const clockIn = min => { const t = new Date(Date.now() + min * 60000); return t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };

function contractEval(s, c, today) {
  const we = addDays(c.week, 6);
  // Only sessions with roughly two minutes or more of real focus count toward a contract.
  const sess = s.sessions.filter(x => x.day >= c.week && x.day <= we && productive(x) && x.actual >= 110);
  const count = sess.length, minutes = Math.round(sess.reduce((a, x) => a + x.actual, 0) / 60);
  const ended = today > we;
  let status = "active";
  if (c.brokenEarly) status = "broken";
  else if (ended) status = (count >= c.sessions && minutes >= c.minutes && (!c.must || c.mustDone)) ? "kept" : "broken";
  return { we, count, minutes, ended, status };
}
function refereeReport(s, c, today) {
  const e = contractEval(s, c, today);
  return [
    `LIFEFLIX weekly report: ${niceDate(c.week)} to ${niceDate(e.we)}`,
    `Committed: ${c.sessions} focus sessions, ${c.minutes} focused minutes${c.must ? `, must-do: ${c.must}` : ""}.`,
    `Actual so far: ${e.count} sessions, ${e.minutes} minutes${c.must ? `, must-do ${c.mustDone ? "done" : "not done"}` : ""}.`,
    `Status: ${e.status === "active" ? "in progress" : e.status.toUpperCase()}.`,
    `Stake if broken: ${c.stake || "none set"}${c.paid ? " (paid)" : ""}.`,
    `Referee: ${c.referee || "none named"}. Self-reported from my tracker; please hold me to it.`
  ].join("\n");
}
function noMercyLine(s, d, prio) {
  const today = d.today; const facts = [];
  let streak = 0;
  for (let i = 1; i <= 7; i++) { const k = addDays(today, -i); const dd = s.daily[k]; if (!dd || !dd.priority) break; if (s.sessions.some(x => x.day === k && x.mid === dd.priority && x.outcome === "done")) break; streak++; }
  if (streak >= 2) facts.push(`your daily priority has gone undone ${streak} days running`);
  const cc = d.topCat ? d.catCounts[d.topCat] : 0;
  if (cc >= 3) { const dn = s.sessions.filter(x => x.outcome === "done" && (x.tags || []).includes(d.topCat)).length; facts.push(`you've named "${CATS[d.topCat].label.toLowerCase()}" as the thing you're avoiding ${cc} times and completed ${dn} mission${dn === 1 ? "" : "s"} on it`); }
  const broken = s.contracts.filter(c => contractEval(s, c, today).status === "broken" && !c.paid);
  if (broken.length) facts.push(`you still owe "${broken[0].stake}" on a broken contract`);
  const ex = s.excuses.filter(e => Date.now() - e.ts < 14 * 86400000).slice(-2);
  if (!facts.length && !ex.length) return null;
  const exTxt = ex.length ? " Your own words: " + ex.map(e => `${niceDate(dayKey(new Date(e.ts)))}, "${e.text.slice(0, 70)}"`).join("; ") + "." : "";
  const f = facts.length ? facts.join("; ") + "." : "";
  return `Receipts: ${f ? f.charAt(0).toUpperCase() + f.slice(1) : ""}${exTxt} You don't need more insight. You need ${prio ? prio.minutes : 10} minutes on "${prio ? prio.title : "the priority"}". Start.`;
}

function HomeBanners({ s, d, coach, goTool }) {

  const slipped = (d.daysSinceLast !== null && d.daysSinceLast >= 2 && d.todays.length === 0) || d.distractedToday >= 2;

  else if (fresh) out.push(html`<div key="f" className="banner"><div><div className="eyebrow" style=${{ color: "var(--tungsten)" }}>Fresh start</div><div style=${{ fontWeight: 700 }}>${slipped ? "A clean slate starts now, not next Monday." : parseDay(today).getDay() === 1 ? "New week. Fresh starts are when commitments stick best." : "New month. A natural reset point."} Sign this week's contract.</div></div><button className="btn btn-sm btn-amber" onClick=${() => goTool("contract")}>Sign contract</button></div>`);
  return out.length ? html`<div>${out}</div>` : null;
}

function InsightPanels({ s, d, goTool }) {
  const moods = s.sessions.filter(x => x.moodBefore != null && x.moodAfter != null);
  const lift = moods.length ? moods.reduce((a, x) => a + (x.moodAfter - x.moodBefore), 0) / moods.length : null;
  const liftDone = moods.filter(x => productive(x)); const liftD = liftDone.length ? liftDone.reduce((a, x) => a + (x.moodAfter - x.moodBefore), 0) / liftDone.length : null;
  const wc = { E: 0, V: 0, I: 0, D: 0 }; s.diag.forEach(x => wc[x.weak] = (wc[x.weak] || 0) + 1);
  const WN = { E: "Low confidence (expectancy)", V: "Low value", I: "High impulsiveness", D: "Distant payoff (delay)" };
  const maxW = Math.max(1, ...Object.values(wc));
  const tc = {}; s.slips.forEach(x => (x.triggers || []).forEach(t => tc[t] = (tc[t] || 0) + 1));
  const dc = {}; s.thoughts.forEach(x => (x.distortions || []).forEach(t => dc[t] = (dc[t] || 0) + 1));
  const tRows = Object.entries(tc).sort((a, b) => b[1] - a[1]).slice(0, 5), dRows = Object.entries(dc).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maxT = Math.max(1, ...tRows.map(x => x[1])), maxD = Math.max(1, ...dRows.map(x => x[1]));
  return html`<div className="grid-2">
    <div className="panel">
      <h3>Action → mood</h3>
      ${lift === null ? html`<p className="dim">Rate your mood before and after a mission to see this. Behavioural activation (Martell, Addis & Jacobson) rests on one finding: mood tends to follow action, not the other way round.</p>` : html`<${React.Fragment}>
        <div style=${{ display: "flex", gap: "18px", alignItems: "baseline", flexWrap: "wrap" }}><div><div className="big-num" style=${{ color: lift >= 0 ? "var(--ok)" : "var(--bad)" }}>${lift >= 0 ? "+" : ""}${lift.toFixed(1)}</div><div className="note">average mood change, ${moods.length} rated sessions</div></div>
        ${liftD !== null ? html`<div><div className="big-num" style=${{ fontSize: "30px" }}>${liftD >= 0 ? "+" : ""}${liftD.toFixed(1)}</div><div className="note">after real progress</div></div>` : null}</div>
        <p className="note">${lift > 0.3 ? "Your own data says starting makes you feel better. Remember this the next time you wait to feel like it." : "No clear lift yet. Keep rating; a few sessions isn't enough to judge."}</p>
      <//>`}
    </div>
    <div className="panel">
      <h3>Why you procrastinate</h3>
      ${s.diag.length ? html`<div className="bars">${Object.entries(wc).map(([k, n]) => html`<div key=${k} className="bar-row"><span>${WN[k]}</span><div className="track"><i style=${{ width: n / maxW * 100 + "%", background: "var(--s3)" }}></i></div><span className="n">${n}</span></div>`)}</div>` : html`<p className="dim">Run the procrastination diagnosis on a task to see which factor trips you most.</p>`}
      ${tRows.length ? html`<div><div className="eyebrow" style=${{ marginBottom: "8px" }}>Slip triggers</div><div className="bars">${tRows.map(([k, n]) => html`<div key=${k} className="bar-row"><span>${k}</span><div className="track"><i style=${{ width: n / maxT * 100 + "%", background: "var(--crimson)" }}></i></div><span className="n">${n}</span></div>`)}</div></div>` : null}
      ${dRows.length ? html`<div><div className="eyebrow" style=${{ marginBottom: "8px" }}>Thinking traps</div><div className="bars">${dRows.map(([k, n]) => { const dd = DISTORTIONS.find(x => x[0] === k); return html`<div key=${k} className="bar-row"><span>${dd ? dd[1] : k}</span><div className="track"><i style=${{ width: n / maxD * 100 + "%", background: "var(--tungsten)" }}></i></div><span className="n">${n}</span></div>`; })}</div></div>` : null}
      <div><button className="btn btn-sm btn-line" onClick=${() => goTool("diag")}>Run a diagnosis</button></div>
    </div>
  </div>`;
}

  const careerDone = s.sessions.filter(x => x.day >= ws && x.day <= we && productive(x) && x.attr === "career").length;
  const ex = s.excuses.filter(e => { const k = dayKey(new Date(e.ts)); return k >= ws && k <= we; });
  const [copied, setCopied] = useState("");
  const copy = async (txt) => { try { await navigator.clipboard.writeText(txt); setCopied("Copied. Send it to your referee."); } catch (e) { setCopied("Copy blocked here; select the text and copy it manually."); } };
  return html`<div className="grid-2">
    <div className="panel">
      <h3>Ulysses contract</h3>

        <div style=${{ display: "flex", gap: "8px", alignItems: "center" }}><span className=${"chip " + (e.status === "kept" ? "ok" : e.status === "broken" ? "bad" : "amber")}>${e.status === "active" ? "In progress" : e.status}</span><span className="dim">${e.count}/${c.sessions} sessions · ${e.minutes}/${c.minutes} min</span></div>

        <div className="btn-row"><button className="btn btn-sm btn-amber" onClick=${() => copy(rep)}>Copy report for ${c.referee || "referee"}</button>${e.status === "broken" && !c.paid ? html`<button className="btn btn-sm btn-line" onClick=${() => update(n => { const x = n.contracts.find(y => y.id === c.id); if (x) x.paid = Date.now(); })}>I paid the stake</button>` : null}</div>
        ${copied ? html`<p className="note" role="status">${copied}</p>` : null}
      <//>`; })() : html`<p className="dim">No contract signed for this week.</p>`}
    </div>
    <div className="panel">
      <h3>Cost of avoidance</h3>
      ${gap > 0 ? html`<p>The gap between ${money(s.profile.salary)} and your ${money(s.profile.target)} target is about <b className="mono" style=${{ color: "var(--tungsten)" }}>${money(gap)}</b> a week before tax.</p>
        <p className="dim">${careerDone === 0 ? `This week had zero career sessions. If a role at your target is attainable (an assumption, not a promise), every week the search waits pushes that money further away.` : `${careerDone} career session${careerDone > 1 ? "s" : ""} this week. That's how the gap starts closing.`}${postponed.length ? ` ${postponed.length} daily priorit${postponed.length > 1 ? "ies" : "y"} slipped.` : ""}</p>
        <p className="note">Illustrative only. Edit your salary and target in Settings.</p>` : html`<p className="dim">Set a target salary above your current one in Settings to see this.</p>`}
      ${ex.length ? html`<div><div className="eyebrow" style=${{ marginBottom: "8px" }}>${s.prefs.noMercy ? "Receipts: your words this week" : "Notes you logged this week"}</div><ul className="list">${ex.slice(-6).map(e => html`<li key=${e.id}><span>"${e.text}"</span><span>${niceDate(dayKey(new Date(e.ts)))} · ${e.src}</span></li>`)}</ul></div>` : null}
    </div>
  </div>`;
}

function Tools(props) {

  if (tool && tool.id) {
    const map = { diag: Diagnose, woop: Woop, thought: ThoughtRecord, defuse: Defuse, values: Values, slip: Slip, bundle: Bundles, contract: Contract, gym: GymProgram, learn: LearnProgram, asrs: Asrs, barkley: Barkley, span: AttentionSpan, bank: ScreenBank, stop: StopSkill, parked: ParkedInbox };
    const C = map[tool.id]; const meta = TOOLS.concat(ADHD_TOOLS).find(t => t.id === tool.id);
    if (!C || !meta) { setTimeout(() => setTool(null), 0); return null; }
    return html`<div className="wrap section" style=${{ display: "flex", flexDirection: "column", gap: "16px", maxWidth: "900px" }}>
      <div><button className="btn btn-sm btn-line" onClick=${() => setTool(null)}>‹ All tools</button></div>

  const adhdUsed = { gym: progSessions(s, "gym").length, learn: progSessions(s, "learn").length, asrs: s.screens.filter(x => x.kind === "asrs").length, span: s.spans.length, bank: s.spends.length, parked: s.parked.filter(x => x.status === "inbox").length };

  return html`<div className="wrap section" style=${{ display: "flex", flexDirection: "column", gap: "16px" }}>
    <div><span className="eyebrow">For the two things you keep skipping</span><h2 style=${{ fontSize: "clamp(38px,7vw,64px)", marginTop: "6px" }}>Your programs</h2></div>
    <div className="tool-grid">${ADHD_TOOLS.filter(t => t.group === "program").map(adCard)}</div>
    <div><span className="eyebrow">ADHD-specific therapy tools</span><h2 style=${{ fontSize: "clamp(32px,6vw,52px)", marginTop: "6px" }}>ADHD toolkit</h2>
      <p className="dim" style=${{ marginTop: "8px", maxWidth: "72ch" }}>Adapted from the main books on adult ADHD treatment: Barkley's <i>Taking Charge of Adult ADHD</i>, Safren's <i>Mastering Your Adult ADHD</i>, Solanto's <i>Cognitive-Behavioral Therapy for Adult ADHD</i> and Zylowska's <i>The Mindfulness Prescription for Adult ADHD</i>. Useful with or without a diagnosis.</p></div>
    <div className="tool-grid">${ADHD_TOOLS.filter(t => t.group === "adhd").map(adCard)}</div>
    <div><span className="eyebrow">Clinical toolkit</span><h2 style=${{ fontSize: "clamp(32px,6vw,52px)", marginTop: "6px" }}>Procrastination tools</h2>

      <span className="src">${t.min} · ${t.src}</span><span className="tt">${t.t}</span><span className="dim" style=${{ fontSize: "14px" }}>${t.d}</span></button>`)}</div>

function MissionPick({ s, value, onChange, id }) {

  return html`<select id=${id} value=${value || ""} onChange=${e => onChange(e.target.value)}>${act.map(m => html`<option key=${m.id} value=${m.id}>${seasonOf(m.season).code} · ${m.title}</option>`)}</select>`;
