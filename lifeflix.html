function Settings({ s, update, setS, downloads, onClose, flash, openCoach }) {
  const [imp, setImp] = useState("");
  const [impErr, setImpErr] = useState("");
  const [reset, setReset] = useState("");
  const [copied, setCopied] = useState("");
  const json = useMemo(() => JSON.stringify(s, null, 1), [s]);
  const taRef = useRef(null);
  const copy = async () => {
    try { await navigator.clipboard.writeText(json); setCopied("Copied to clipboard."); }
    catch (e) { if (taRef.current) { taRef.current.focus(); taRef.current.select(); } setCopied("Copy blocked here. The text is selected; copy it manually."); }
  };
  const save = async () => {
    if (!downloads) return;
    try { await downloads.save({ filename: "lifeflix-" + dayKey() + ".json", data: json }); setCopied("File saved."); }
    catch (e) { setCopied("File not saved" + (e && e.code ? " (" + e.code + ")" : "") + "."); }
  };
  const doImport = async () => {
    try { const o = JSON.parse(imp); if (!o || !Array.isArray(o.missions) || !Array.isArray(o.sessions)) throw new Error("Missing missions or sessions."); const n = normalize(o); await Cloud.wipe(); n.updatedAt = Date.now(); n.epoch = uid(); n.resetAt = Date.now(); setS(n); setImp(""); setImpErr(""); flash("Data imported", n.sessions.length + " sessions restored"); }
    catch (e) { setImpErr("That isn't a LIFEFLIX export: " + e.message); }
  };
  const doMerge = () => {
    try { const o = JSON.parse(imp); if (!o || !Array.isArray(o.missions) || !Array.isArray(o.sessions)) throw new Error("Missing missions or sessions."); setS(prev => { const n = mergeStates(prev, normalize(o)); n.updatedAt = Date.now(); return n; }); setImp(""); setImpErr(""); flash("Backup merged", "Both devices' history kept"); }
    catch (e) { setImpErr("That isn't a LIFEFLIX backup: " + e.message); }
  };
  const doReset = async () => { await Cloud.wipe(); const n = freshState(); n.coach = s.coach; n.resetAt = Date.now(); setS(n); setReset(""); flash("Progress reset", "Season 1 starts today."); onClose(); };
  return html`<div className="overlay" role="dialog" aria-modal="true" aria-label="Settings and data">
    <div className="sheet">
      <button className="close-x" onClick=${onClose} aria-label="Close">×</button>
      <div className="sheet-body">
        <span className="eyebrow">Settings</span>
        <h2 style=${{ fontSize: "38px", textTransform: "uppercase" }}>Your data</h2>
        <div className="panel" style=${{ background: "var(--ink-3)" }}><${SaveStatus}/>
          <p className="note">${s.sessions.length} sessions · ${s.urges.length} urge fights · ${s.missions.length} episodes. Saved automatically after every change. On this device it lives in browser storage; when you're signed in to Claude it also syncs privately to your account so other devices can pick it up. Only you can read it.</p></div>
        <div className="btn-row"><button className="btn btn-line btn-sm" onClick=${openCoach}>Re-read coach introductions</button><button className="btn btn-sm btn-line" onClick=${() => { Cloud.pull(); Cloud.flushNow(); setCopied("Sync requested."); }} disabled=${Store.cloud === "unavailable" || Store.cloud === "off"}>Sync now</button></div>
        <div className="panel" style=${{ background: "var(--ink-3)" }}>
          <b>iPhone + browser</b>
          <p className="note">Open this same link in the Claude iPhone app and in a browser signed in to the same Claude account. Changes sync within seconds while both are open, and again whenever you switch back to the app. If the dot at the bottom is green rather than blue, account sync isn't active in that view; use the backup code below to move your progress.</p>
        </div>
        <div className="f-row">
          <label className="f" htmlFor="set-sal">Current salary (AUD)<input id="set-sal" type="number" min="0" step="1000" value=${s.profile.salary} onInput=${e => { const v = Number(e.target.value); if (v >= 0) update(n => { n.profile.salary = v; }); }}/></label>
          <label className="f" htmlFor="set-tgt">Target salary (AUD)<input id="set-tgt" type="number" min="0" step="1000" value=${s.profile.target} onInput=${e => { const v = Number(e.target.value); if (v >= 0) update(n => { n.profile.target = v; }); }}/></label>
        </div>
        <label style=${{ display: "flex", gap: "10px", alignItems: "flex-start", fontWeight: 600 }}><input id="set-nomercy" type="checkbox" style=${{ width: "20px", height: "20px", flex: "none" }} checked=${!!s.prefs.noMercy} onChange=${e => { const v = e.target.checked; update(n => { n.prefs.noMercy = v; }); }}/><span>No Mercy mode (Brutal Truth coach)<br/><span className="note">Quotes your own logged excuses, postponed priorities and unpaid stakes back to you with dates. Facts only, no insults.</span></span></label>
        <hr className="sep"/>
        <h3 style=${{ fontSize: "22px", textTransform: "uppercase" }}>Backup code (export)</h3>
        <textarea id="set-export" ref=${taRef} readOnly value=${json} style=${{ minHeight: "110px", fontFamily: "var(--mono)", fontSize: "11px" }} aria-label="Export data as JSON"></textarea>
        <div className="btn-row"><button className="btn btn-sm btn-amber" onClick=${copy}>Copy JSON</button>${downloads ? html`<button className="btn btn-sm btn-line" onClick=${save}>Save as file</button>` : null}</div>
        ${copied ? html`<p className="note" role="status">${copied}</p>` : null}
        <hr className="sep"/>
        <h3 style=${{ fontSize: "22px", textTransform: "uppercase" }}>Import</h3>
        <textarea id="set-import" value=${imp} onInput=${e => setImp(e.target.value)} placeholder="Paste a LIFEFLIX export here" style=${{ minHeight: "80px", fontFamily: "var(--mono)", fontSize: "11px" }}></textarea>
        ${impErr ? html`<p className="note" style=${{ color: "var(--bad)" }}>${impErr}</p>` : null}
        <div className="btn-row"><button className="btn btn-sm btn-amber" disabled=${!imp.trim()} onClick=${doMerge}>Merge into my data</button><button className="btn btn-sm btn-line" disabled=${!imp.trim()} onClick=${doImport}>Replace my data</button></div>
        <p className="note">Merge keeps everything from both devices. Replace throws away what's here.</p>
        <hr className="sep"/>
        <h3 style=${{ fontSize: "22px", textTransform: "uppercase", color: "var(--bad)" }}>Reset</h3>
        <p className="dim">Deletes every session, urge log, custom episode and milestone, here and in your account sync. Export first if you might want it back. Type RESET to confirm.</p>
        <div style=${{ display: "flex", gap: "8px" }}><input id="set-reset" value=${reset} onInput=${e => setReset(e.target.value)} placeholder="RESET" aria-label="Type RESET to confirm"/><button className="btn btn-danger" disabled=${reset !== "RESET"} onClick=${doReset}>Reset all</button></div>
      </div>
    </div>
  </div>`;
}


/* =========================================================
   CLINICAL TOOLKIT — techniques adapted from published CBT / ACT / motivation research.
   Not therapy and not a diagnosis.
   ========================================================= */
const TOOLS = [
  { id: "diag", t: "Why am I procrastinating?", src: "Piers Steel · The Procrastination Equation", min: "1 min", d: "Score expectancy, value, impulsiveness and delay for one task. Get the fix that targets your weakest factor.", why: "Steel's meta-analysis of hundreds of procrastination studies found that avoidance rises when you doubt success, find the task dull, are easily distracted, or the payoff is far away. Fix the weakest factor, not all of them." },
  { id: "woop", t: "WOOP plan", src: "Gabriele Oettingen · Rethinking Positive Thinking", min: "3 min", d: "Wish, Outcome, Obstacle, Plan. Turns a fantasy into an if-then plan for the exact moment you usually bail.", why: "Positive fantasies alone can reduce effort: the brain enjoys the imagined future as if it already happened. Pairing the wish with your inner obstacle, then an if-then plan (Gollwitzer's implementation intentions), reliably increases follow-through. This is the direct antidote to 'planning feels better than doing'." },
  { id: "thought", t: "Thought record", src: "David Burns · Feeling Good (TIC-TOC) · Bill Knaus · The Procrastination Workbook", min: "4 min", d: "Catch the task-interfering thought, name the distortion, write a task-oriented answer, then act.", why: "In cognitive therapy, avoidance is often driven by automatic thoughts ('I'll do it when I feel like it', 'it has to be perfect'). Writing them down and answering them weakens their grip. Burns calls these TICs (task-interfering cognitions) and TOCs (task-oriented cognitions)." },
  { id: "defuse", t: "Unhook from a thought", src: "Russ Harris · The Happiness Trap · Steven Hayes (ACT)", min: "2 min", d: "Watch the thought instead of obeying it. Then do the next valued action with the thought still there.", why: "Acceptance and Commitment Therapy doesn't try to win the argument with a thought. It changes your relationship to it: 'I'm having the thought that I'll fail' is a thought, not an instruction." },
  { id: "values", t: "Values compass", src: "Steven Hayes (ACT) · Wilson's Valued Living Questionnaire", min: "5 min", d: "Rate how important each life area is and how consistently you lived it this week. The biggest gap gets a mission.", why: "Goals end; values don't. When a task is linked to something you genuinely care about, it becomes easier to tolerate discomfort for it. The importance-vs-consistency gap shows where avoidance costs you most." },
  { id: "slip", t: "Slip recovery protocol", src: "Kristin Neff · Self-Compassion · Marlatt & Gordon · Relapse Prevention", min: "3 min", d: "For after a lost day or week. Stops one slip turning into a collapse.", why: "Marlatt called it the abstinence violation effect: after one slip, people decide 'I've blown it' and give up entirely. Research on self-compassion (Neff; Wohl et al., 2010) shows that people who forgive a lapse procrastinate less afterwards, while self-criticism predicts more avoidance." },
  { id: "bundle", t: "Temptation bundles", src: "Katy Milkman · How to Change", min: "1 min", d: "Lock a guilty pleasure to a task you avoid: the pleasure is only allowed during the task.", why: "In Milkman's gym study, people who could only listen to gripping audiobooks at the gym went more often. You turn the thing you'd escape into the reward for showing up." },
  { id: "contract", t: "Ulysses contract", src: "Commitment devices: Giné, Karlan & Zinman (2010) · Milkman's fresh-start effect", min: "3 min", d: "Sign this week's commitment, set a real stake, name a referee. Binds future-you while present-you is willing.", why: "Ulysses had himself tied to the mast because he knew he'd give in to the Sirens later. Commitment contracts with a stake and a referee measurably improve follow-through. Loss aversion makes a stake you'd hate to pay more motivating than a reward." }
];
const DISTORTIONS = [
  ["all", "All-or-nothing", "\"If I can't do it properly, there's no point starting.\""],
  ["perfect", "Perfectionism", "\"My CV has to be perfect before I send anything.\""],
  ["fortune", "Fortune telling", "\"I won't get the job anyway.\""],
  ["should", "Should statements", "\"I should have done this weeks ago.\""],
  ["label", "Labelling", "\"I'm just lazy. I'm a procrastinator.\""],
  ["discount", "Discounting the positive", "\"Three years of switchboard projects doesn't count.\""],
  ["emotional", "Emotional reasoning", "\"I feel overwhelmed, so it must be too big.\""],
  ["manana", "Mañana thinking (Knaus)", "\"I'll feel more like it tomorrow.\""],
  ["research", "Contingency mañana (Knaus)", "\"I need to research more before I can start.\""],
  ["mind", "Mind reading", "\"Recruiters will think my experience is thin.\""]
];
const EMOTIONS = ["Anxious", "Bored", "Overwhelmed", "Ashamed", "Frustrated", "Tired", "Uncertain", "Flat", "Restless"];
const TRIGGERS = ["Tired after work", "Phone within reach", "Task felt vague", "Task felt too big", "Fear of rejection", "Boredom", "Stress", "Late night", "Weekend drift", "A new idea grabbed me"];
const DOMAINS = [
  ["career", "Career & craft", "Become a technically respected electrical engineer who delivers."],
  ["money", "Money & security", "Build a home and a safety net I control."],
  ["health", "Health & energy", "Have the energy to do hard things well."],
  ["relationships", "Relationships", "Show up for the people who matter."],
  ["growth", "Growth & learning", "Keep getting better instead of just getting by."],
  ["freedom", "Freedom & ownership", "Own something that earns without asking permission."]
];
const DOMAIN_ATTR = { career: "career", money: "wealth", health: "health", relationships: "health", growth: "discipline", freedom: "courage" };
const ATTR_DOMAIN = { career: "career", wealth: "money", health: "health", discipline: "growth", focus: "growth", courage: "freedom" };
const money = n => "$" + Math.round(n).toLocaleString("en-AU");
const weeklyGap = s => Math.max(0, (s.profile.target || 0) - (s.profile.salary || 0)) / 52;
const clockIn = min => { const t = new Date(Date.now() + min * 60000); return t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };

function contractEval(s, c, today) {
  const we = addDays(c.week, 6);
  // Only sessions with roughly two minutes or more of real focus count toward a contract.
  const sess = s.sessions.filter(x => x.day >= c.week && x.day <= we && productive(x) && x.actual >= 110);
  const count = sess.length, minutes = Math.round(sess.reduce((a, x) => a + x.actual, 0) / 60);
  const ended = today > we;
  let status = "active";
  if (c.brokenEarly) status = "broken";
  else if (ended) status = (count >= c.sessions && minutes >= c.minutes && (!c.must || c.mustDone)) ? "kept" : "broken";
  return { we, count, minutes, ended, status };
}
function refereeReport(s, c, today) {
  const e = contractEval(s, c, today);
  return [
    `LIFEFLIX weekly report: ${niceDate(c.week)} to ${niceDate(e.we)}`,
    `Committed: ${c.sessions} focus sessions, ${c.minutes} focused minutes${c.must ? `, must-do: ${c.must}` : ""}.`,
    `Actual so far: ${e.count} sessions, ${e.minutes} minutes${c.must ? `, must-do ${c.mustDone ? "done" : "not done"}` : ""}.`,
    `Status: ${e.status === "active" ? "in progress" : e.status.toUpperCase()}.`,
    `Stake if broken: ${c.stake || "none set"}${c.paid ? " (paid)" : ""}.`,
    `Referee: ${c.referee || "none named"}. Self-reported from my tracker; please hold me to it.`
  ].join("\n");
}
function noMercyLine(s, d, prio) {
  const today = d.today; const facts = [];
  let streak = 0;
  for (let i = 1; i <= 7; i++) { const k = addDays(today, -i); const dd = s.daily[k]; if (!dd || !dd.priority) break; if (s.sessions.some(x => x.day === k && x.mid === dd.priority && x.outcome === "done")) break; streak++; }
  if (streak >= 2) facts.push(`your daily priority has gone undone ${streak} days running`);
  const cc = d.topCat ? d.catCounts[d.topCat] : 0;
  if (cc >= 3) { const dn = s.sessions.filter(x => x.outcome === "done" && (x.tags || []).includes(d.topCat)).length; facts.push(`you've named "${CATS[d.topCat].label.toLowerCase()}" as the thing you're avoiding ${cc} times and completed ${dn} mission${dn === 1 ? "" : "s"} on it`); }
  const broken = s.contracts.filter(c => contractEval(s, c, today).status === "broken" && !c.paid);
  if (broken.length) facts.push(`you still owe "${broken[0].stake}" on a broken contract`);
  const ex = s.excuses.filter(e => Date.now() - e.ts < 14 * 86400000).slice(-2);
  if (!facts.length && !ex.length) return null;
  const exTxt = ex.length ? " Your own words: " + ex.map(e => `${niceDate(dayKey(new Date(e.ts)))}, "${e.text.slice(0, 70)}"`).join("; ") + "." : "";
  const f = facts.length ? facts.join("; ") + "." : "";
  return `Receipts: ${f ? f.charAt(0).toUpperCase() + f.slice(1) : ""}${exTxt} You don't need more insight. You need ${prio ? prio.minutes : 10} minutes on "${prio ? prio.title : "the priority"}". Start.`;
}

function HomeBanners({ s, d, coach, goTool }) {
  const today = d.today, ws = weekStartKey(today);
  const c = s.contracts.find(x => x.week === ws);
  const slipped = (d.daysSinceLast !== null && d.daysSinceLast >= 2 && d.todays.length === 0) || d.distractedToday >= 2;
  const fresh = !c && (parseDay(today).getDay() === 1 || parseDay(today).getDate() === 1 || slipped);
  const out = [];
  if (slipped) out.push(html`<div key="slip" className="banner nudge"><div><div className="eyebrow" style=${{ color: "var(--crimson)" }}>Slip detected</div><div style=${{ fontWeight: 700 }}>${d.daysSinceLast >= 2 ? `${d.daysSinceLast} days since your last session.` : `${d.distractedToday} sessions lost to distraction today.`} One slip only becomes a collapse if you decide it already is one.</div></div><button className="btn btn-sm btn-amber" onClick=${() => goTool("slip")}>Run slip recovery (3 min)</button></div>`);
  if (c) { const e = contractEval(s, c, today); out.push(html`<div key="c" className="banner"><div style=${{ minWidth: 0 }}><div className="eyebrow">This week's contract · stake: ${c.stake || "none"}</div><div style=${{ fontWeight: 700 }}><span className="mono">${e.count}/${c.sessions}</span> sessions · <span className="mono">${e.minutes}/${c.minutes}</span> min${c.must ? ` · must-do ${c.mustDone ? "✓" : "open"}` : ""}</div></div><button className="btn btn-sm btn-line" onClick=${() => goTool("contract")}>View contract</button></div>`); }
  else if (fresh) out.push(html`<div key="f" className="banner"><div><div className="eyebrow" style=${{ color: "var(--tungsten)" }}>Fresh start</div><div style=${{ fontWeight: 700 }}>${slipped ? "A clean slate starts now, not next Monday." : parseDay(today).getDay() === 1 ? "New week. Fresh starts are when commitments stick best." : "New month. A natural reset point."} Sign this week's contract.</div></div><button className="btn btn-sm btn-amber" onClick=${() => goTool("contract")}>Sign contract</button></div>`);
  return out.length ? html`<div>${out}</div>` : null;
}

function InsightPanels({ s, d, goTool }) {
  const moods = s.sessions.filter(x => x.moodBefore != null && x.moodAfter != null);
  const lift = moods.length ? moods.reduce((a, x) => a + (x.moodAfter - x.moodBefore), 0) / moods.length : null;
  const liftDone = moods.filter(x => productive(x)); const liftD = liftDone.length ? liftDone.reduce((a, x) => a + (x.moodAfter - x.moodBefore), 0) / liftDone.length : null;
  const wc = { E: 0, V: 0, I: 0, D: 0 }; s.diag.forEach(x => wc[x.weak] = (wc[x.weak] || 0) + 1);
  const WN = { E: "Low confidence (expectancy)", V: "Low value", I: "High impulsiveness", D: "Distant payoff (delay)" };
  const maxW = Math.max(1, ...Object.values(wc));
  const tc = {}; s.slips.forEach(x => (x.triggers || []).forEach(t => tc[t] = (tc[t] || 0) + 1));
  const dc = {}; s.thoughts.forEach(x => (x.distortions || []).forEach(t => dc[t] = (dc[t] || 0) + 1));
  const tRows = Object.entries(tc).sort((a, b) => b[1] - a[1]).slice(0, 5), dRows = Object.entries(dc).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maxT = Math.max(1, ...tRows.map(x => x[1])), maxD = Math.max(1, ...dRows.map(x => x[1]));
  return html`<div className="grid-2">
    <div className="panel">
      <h3>Action → mood</h3>
      ${lift === null ? html`<p className="dim">Rate your mood before and after a mission to see this. Behavioural activation (Martell, Addis & Jacobson) rests on one finding: mood tends to follow action, not the other way round.</p>` : html`<${React.Fragment}>
        <div style=${{ display: "flex", gap: "18px", alignItems: "baseline", flexWrap: "wrap" }}><div><div className="big-num" style=${{ color: lift >= 0 ? "var(--ok)" : "var(--bad)" }}>${lift >= 0 ? "+" : ""}${lift.toFixed(1)}</div><div className="note">average mood change, ${moods.length} rated sessions</div></div>
        ${liftD !== null ? html`<div><div className="big-num" style=${{ fontSize: "30px" }}>${liftD >= 0 ? "+" : ""}${liftD.toFixed(1)}</div><div className="note">after real progress</div></div>` : null}</div>
        <p className="note">${lift > 0.3 ? "Your own data says starting makes you feel better. Remember this the next time you wait to feel like it." : "No clear lift yet. Keep rating; a few sessions isn't enough to judge."}</p>
      <//>`}
    </div>
    <div className="panel">
      <h3>Why you procrastinate</h3>
      ${s.diag.length ? html`<div className="bars">${Object.entries(wc).map(([k, n]) => html`<div key=${k} className="bar-row"><span>${WN[k]}</span><div className="track"><i style=${{ width: n / maxW * 100 + "%", background: "var(--s3)" }}></i></div><span className="n">${n}</span></div>`)}</div>` : html`<p className="dim">Run the procrastination diagnosis on a task to see which factor trips you most.</p>`}
      ${tRows.length ? html`<div><div className="eyebrow" style=${{ marginBottom: "8px" }}>Slip triggers</div><div className="bars">${tRows.map(([k, n]) => html`<div key=${k} className="bar-row"><span>${k}</span><div className="track"><i style=${{ width: n / maxT * 100 + "%", background: "var(--crimson)" }}></i></div><span className="n">${n}</span></div>`)}</div></div>` : null}
      ${dRows.length ? html`<div><div className="eyebrow" style=${{ marginBottom: "8px" }}>Thinking traps</div><div className="bars">${dRows.map(([k, n]) => { const dd = DISTORTIONS.find(x => x[0] === k); return html`<div key=${k} className="bar-row"><span>${dd ? dd[1] : k}</span><div className="track"><i style=${{ width: n / maxD * 100 + "%", background: "var(--tungsten)" }}></i></div><span className="n">${n}</span></div>`; })}</div></div>` : null}
      <div><button className="btn btn-sm btn-line" onClick=${() => goTool("diag")}>Run a diagnosis</button></div>
    </div>
  </div>`;
}

  const [copied, setCopied] = useState("");
  const copy = async (txt) => { try { await navigator.clipboard.writeText(txt); setCopied("Copied. Send it to your referee."); } catch (e) { setCopied("Copy blocked here; select the text and copy it manually."); } };
  return html`<div className="grid-2">
    <div className="panel">
      <h3>Ulysses contract</h3>
      ${c ? (() => { const e = contractEval(s, c, d.today); const rep = refereeReport(s, c, d.today); return html`<${React.Fragment}>
        <div style=${{ display: "flex", gap: "8px", alignItems: "center" }}><span className=${"chip " + (e.status === "kept" ? "ok" : e.status === "broken" ? "bad" : "amber")}>${e.status === "active" ? "In progress" : e.status}</span><span className="dim">${e.count}/${c.sessions} sessions · ${e.minutes}/${c.minutes} min</span></div>
        ${e.status === "broken" ? html`<p><b>Stake owed:</b> ${c.stake || "none set"}. ${c.paid ? "Marked paid." : coach === "brutal" ? "Pay it. A stake you don't pay is a stake that stops working." : "Paying it keeps future contracts meaningful. Then sign a smaller one for next week."}</p>` : null}
        <textarea id="recap-report" readOnly value=${rep} style=${{ minHeight: "120px", fontFamily: "var(--mono)", fontSize: "12px" }} aria-label="Referee report"></textarea>
        <div className="btn-row"><button className="btn btn-sm btn-amber" onClick=${() => copy(rep)}>Copy report for ${c.referee || "referee"}</button>${e.status === "broken" && !c.paid ? html`<button className="btn btn-sm btn-line" onClick=${() => update(n => { const x = n.contracts.find(y => y.id === c.id); if (x) x.paid = Date.now(); })}>I paid the stake</button>` : null}</div>
        ${copied ? html`<p className="note" role="status">${copied}</p>` : null}
      <//>`; })() : html`<p className="dim">No contract signed for this week.</p>`}
    </div>
    <div className="panel">
      <h3>Cost of avoidance</h3>
      ${gap > 0 ? html`<p>The gap between ${money(s.profile.salary)} and your ${money(s.profile.target)} target is about <b className="mono" style=${{ color: "var(--tungsten)" }}>${money(gap)}</b> a week before tax.</p>
        <p className="dim">${careerDone === 0 ? `This week had zero career sessions. If a role at your target is attainable (an assumption, not a promise), every week the search waits pushes that money further away.` : `${careerDone} career session${careerDone > 1 ? "s" : ""} this week. That's how the gap starts closing.`}${postponed.length ? ` ${postponed.length} daily priorit${postponed.length > 1 ? "ies" : "y"} slipped.` : ""}</p>
        <p className="note">Illustrative only. Edit your salary and target in Settings.</p>` : html`<p className="dim">Set a target salary above your current one in Settings to see this.</p>`}
      ${ex.length ? html`<div><div className="eyebrow" style=${{ marginBottom: "8px" }}>${s.prefs.noMercy ? "Receipts: your words this week" : "Notes you logged this week"}</div><ul className="list">${ex.slice(-6).map(e => html`<li key=${e.id}><span>"${e.text}"</span><span>${niceDate(dayKey(new Date(e.ts)))} · ${e.src}</span></li>`)}</ul></div>` : null}
    </div>
  </div>`;
}

function Tools(props) {
  const { s, tool, setTool } = props;
  if (tool && tool.id) {
    const map = { diag: Diagnose, woop: Woop, thought: ThoughtRecord, defuse: Defuse, values: Values, slip: Slip, bundle: Bundles, contract: Contract };
    const C = map[tool.id]; const meta = TOOLS.find(t => t.id === tool.id);
    return html`<div className="wrap section" style=${{ display: "flex", flexDirection: "column", gap: "16px", maxWidth: "900px" }}>
      <div><button className="btn btn-sm btn-line" onClick=${() => setTool(null)}>‹ All tools</button></div>
      <div><span className="eyebrow" style=${{ color: "var(--tungsten)" }}>${meta.src}</span><h2 style=${{ fontSize: "clamp(34px,6vw,56px)", marginTop: "6px", textTransform: "uppercase" }}>${meta.t}</h2>
        <details style=${{ marginTop: "8px" }}><summary className="dim" style=${{ cursor: "pointer", fontWeight: 700 }}>Why this works</summary><p className="dim" style=${{ marginTop: "6px", maxWidth: "70ch" }}>${meta.why}</p></details></div>
      <${C} key=${tool.id + (tool.mid || "")} ...${props}/>
    </div>`;
  }

  return html`<div className="wrap section" style=${{ display: "flex", flexDirection: "column", gap: "16px" }}>
    <div><span className="eyebrow">Clinical toolkit</span><h2 style=${{ fontSize: "clamp(38px,7vw,64px)", marginTop: "6px" }}>Tools</h2>
      <p className="dim" style=${{ marginTop: "8px", maxWidth: "72ch" }}>Techniques from cognitive behavioural therapy, acceptance and commitment therapy and motivation research, adapted for self-use. Every tool ends in a real-world action. They're not therapy. If low mood or anxiety is persistent, talk to a GP or psychologist.</p></div>
    <div className="tool-grid">${TOOLS.map(t => html`<button key=${t.id} className="tool-card" onClick=${() => setTool({ id: t.id })}>
      ${used[t.id] ? html`<span className="chip amber tool-n">${used[t.id]}×</span>` : null}
      <span className="src">${t.min} · ${t.src}</span><span className="tt">${t.t}</span><span className="dim" style=${{ fontSize: "14px" }}>${t.d}</span></button>`)}</div>
  </div>`;
}

function MissionPick({ s, value, onChange, id }) {
  const act = activeMissions(s);
  return html`<select id=${id} value=${value || ""} onChange=${e => onChange(e.target.value)}>${act.map(m => html`<option key=${m.id} value=${m.id}>${seasonOf(m.season).code} · ${m.title}</option>`)}</select>`;
}

function Diagnose({ s, prio, coach, update, openBrief, tool }) {
  const act = activeMissions(s);
  const [mid, setMid] = useState((tool && tool.mid && act.some(x => x.id === tool.mid) && tool.mid) || (prio && prio.id) || (act[0] && act[0].id));
  const [f, setF] = useState({ E: 5, V: 5, I: 5, D: 5 });
  const m = s.missions.find(x => x.id === mid) || act[0];
  const M = (f.E * f.V) / (f.I * f.D);
  const pos = clamp((Math.log10(M) + 2) / 4, 0, 1);
  const prob = { E: 10 - f.E, V: 10 - f.V, I: f.I - 1, D: f.D - 1 };
  const weak = Object.entries(prob).sort((a, b) => b[1] - a[1])[0][0];
  const past = s.sessions.filter(x => x.outcome === "done").length;
  const FACT = [
    ["E", "Expectancy", "How confident am I that I can do this well?", "Not at all", "Certain"],
    ["V", "Value", "How rewarding or meaningful does it feel right now?", "Pointless", "Very"],
    ["I", "Impulsiveness", "How distractible am I right now?", "Calm", "Scattered"],
    ["D", "Delay", "How far away does the payoff or deadline feel?", "Today", "Months away"]
  ];
  const RX = {
    E: { name: "Low expectancy", fix: "You doubt you can do it, so your brain avoids a likely failure. Steel's remedy is a success spiral: a task so small you're certain to finish, plus evidence you've done hard things before.", ev: past ? `Evidence: you've completed ${past} mission${past === 1 ? "" : "s"} in LIFEFLIX, and delivered switchboard and switchroom projects for three years.` : "Evidence: three years of delivering switchboard and switchroom projects in Australia.", btn: "Start a 2-minute certain win", o: () => ({ minutes: 2, target: "Only the first visible step: " + (m.firstStep || "open it") }) },
    V: { name: "Low value", fix: "The task feels dull or pointless right now. Connect it to something you care about, turn it into a challenge, or bundle a temptation with it.", ev: s.values[ATTR_DOMAIN[m && m.attr]] && s.values[ATTR_DOMAIN[m.attr]].text ? `Your value: ${s.values[ATTR_DOMAIN[m.attr]].text}` : "Tip: fill in your values compass so every mission shows why it matters.", btn: "Start 10 minutes as a beat-the-clock challenge", o: () => ({ minutes: 10, target: "Beat the clock: " + (m.deliverable || "finish the first part") + " before the timer ends." }) },
    I: { name: "High impulsiveness", fix: "Distraction is winning. Don't rely on willpower; change the environment. Phone in another room, one tab open, and an if-then plan for the urge you know is coming.", ev: s.urges.length ? `You've fought ${s.urges.length} urges so far. Your most common: ${URGES[Object.entries(s.urges.reduce((a, u) => (a[u.urge] = (a[u.urge] || 0) + 1, a), {})).sort((a, b) => b[1] - a[1])[0][0]].label.toLowerCase()}.` : "Stimulus control beats willpower every time.", btn: "Start 25 minutes, phone out of the room", o: () => ({ minutes: 25, target: "Phone in another room, all other tabs closed. Then: " + (m.firstStep || "start") }) },
    D: { name: "Distant payoff", fix: "The reward feels too far away: a 2027 move, a future salary. Bring the deadline forward with one sub-goal due within the hour.", ev: weeklyGap(s) > 0 ? `Make it concrete: the salary gap to your target is about ${money(weeklyGap(s))} a week.` : "Short deadlines beat distant goals.", btn: "Start 10 minutes with a deadline", o: () => ({ minutes: 10, target: `Finish one sub-goal by ${clockIn(10)}: ` + (m.deliverable || m.title) }) }
  };
  const rx = RX[weak];
  if (!m) return html`<p className="dim">Add a mission first.</p>`;
  return html`<${React.Fragment}>
    <label className="f" htmlFor="dg-m">Which task are you avoiding?<${MissionPick} id="dg-m" s=${s} value=${mid} onChange=${setMid}/></label>
    <div className="panel">
      ${FACT.map(([k, n, q, lo, hi]) => html`<div key=${k} className="factor">
        <label htmlFor=${"dg-" + k} style=${{ fontWeight: 800 }}>${n}</label><span className="mono" style=${{ fontSize: "18px" }}>${f[k]}/10</span>
        <input id=${"dg-" + k} type="range" min="1" max="10" value=${f[k]} onInput=${e => { const v = Number(e.target.value); setF(x => Object.assign({}, x, { [k]: v })); }} style=${{ gridColumn: "1/-1" }}/>
        <span className="hint">${q} (1 = ${lo}, 10 = ${hi})</span></div>`)}
      <div><div className="eyebrow" style=${{ marginBottom: "8px" }}>Motivation = (Expectancy × Value) ÷ (Impulsiveness × Delay) = <span className="mono" style=${{ color: "var(--fg)" }}>${M.toFixed(2)}</span></div>
        <div className="meter" role="img" aria-label=${"Motivation score " + M.toFixed(2)}><i style=${{ left: pos * 100 + "%" }}></i></div>
        <div style=${{ display: "flex", justifyContent: "space-between" }} className="note"><span>Avoid</span><span>Neutral</span><span>Go</span></div></div>
    </div>
    <div className="rx">
      <span className="eyebrow" style=${{ color: "var(--tungsten)" }}>Weakest factor: ${rx.name}</span>
      <p style=${{ fontSize: "16px" }}>${rx.fix}</p>
      <p className="dim">${rx.ev}</p>
      ${coach === "brutal" ? html`<p style=${{ fontWeight: 700 }}>Diagnosis done. Don't turn this into another research project. Apply the fix now.</p>` : null}
      <div className="btn-row"><button className="btn btn-amber" onClick=${() => { update(n => { n.diag.push({ id: uid(), ts: Date.now(), mid: m.id, title: m.title, E: f.E, V: f.V, I: f.I, D: f.D, weak }); }); openBrief(m, rx.o()); }}>▶ ${rx.btn}</button>
        <button className="btn btn-line" onClick=${() => { update(n => { n.diag.push({ id: uid(), ts: Date.now(), mid: m.id, title: m.title, E: f.E, V: f.V, I: f.I, D: f.D, weak }); }); }}>Save without starting</button></div>
    </div>
  <//>`;
}

function Woop({ s, coach, update, flash }) {
  const blank = { wish: "", outcome: "", obstacle: "", ifs: "", then: "" };
  const [f, setF] = useState(blank); const [step, setStep] = useState(0);
  const set = (k, v) => setF(x => Object.assign({}, x, { [k]: v }));
  const STEPS = [
    ["wish", "Wish", "What do you want to achieve in the next 4 weeks? Challenging but realistic.", "e.g. Send three tailored applications for $140K+ roles"],
    ["outcome", "Outcome", "What's the best outcome of fulfilling it? Close your eyes and picture it for 30 seconds before writing.", "e.g. Interviews booked, a real salary number, Melbourne on my terms"],
    ["obstacle", "Obstacle", "What is it inside you that stops you? A feeling, a habit, a belief. Not 'no time'.", "e.g. When I sit down to tailor the CV I feel it isn't good enough and open YouTube"],
    ["plan", "Plan", "If that obstacle shows up, what exactly will you do?", ""]
  ];
  const ok = step < 3 ? f[STEPS[step][0]].trim() : f.ifs.trim() && f.then.trim();
  const save = () => { update(n => { n.woop.push(Object.assign({ id: uid(), ts: Date.now(), createdAt: Date.now(), active: true }, f)); }); setF(blank); setStep(0); flash("WOOP plan saved", "It will appear in mission briefings and urge fights."); };
  return html`<${React.Fragment}>
    <div className="panel">
      <div className="steps">${STEPS.map((x, i) => html`<i key=${i} className=${i <= step ? "on" : ""}></i>`)}</div>
      <span className="eyebrow">${STEPS[step][1]} · step ${step + 1} of 4</span>
      <p style=${{ fontSize: "16px" }}>${STEPS[step][2]}</p>
      ${step === 0 ? html`<div className="chips">${["Send 3 tailored applications this month", "Finish P6 fundamentals by January", "Get my first business customer", "Automate savings this payday"].map(c => html`<button key=${c} onClick=${() => set("wish", c)}>${c}</button>`)}</div>` : null}
      ${step < 3 ? html`<textarea id=${"woop-" + STEPS[step][0]} value=${f[STEPS[step][0]]} onInput=${e => set(STEPS[step][0], e.target.value)} placeholder=${STEPS[step][3]} aria-label=${STEPS[step][1]}></textarea>` : html`<${React.Fragment}>
        <label className="f" htmlFor="woop-if">If…<input id="woop-if" value=${f.ifs} onInput=${e => set("ifs", e.target.value)} placeholder=${f.obstacle ? f.obstacle.slice(0, 80) : "I feel the urge to open YouTube while editing my CV"}/></label>
        <label className="f" htmlFor="woop-then">…then I will<input id="woop-then" value=${f.then} onInput=${e => set("then", e.target.value)} placeholder="write the ugliest first draft for 2 minutes before deciding anything"/></label>
      <//>`}
      <div className="btn-row">${step > 0 ? html`<button className="btn btn-line btn-sm" onClick=${() => setStep(step - 1)}>Back</button>` : null}
        ${step < 3 ? html`<button className="btn btn-amber btn-sm" disabled=${!ok} onClick=${() => setStep(step + 1)}>Next</button>` : html`<button className="btn btn-amber btn-sm" disabled=${!ok} onClick=${save}>Save plan</button>`}</div>
    </div>
    ${s.woop.length ? html`<div className="panel"><h3>Your plans</h3><ul className="list">${s.woop.slice().reverse().map(w => html`<li key=${w.id} style=${{ flexDirection: "column", alignItems: "stretch", opacity: w.active ? 1 : .55 }}>
      <div><b>${w.wish}</b></div><div className="dim">If ${w.ifs}, then ${w.then}.</div>
      <div className="btn-row"><button className="btn btn-sm btn-line" onClick=${() => update(n => { const x = n.woop.find(y => y.id === w.id); if (x) x.active = !x.active; })}>${w.active ? "Pause" : "Activate"}</button><button className="btn btn-sm btn-line" style=${{ color: "var(--bad)" }} onClick=${() => update(n => { n.woop = n.woop.filter(y => y.id !== w.id); n.tomb.push(w.id); })}>Delete</button></div></li>`)}</ul></div>` : null}
  <//>`;
}

function ThoughtRecord({ s, prio, coach, update, openBrief, flash }) {
  const act = activeMissions(s);
  const [f, setF] = useState({ mid: prio ? prio.id : (act[0] && act[0].id), thought: "", emotion: "Anxious", before: 7, distortions: [], against: "", answer: "", after: 5 });
  const [saved, setSaved] = useState(false);
  const set = (k, v) => setF(x => Object.assign({}, x, { [k]: v }));
  const tog = k => set("distortions", f.distortions.includes(k) ? f.distortions.filter(x => x !== k) : f.distortions.concat([k]));
  const m = s.missions.find(x => x.id === f.mid);
  const valid = f.thought.trim() && f.answer.trim();
  return html`<div className="panel" style=${{ gap: "16px" }}>
    <label className="f" htmlFor="tr-m">1. The task you're avoiding<${MissionPick} id="tr-m" s=${s} value=${f.mid} onChange=${v => set("mid", v)}/></label>
    <label className="f" htmlFor="tr-t">2. The thought that stops you (TIC)<textarea id="tr-t" value=${f.thought} onInput=${e => set("thought", e.target.value)} placeholder="Write it exactly as it sounds in your head. e.g. 'There's no point applying until my P6 is better.'"></textarea></label>
    <div className="f-row">
      <label className="f" htmlFor="tr-e">3. Feeling<select id="tr-e" value=${f.emotion} onChange=${e => set("emotion", e.target.value)}>${EMOTIONS.map(x => html`<option key=${x}>${x}</option>`)}</select></label>
      <label className="f" htmlFor="tr-b">Strength <span className="mono" style=${{ color: "var(--fg)" }}>${f.before}/10</span><input id="tr-b" type="range" min="0" max="10" value=${f.before} onInput=${e => set("before", Number(e.target.value))}/></label>
    </div>
    <div><div className="eyebrow" style=${{ marginBottom: "8px" }}>4. Which thinking traps are in it?</div>
      <div className="dchips">${DISTORTIONS.map(([k, n, ex]) => html`<button key=${k} aria-pressed=${f.distortions.includes(k)} onClick=${() => tog(k)}>${n}<small>${ex}</small></button>`)}</div></div>
    <label className="f" htmlFor="tr-a">5. Evidence against the thought<textarea id="tr-a" value=${f.against} onInput=${e => set("against", e.target.value)} placeholder="What would you tell a colleague who said this? What facts don't fit?"></textarea></label>
    <label className="f" htmlFor="tr-o">6. Task-oriented answer (TOC)<textarea id="tr-o" value=${f.answer} onInput=${e => set("answer", e.target.value)} placeholder="e.g. 'Plenty of $140K roles don't list P6. I can apply now and learn P6 in parallel.'"></textarea></label>
    <label className="f" htmlFor="tr-af">7. Strength of the feeling now <span className="mono" style=${{ color: "var(--fg)" }}>${f.after}/10</span><input id="tr-af" type="range" min="0" max="10" value=${f.after} onInput=${e => set("after", Number(e.target.value))}/></label>
    <div className="btn-row">
      <button className="btn btn-amber" disabled=${!valid || !m} onClick=${() => { if (!saved) update(n => { n.thoughts.push(Object.assign({ id: uid(), ts: Date.now(), kind: "record", title: m ? m.title : "" }, f)); }); setSaved(true); openBrief(m, { minutes: 2, target: f.answer.slice(0, 120) }); }}>▶ Save and act: 2 minutes</button>
      <button className="btn btn-line" disabled=${!valid || saved} onClick=${() => { update(n => { n.thoughts.push(Object.assign({ id: uid(), ts: Date.now(), kind: "record", title: m ? m.title : "" }, f)); }); setSaved(true); flash("Thought record saved", ""); }}>${saved ? "Saved" : "Save only"}</button>
    </div>
    <p className="note">${coach === "brutal" ? "A thought record you don't act on is just journaling. The 2-minute button is the point." : "You don't need to fully believe the new answer. Acting on it is what makes it believable."}</p>
  </div>`;
}

function Defuse({ s, prio, coach, update, openBrief }) {
  const [t, setT] = useState(""); const [stage, setStage] = useState(0); const [leafKey, setLeafKey] = useState(0);
  const [hookB, setHookB] = useState(7); const [hookA, setHookA] = useState(5);
  const clean = t.trim().replace(/^i('m| am) having the thought that\s*/i, "").replace(/[.!]+$/, "");
  return html`<div className="panel" style=${{ gap: "16px" }}>
    ${stage === 0 ? html`<${React.Fragment}>
      <label className="f" htmlFor="df-t">Write the sticky thought<input id="df-t" value=${t} onInput=${e => setT(e.target.value)} placeholder="I'm going to fail at this"/></label>
      <label className="f" htmlFor="df-hb">How much does it hook you? <span className="mono" style=${{ color: "var(--fg)" }}>${hookB}/10</span><input id="df-hb" type="range" min="0" max="10" value=${hookB} onInput=${e => setHookB(Number(e.target.value))}/></label>
      <div><button className="btn btn-amber" disabled=${!clean} onClick=${() => setStage(1)}>Unhook</button></div>
    <//>` : null}
    ${stage >= 1 ? html`<${React.Fragment}>
      <p style=${{ fontSize: "19px", fontWeight: 800 }}>${clean}.</p>
      <p style=${{ fontSize: "17px" }} className="dim">I'm having the thought that ${clean.charAt(0).toLowerCase() + clean.slice(1)}.</p>
      <p style=${{ fontSize: "16px" }} className="faint">I notice I'm having the thought that ${clean.charAt(0).toLowerCase() + clean.slice(1)}.</p>
      <div className="stream" aria-hidden="true"><div className="leaf" key=${leafKey} style=${{ top: "40%" }}>${clean}</div></div>
      <p className="dim">Imagine placing the thought on a leaf and watching it float down the stream. You don't push it away or argue with it. Thoughts come and go; you decide what your hands do.</p>
      <div className="btn-row"><button className="btn btn-sm btn-line" onClick=${() => setLeafKey(k => k + 1)}>Float it again</button></div>
      <label className="f" htmlFor="df-ha">How much does it hook you now? <span className="mono" style=${{ color: "var(--fg)" }}>${hookA}/10</span><input id="df-ha" type="range" min="0" max="10" value=${hookA} onInput=${e => setHookA(Number(e.target.value))}/></label>
      <p style=${{ fontWeight: 700 }}>${coach === "brutal" ? "The thought can come with you. It doesn't get a vote. Two minutes, thought and all." : "Can you make room for this thought and still take one small step that matters to you?"}</p>
      <div className="btn-row"><button className="btn btn-amber" disabled=${!prio} onClick=${() => { update(n => { n.thoughts.push({ id: uid(), ts: Date.now(), kind: "defuse", thought: clean, before: hookB, after: hookA, distortions: [] }); }); openBrief(prio, { minutes: 2, target: "Do the first step with the thought still there." }); }}>▶ 2 minutes on ${prio ? `"${prio.title}"` : "the priority"}</button></div>
    <//>` : null}
  </div>`;
}

function Values({ s, coach, update, openBrief }) {
  const set = (k, field, v) => update(n => { n.values[k] = Object.assign({ text: "", imp: 8, con: 5 }, n.values[k] || {}, { [field]: v }); });
  const rows = DOMAINS.map(([k, label, eg]) => { const v = s.values[k] || {}; const imp = v.imp == null ? 8 : v.imp, con = v.con == null ? 5 : v.con; return { k, label, eg, text: v.text || "", imp, con, gap: imp * (10 - con) / 10, set: !!s.values[k] }; });
  const top = rows.filter(r => r.set).sort((a, b) => b.gap - a.gap)[0];
  const mission = top ? activeMissions(s).filter(m => m.attr === DOMAIN_ATTR[top.k]).sort((a, b) => a.minutes - b.minutes)[0] : null;
  return html`<${React.Fragment}>
    ${top ? html`<div className="rx"><span className="eyebrow" style=${{ color: "var(--tungsten)" }}>Biggest gap: ${top.label}</span>
      <p style=${{ fontSize: "16px" }}>Importance ${top.imp}/10, lived ${top.con}/10 this week. ${coach === "brutal" ? "This is where your actions contradict what you say matters." : "This is where a small action would mean the most to you."}</p>
      ${mission ? html`<div><button className="btn btn-amber btn-sm" onClick=${() => openBrief(mission, {})}>▶ Act on it: ${mission.title}</button></div>` : null}</div>` : null}
    ${rows.map(r => html`<div key=${r.k} className="panel" style=${{ gap: "10px" }}>
      <div style=${{ display: "flex", justifyContent: "space-between", gap: "10px" }}><h3 style=${{ fontSize: "20px" }}>${r.label}</h3><span className="mono dim">gap ${r.gap.toFixed(1)}</span></div>
      <label className="f" htmlFor=${"vl-t-" + r.k}>What do I want to stand for here?<input id=${"vl-t-" + r.k} defaultValue=${r.text} placeholder=${r.eg} onBlur=${e => set(r.k, "text", e.target.value)}/></label>
      <div className="f-row">
        <label className="f" htmlFor=${"vl-i-" + r.k}>Importance <span className="mono" style=${{ color: "var(--fg)" }}>${r.imp}/10</span><input id=${"vl-i-" + r.k} type="range" min="1" max="10" value=${r.imp} onInput=${e => set(r.k, "imp", Number(e.target.value))}/></label>
        <label className="f" htmlFor=${"vl-c-" + r.k}>Lived it this week <span className="mono" style=${{ color: "var(--fg)" }}>${r.con}/10</span><input id=${"vl-c-" + r.k} type="range" min="1" max="10" value=${r.con} onInput=${e => set(r.k, "con", Number(e.target.value))}/></label>
      </div>
    </div>`)}
    <p className="note">Your value statements appear on matching mission briefings as "why it matters".</p>
  <//>`;
}

function Slip({ s, d, prio, coach, update, openBrief, flash }) {
  const [step, setStep] = useState(0);
  const auto = d.daysSinceLast !== null && d.daysSinceLast >= 2 ? `${d.daysSinceLast} days without a focus session.` : d.distractedToday ? `${d.distractedToday} distracted session${d.distractedToday > 1 ? "s" : ""} today.` : "";
  const [what, setWhat] = useState(auto);
  const [friend, setFriend] = useState("");
  const [trig, setTrig] = useState([]);
  const [plan, setPlan] = useState("");
  const tog = t => setTrig(trig.includes(t) ? trig.filter(x => x !== t) : trig.concat([t]));
  const finish = () => {
    update(n => {
      n.slips.push({ id: uid(), ts: Date.now(), what, friend, triggers: trig, plan });
      if (what.trim()) n.excuses.push({ id: uid(), ts: Date.now(), text: what.trim(), src: "slip" });
      if (plan.trim() && trig.length) n.woop.push({ id: uid(), ts: Date.now(), createdAt: Date.now(), active: true, wish: "Recover after slips", outcome: "One slip stays one slip", obstacle: trig.join(", "), ifs: trig[0].toLowerCase(), then: plan.trim() });
    });
    setStep(4);
  };
  const B = coach === "brutal";
  return html`<div className="panel" style=${{ gap: "16px" }}>
    <div className="steps">${[0, 1, 2, 3, 4].map(i => html`<i key=${i} className=${i <= step ? "on" : ""}></i>`)}</div>
    ${step === 0 ? html`<${React.Fragment}>
      <span className="eyebrow">1 · Name it (mindfulness)</span>
      <p style=${{ fontSize: "16px" }}>${B ? "State what happened, plainly. No drama, no minimising." : "Describe what happened as you'd describe the weather: just facts, no verdict on yourself."}</p>
      <textarea id="sl-what" value=${what} onInput=${e => setWhat(e.target.value)} placeholder="e.g. Planned to apply for two roles this week. Spent the evenings on car reviews instead."></textarea>
      <div><button className="btn btn-amber btn-sm" disabled=${!what.trim()} onClick=${() => setStep(1)}>Next</button></div>
    <//>` : null}
    ${step === 1 ? html`<${React.Fragment}>
      <span className="eyebrow">2 · Common humanity and self-kindness</span>
      <p style=${{ fontSize: "16px" }}>${B ? "You're not uniquely broken. Avoidance is one of the most common human patterns there is. Self-attack doesn't fix it; research links it to more procrastination, not less. So skip the self-pity and the self-flogging. Both waste time." : "Everyone who has ever pursued something hard has had weeks like this. Slipping is part of changing, not proof you can't."}</p>
      <label className="f" htmlFor="sl-friend">What would you say to a mate who told you exactly this?<textarea id="sl-friend" value=${friend} onInput=${e => setFriend(e.target.value)} placeholder="e.g. One bad week doesn't cancel three years of delivering projects. Pick it back up tonight."></textarea></label>
      <p className="note">Now read it back as if it's addressed to you. It is.</p>
      <div className="btn-row"><button className="btn btn-line btn-sm" onClick=${() => setStep(0)}>Back</button><button className="btn btn-amber btn-sm" disabled=${!friend.trim()} onClick=${() => setStep(2)}>Next</button></div>
    <//>` : null}
    ${step === 2 ? html`<${React.Fragment}>
      <span className="eyebrow">3 · Trigger chain (relapse prevention)</span>
      <p style=${{ fontSize: "16px" }}>What set it off? Slips have patterns. Pick all that apply.</p>
      <div className="chips">${TRIGGERS.map(t => html`<button key=${t} aria-pressed=${trig.includes(t)} style=${trig.includes(t) ? { borderColor: "var(--tungsten)", background: "rgba(255,176,74,.12)" } : null} onClick=${() => tog(t)}>${t}</button>`)}</div>
      <div className="btn-row"><button className="btn btn-line btn-sm" onClick=${() => setStep(1)}>Back</button><button className="btn btn-amber btn-sm" disabled=${!trig.length} onClick=${() => setStep(3)}>Next</button></div>
    <//>` : null}
    ${step === 3 ? html`<${React.Fragment}>
      <span className="eyebrow">4 · Coping plan</span>
      <label className="f" htmlFor="sl-plan">Next time "${trig[0]}" happens, I will…<input id="sl-plan" value=${plan} onInput=${e => setPlan(e.target.value)} placeholder="e.g. do the 2-minute version before I sit on the couch"/></label>
      <p className="note">This becomes an active if-then plan that shows up in briefings and urge fights.</p>
      <div className="btn-row"><button className="btn btn-line btn-sm" onClick=${() => setStep(2)}>Back</button><button className="btn btn-amber btn-sm" disabled=${!plan.trim()} onClick=${finish}>Save plan</button></div>
    <//>` : null}
    ${step === 4 ? html`<${React.Fragment}>
      <span className="eyebrow">5 · Re-entry</span>
      <h3>The slip is logged. Now break the chain.</h3>
      <p className="dim">${B ? "The fastest way to end a bad run is to do something small in the next five minutes. Not tomorrow." : "The goal right now isn't to make up for lost time. It's just to show yourself you can start again."}</p>
      <div className="btn-row">${prio ? html`<button className="btn btn-amber" onClick=${() => openBrief(prio, { minutes: 2, target: "Re-entry: just the first visible step." })}>▶ 2 minutes on ${prio.title}</button>` : null}</div>
    <//>` : null}
  </div>`;
}

function Bundles({ s, coach, update, flash }) {
  const [want, setWant] = useState(""); const [attr, setAttr] = useState("health");
  return html`<${React.Fragment}>
    <div className="panel">
      <p style=${{ fontSize: "16px" }}>Rule: the pleasure is only allowed <b>during</b> the task. Never outside it.</p>
      <div className="chips">${["Watch YouTube car reviews", "Listen to my favourite podcast", "Good coffee from the café", "Browse business-idea threads"].map(c => html`<button key=${c} onClick=${() => setWant(c)}>${c}</button>`)}</div>
      <div className="f-row">
        <label className="f" htmlFor="bd-w">I only allow myself…<input id="bd-w" value=${want} onInput=${e => setWant(e.target.value)} placeholder="Listen to true-crime podcasts"/></label>
        <label className="f" htmlFor="bd-a">…during missions that build<select id="bd-a" value=${attr} onChange=${e => setAttr(e.target.value)}>${ATTR_KEYS.map(k => html`<option key=${k} value=${k}>${ATTRS[k].label}</option>`)}<option value="any">Any mission</option></select></label>
      </div>
      <div><button className="btn btn-amber btn-sm" disabled=${!want.trim()} onClick=${() => { update(n => { n.bundles.push({ id: uid(), ts: Date.now(), createdAt: Date.now(), want: want.trim(), attr }); }); setWant(""); flash("Bundle created", "It shows on matching mission briefings."); }}>Create bundle</button></div>
      <p className="note">Works best with low-focus tasks (exercise, admin, filing, chores). For deep work like P6 or CV writing, keep the bundle as the reward straight after.</p>
    </div>
    ${s.bundles.length ? html`<div className="panel"><h3>Active bundles</h3><ul className="list">${s.bundles.map(b => html`<li key=${b.id}><span>${b.want} <span className="dim">→ only during ${b.attr === "any" ? "any mission" : ATTRS[b.attr].label + " missions"}</span></span><button className="btn btn-sm btn-line" style=${{ color: "var(--bad)" }} onClick=${() => update(n => { n.bundles = n.bundles.filter(x => x.id !== b.id); n.tomb.push(b.id); })}>Remove</button></li>`)}</ul></div>` : null}
  <//>`;
}

function Contract({ s, d, coach, update, flash }) {
  const today = d.today, ws = weekStartKey(today);
  const cur = s.contracts.find(c => c.week === ws);
  const lastWeek = s.contracts.filter(c => c.week < ws).sort((a, b) => a.week < b.week ? 1 : -1)[0];
  const sugSessions = Math.max(3, Math.min(14, Math.round((d.week.filter(w => w.min > 0).length || 2) * 1.5)));
  const [f, setF] = useState({ sessions: sugSessions, minutes: Math.max(60, Math.round(d.avg14 * 7 * 1.2 / 10) * 10 || 150), must: "", stake: "", referee: "", sig: "", understand: false });
  const set = (k, v) => setF(x => Object.assign({}, x, { [k]: v }));
  const [confirmBreak, setConfirmBreak] = useState(false);
  const [copied, setCopied] = useState("");
  if (cur) {
    const e = contractEval(s, cur, today); const rep = refereeReport(s, cur, today);
    return html`<${React.Fragment}>
      <div className="contract-doc">
        <span className="eyebrow">Ulysses contract · ${niceDate(cur.week)} – ${niceDate(e.we)}</span>
        <p style=${{ fontSize: "16px" }}>I commit to <b>${cur.sessions} focus sessions</b> and <b>${cur.minutes} focused minutes</b> this week${cur.must ? html`, including: <b>${cur.must}</b>` : ""}. If I break this contract, I will <b>${cur.stake || "(no stake)"}</b>. My referee is <b>${cur.referee || "(none)"}</b>.</p>
        <div className="signature">${cur.sig}</div><span className="note">Signed ${new Date(cur.ts).toLocaleString()}</span>
      </div>
      <div className="panel">
        <div style=${{ display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap" }}><span className=${"chip " + (e.status === "kept" ? "ok" : e.status === "broken" ? "bad" : "amber")}>${e.status === "active" ? "In progress" : e.status}</span><span className="dim">Ends ${niceDate(e.we)}</span></div>
        <div className="bars">
          <div className="bar-row"><span>Sessions</span><div className="track"><i style=${{ width: clamp(e.count / cur.sessions, 0, 1) * 100 + "%", background: "var(--tungsten)" }}></i></div><span className="n">${e.count}/${cur.sessions}</span></div>
          <div className="bar-row"><span>Minutes</span><div className="track"><i style=${{ width: clamp(e.minutes / cur.minutes, 0, 1) * 100 + "%", background: "var(--tungsten)" }}></i></div><span className="n">${e.minutes}/${cur.minutes}</span></div>
        </div>
        ${cur.must ? html`<label style=${{ display: "flex", gap: "10px", alignItems: "center", fontWeight: 700 }}><input id="ct-mustdone" type="checkbox" style=${{ width: "20px", height: "20px" }} checked=${!!cur.mustDone} disabled=${e.ended} onChange=${ev => { const v = ev.target.checked; update(n => { const x = n.contracts.find(y => y.id === cur.id); if (x) x.mustDone = v; }); }}/>Must-do done: ${cur.must}</label>` : null}
        <textarea id="ct-report" readOnly value=${rep} style=${{ minHeight: "120px", fontFamily: "var(--mono)", fontSize: "12px" }} aria-label="Referee report"></textarea>
        <div className="btn-row"><button className="btn btn-sm btn-amber" onClick=${async () => { try { await navigator.clipboard.writeText(rep); setCopied("Copied. Message it to " + (cur.referee || "your referee") + "."); } catch (er) { setCopied("Copy blocked here; select the text and copy it manually."); } }}>Copy report for referee</button>
          ${e.status === "broken" && !cur.paid ? html`<button className="btn btn-sm btn-line" onClick=${() => update(n => { const x = n.contracts.find(y => y.id === cur.id); if (x) x.paid = Date.now(); })}>I paid the stake</button>` : null}
          ${e.status === "active" ? (confirmBreak ? html`<button className="btn btn-sm btn-danger" onClick=${() => { update(n => { const x = n.contracts.find(y => y.id === cur.id); if (x) x.brokenEarly = Date.now(); }); setConfirmBreak(false); }}>Yes, I'm breaking it. Stake owed.</button>` : html`<button className="btn btn-sm btn-line" onClick=${() => setConfirmBreak(true)}>Break contract</button>`) : null}</div>
        ${copied ? html`<p className="note" role="status">${copied}</p>` : null}
        <p className="note">LIFEFLIX can't take money or message anyone. Your referee enforces the stake; this page keeps the record honest.</p>
      </div>
    <//>`;
  }
  const valid = f.sessions > 0 && f.minutes > 0 && f.stake.trim() && f.sig.trim().length >= 2 && f.understand;
  return html`<div className="contract-doc">
    <span className="eyebrow">New contract · ${niceDate(ws)} – ${niceDate(addDays(ws, 6))}</span>
    ${lastWeek ? html`<p className="note">Last contract: ${contractEval(s, lastWeek, today).status}${contractEval(s, lastWeek, today).status === "broken" && !lastWeek.paid ? `, stake "${lastWeek.stake}" not yet paid` : ""}.</p>` : null}
    <div className="f-row">
      <label className="f" htmlFor="ct-s">Focus sessions this week<input id="ct-s" type="number" min="1" max="50" value=${f.sessions} onInput=${e => set("sessions", Number(e.target.value))}/></label>
      <label className="f" htmlFor="ct-m">Focused minutes this week<input id="ct-m" type="number" min="10" step="10" value=${f.minutes} onInput=${e => set("minutes", Number(e.target.value))}/></label>
    </div>
    <p className="note">Suggested from your recent pace, plus a stretch. ${coach === "brutal" ? "Set it so you'd be embarrassed to miss it, not so high that missing is guaranteed." : "Ambitious but realistic beats heroic. A kept small contract builds more than a broken big one."}</p>
    <label className="f" htmlFor="ct-must">One must-do (optional)<input id="ct-must" value=${f.must} onInput=${e => set("must", e.target.value)} placeholder="e.g. Submit one application for a Melbourne project engineer role"/></label>
    <label className="f" htmlFor="ct-stake">If I break it, I will…<input id="ct-stake" value=${f.stake} onInput=${e => set("stake", e.target.value)} placeholder="e.g. donate $50 to a charity I wouldn't choose / pay for my referee's dinner"/></label>
    <div className="chips">${["donate $50 to a cause I dislike", "pay for my referee's dinner", "give up streaming for a week", "do my referee's least favourite chore"].map(c => html`<button key=${c} onClick=${() => set("stake", c)}>${c}</button>`)}</div>
    <label className="f" htmlFor="ct-ref">Referee (someone who'll actually hold you to it)<input id="ct-ref" value=${f.referee} onInput=${e => set("referee", e.target.value)} placeholder="Name"/></label>
    <label className="f" htmlFor="ct-sig">Signature: type your full name<input id="ct-sig" value=${f.sig} onInput=${e => set("sig", e.target.value)} style=${{ fontFamily: "var(--display)", fontStyle: "italic", fontSize: "22px" }}/></label>
    <label style=${{ display: "flex", gap: "10px", alignItems: "flex-start", fontWeight: 600 }}><input id="ct-und" type="checkbox" style=${{ width: "20px", height: "20px", flex: "none" }} checked=${f.understand} onChange=${e => set("understand", e.target.checked)}/><span>I understand this contract can't be edited once signed. I'll send my referee the weekly report and pay the stake if I break it.</span></label>
    <div><button className="btn btn-amber" disabled=${!valid} onClick=${() => { update(n => { n.contracts.push({ id: uid(), ts: Date.now(), createdAt: Date.now(), week: ws, sessions: f.sessions, minutes: f.minutes, must: f.must.trim(), stake: f.stake.trim(), referee: f.referee.trim(), sig: f.sig.trim(), mustDone: false, paid: null }); }); flash("Contract signed", "Tell " + (f.referee || "your referee") + " today."); }}>Sign contract</button></div>
  </div>`;
}

/* =========================================================
   BOOT
   ========================================================= */
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>
