function Diagnose({ s, prio, coach, update, openBrief, tool }) {
  const act = activeMissions(s);
  const [mid, setMid] = useState((tool && tool.mid && act.some(x => x.id === tool.mid) && tool.mid) || (prio && prio.id) || (act[0] && act[0].id));
  const [f, setF] = useState({ E: 5, V: 5, I: 5, D: 5 });
  const m = s.missions.find(x => x.id === mid) || act[0];
  const M = (f.E * f.V) / (f.I * f.D);
  const pos = clamp((Math.log10(M) + 2) / 4, 0, 1);
  const prob = { E: 10 - f.E, V: 10 - f.V, I: f.I - 1, D: f.D - 1 };
  const weak = Object.entries(prob).sort((a, b) => b[1] - a[1])[0][0];
  const past = s.sessions.filter(x => x.outcome === "done").length;
  const FACT = [
    ["E", "Expectancy", "How confident am I that I can do this well?", "Not at all", "Certain"],
    ["V", "Value", "How rewarding or meaningful does it feel right now?", "Pointless", "Very"],
    ["I", "Impulsiveness", "How distractible am I right now?", "Calm", "Scattered"],
    ["D", "Delay", "How far away does the payoff or deadline feel?", "Today", "Months away"]
  ];
  const RX = {
    E: { name: "Low expectancy", fix: "You doubt you can do it, so your brain avoids a likely failure. Steel's remedy is a success spiral: a task so small you're certain to finish, plus evidence you've done hard things before.", ev: past ? `Evidence: you've completed ${past} mission${past === 1 ? "" : "s"} in LIFEFLIX, and delivered switchboard and switchroom projects for three years.` : "Evidence: three years of delivering switchboard and switchroom projects in Australia.", btn: "Start a 2-minute certain win", o: () => ({ minutes: 2, target: "Only the first visible step: " + (m.firstStep || "open it") }) },
    V: { name: "Low value", fix: "The task feels dull or pointless right now. Connect it to something you care about, turn it into a challenge, or bundle a temptation with it.", ev: s.values[ATTR_DOMAIN[m && m.attr]] && s.values[ATTR_DOMAIN[m.attr]].text ? `Your value: ${s.values[ATTR_DOMAIN[m.attr]].text}` : "Tip: fill in your values compass so every mission shows why it matters.", btn: "Start 10 minutes as a beat-the-clock challenge", o: () => ({ minutes: 10, target: "Beat the clock: " + (m.deliverable || "finish the first part") + " before the timer ends." }) },
    I: { name: "High impulsiveness", fix: "Distraction is winning. Don't rely on willpower; change the environment. Phone in another room, one tab open, and an if-then plan for the urge you know is coming.", ev: s.urges.length ? `You've fought ${s.urges.length} urges so far. Your most common: ${URGES[Object.entries(s.urges.reduce((a, u) => (a[u.urge] = (a[u.urge] || 0) + 1, a), {})).sort((a, b) => b[1] - a[1])[0][0]].label.toLowerCase()}.` : "Stimulus control beats willpower every time.", btn: "Start 25 minutes, phone out of the room", o: () => ({ minutes: 25, target: "Phone in another room, all other tabs closed. Then: " + (m.firstStep || "start") }) },
    D: { name: "Distant payoff", fix: "The reward feels too far away: a 2027 move, a future salary. Bring the deadline forward with one sub-goal due within the hour.", ev: weeklyGap(s) > 0 ? `Make it concrete: the salary gap to your target is about ${money(weeklyGap(s))} a week.` : "Short deadlines beat distant goals.", btn: "Start 10 minutes with a deadline", o: () => ({ minutes: 10, target: `Finish one sub-goal by ${clockIn(10)}: ` + (m.deliverable || m.title) }) }
  };
  const rx = RX[weak];
  if (!m) return html`<p className="dim">Add a mission first.</p>`;
  return html`<${React.Fragment}>
    <label className="f" htmlFor="dg-m">Which task are you avoiding?<${MissionPick} id="dg-m" s=${s} value=${mid} onChange=${setMid}/></label>
    <div className="panel">
      ${FACT.map(([k, n, q, lo, hi]) => html`<div key=${k} className="factor">
        <label htmlFor=${"dg-" + k} style=${{ fontWeight: 800 }}>${n}</label><span className="mono" style=${{ fontSize: "18px" }}>${f[k]}/10</span>
        <input id=${"dg-" + k} type="range" min="1" max="10" value=${f[k]} onInput=${e => { const v = Number(e.target.value); setF(x => Object.assign({}, x, { [k]: v })); }} style=${{ gridColumn: "1/-1" }}/>
        <span className="hint">${q} (1 = ${lo}, 10 = ${hi})</span></div>`)}
      <div><div className="eyebrow" style=${{ marginBottom: "8px" }}>Motivation = (Expectancy × Value) ÷ (Impulsiveness × Delay) = <span className="mono" style=${{ color: "var(--fg)" }}>${M.toFixed(2)}</span></div>
        <div className="meter" role="img" aria-label=${"Motivation score " + M.toFixed(2)}><i style=${{ left: pos * 100 + "%" }}></i></div>
        <div style=${{ display: "flex", justifyContent: "space-between" }} className="note"><span>Avoid</span><span>Neutral</span><span>Go</span></div></div>
    </div>
    <div className="rx">
      <span className="eyebrow" style=${{ color: "var(--tungsten)" }}>Weakest factor: ${rx.name}</span>
      <p style=${{ fontSize: "16px" }}>${rx.fix}</p>
      <p className="dim">${rx.ev}</p>
      ${coach === "brutal" ? html`<p style=${{ fontWeight: 700 }}>Diagnosis done. Don't turn this into another research project. Apply the fix now.</p>` : null}
      <div className="btn-row"><button className="btn btn-amber" onClick=${() => { update(n => { n.diag.push({ id: uid(), ts: Date.now(), mid: m.id, title: m.title, E: f.E, V: f.V, I: f.I, D: f.D, weak }); }); openBrief(m, rx.o()); }}>▶ ${rx.btn}</button>
        <button className="btn btn-line" onClick=${() => { update(n => { n.diag.push({ id: uid(), ts: Date.now(), mid: m.id, title: m.title, E: f.E, V: f.V, I: f.I, D: f.D, weak }); }); }}>Save without starting</button></div>
    </div>
  <//>`;
}

function Woop({ s, coach, update, flash }) {
  const blank = { wish: "", outcome: "", obstacle: "", ifs: "", then: "" };
  const [f, setF] = useState(blank); const [step, setStep] = useState(0);
  const set = (k, v) => setF(x => Object.assign({}, x, { [k]: v }));
  const STEPS = [
    ["wish", "Wish", "What do you want to achieve in the next 4 weeks? Challenging but realistic.", "e.g. Send three tailored applications for $140K+ roles"],
    ["outcome", "Outcome", "What's the best outcome of fulfilling it? Close your eyes and picture it for 30 seconds before writing.", "e.g. Interviews booked, a real salary number, Melbourne on my terms"],
    ["obstacle", "Obstacle", "What is it inside you that stops you? A feeling, a habit, a belief. Not 'no time'.", "e.g. When I sit down to tailor the CV I feel it isn't good enough and open YouTube"],
    ["plan", "Plan", "If that obstacle shows up, what exactly will you do?", ""]
  ];
  const ok = step < 3 ? f[STEPS[step][0]].trim() : f.ifs.trim() && f.then.trim();
  const save = () => { update(n => { n.woop.push(Object.assign({ id: uid(), ts: Date.now(), createdAt: Date.now(), active: true }, f)); }); setF(blank); setStep(0); flash("WOOP plan saved", "It will appear in mission briefings and urge fights."); };
  return html`<${React.Fragment}>
    <div className="panel">
      <div className="steps">${STEPS.map((x, i) => html`<i key=${i} className=${i <= step ? "on" : ""}></i>`)}</div>
      <span className="eyebrow">${STEPS[step][1]} · step ${step + 1} of 4</span>
      <p style=${{ fontSize: "16px" }}>${STEPS[step][2]}</p>
      ${step === 0 ? html`<div className="chips">${["Send 3 tailored applications this month", "Finish P6 fundamentals by January", "Get my first business customer", "Automate savings this payday"].map(c => html`<button key=${c} onClick=${() => set("wish", c)}>${c}</button>`)}</div>` : null}
      ${step < 3 ? html`<textarea id=${"woop-" + STEPS[step][0]} value=${f[STEPS[step][0]]} onInput=${e => set(STEPS[step][0], e.target.value)} placeholder=${STEPS[step][3]} aria-label=${STEPS[step][1]}></textarea>` : html`<${React.Fragment}>
        <label className="f" htmlFor="woop-if">If…<input id="woop-if" value=${f.ifs} onInput=${e => set("ifs", e.target.value)} placeholder=${f.obstacle ? f.obstacle.slice(0, 80) : "I feel the urge to open YouTube while editing my CV"}/></label>
        <label className="f" htmlFor="woop-then">…then I will<input id="woop-then" value=${f.then} onInput=${e => set("then", e.target.value)} placeholder="write the ugliest first draft for 2 minutes before deciding anything"/></label>
      <//>`}
      <div className="btn-row">${step > 0 ? html`<button className="btn btn-line btn-sm" onClick=${() => setStep(step - 1)}>Back</button>` : null}
        ${step < 3 ? html`<button className="btn btn-amber btn-sm" disabled=${!ok} onClick=${() => setStep(step + 1)}>Next</button>` : html`<button className="btn btn-amber btn-sm" disabled=${!ok} onClick=${save}>Save plan</button>`}</div>
    </div>
    ${s.woop.length ? html`<div className="panel"><h3>Your plans</h3><ul className="list">${s.woop.slice().reverse().map(w => html`<li key=${w.id} style=${{ flexDirection: "column", alignItems: "stretch", opacity: w.active ? 1 : .55 }}>
      <div><b>${w.wish}</b></div><div className="dim">If ${w.ifs}, then ${w.then}.</div>
      <div className="btn-row"><button className="btn btn-sm btn-line" onClick=${() => update(n => { const x = n.woop.find(y => y.id === w.id); if (x) x.active = !x.active; })}>${w.active ? "Pause" : "Activate"}</button><button className="btn btn-sm btn-line" style=${{ color: "var(--bad)" }} onClick=${() => update(n => { n.woop = n.woop.filter(y => y.id !== w.id); n.tomb.push(w.id); })}>Delete</button></div></li>`)}</ul></div>` : null}
  <//>`;
}

function ThoughtRecord({ s, prio, coach, update, openBrief, flash }) {
  const act = activeMissions(s);
  const [f, setF] = useState({ mid: prio ? prio.id : (act[0] && act[0].id), thought: "", emotion: "Anxious", before: 7, distortions: [], against: "", answer: "", after: 5 });
  const [saved, setSaved] = useState(false);

  return html`<div className="panel" style=${{ gap: "16px" }}>
    <label className="f" htmlFor="tr-m">1. The task you're avoiding<${MissionPick} id="tr-m" s=${s} value=${f.mid} onChange=${v => set("mid", v)}/></label>

      <label className="f" htmlFor="tr-b">Strength <span className="mono" style=${{ color: "var(--fg)" }}>${f.before}/10</span><input id="tr-b" type="range" min="0" max="10" value=${f.before} onInput=${e => set("before", Number(e.target.value))}/></label>
    </div>
    <div><div className="eyebrow" style=${{ marginBottom: "8px" }}>4. Which thinking traps are in it?</div>
      <div className="dchips">${DISTORTIONS.map(([k, n, ex]) => html`<button key=${k} aria-pressed=${f.distortions.includes(k)} onClick=${() => tog(k)}>${n}<small>${ex}</small></button>`)}</div></div>
    <label className="f" htmlFor="tr-a">5. Evidence against the thought<textarea id="tr-a" value=${f.against} onInput=${e => set("against", e.target.value)} placeholder="What would you tell a colleague who said this? What facts don't fit?"></textarea></label>
    <label className="f" htmlFor="tr-o">6. Task-oriented answer (TOC)<textarea id="tr-o" value=${f.answer} onInput=${e => set("answer", e.target.value)} placeholder="e.g. 'Plenty of $140K roles don't list P6. I can apply now and learn P6 in parallel.'"></textarea></label>
    <label className="f" htmlFor="tr-af">7. Strength of the feeling now <span className="mono" style=${{ color: "var(--fg)" }}>${f.after}/10</span><input id="tr-af" type="range" min="0" max="10" value=${f.after} onInput=${e => set("after", Number(e.target.value))}/></label>
    <div className="btn-row">
      <button className="btn btn-amber" disabled=${!valid || !m} onClick=${() => { if (!saved) update(n => { n.thoughts.push(Object.assign({ id: uid(), ts: Date.now(), kind: "record", title: m ? m.title : "" }, f)); }); setSaved(true); openBrief(m, { minutes: 2, target: f.answer.slice(0, 120) }); }}>▶ Save and act: 2 minutes</button>
      <button className="btn btn-line" disabled=${!valid || saved} onClick=${() => { update(n => { n.thoughts.push(Object.assign({ id: uid(), ts: Date.now(), kind: "record", title: m ? m.title : "" }, f)); }); setSaved(true); flash("Thought record saved", ""); }}>${saved ? "Saved" : "Save only"}</button>
    </div>
    <p className="note">${coach === "brutal" ? "A thought record you don't act on is just journaling. The 2-minute button is the point." : "You don't need to fully believe the new answer. Acting on it is what makes it believable."}</p>
  </div>`;
}

function Defuse({ s, prio, coach, update, openBrief, tool }) {
  const [t, setT] = useState((tool && tool.text) || ""); const [stage, setStage] = useState(0); const [leafKey, setLeafKey] = useState(0);
  const [hookB, setHookB] = useState(7); const [hookA, setHookA] = useState(5);
  const clean = t.trim().replace(/^i('m| am) having the thought that\s*/i, "").replace(/[.!]+$/, "");
  return html`<div className="panel" style=${{ gap: "16px" }}>
    ${stage === 0 ? html`<${React.Fragment}>
      <label className="f" htmlFor="df-t">Write the sticky thought<input id="df-t" value=${t} onInput=${e => setT(e.target.value)} placeholder="I'm going to fail at this"/></label>
      <label className="f" htmlFor="df-hb">How much does it hook you? <span className="mono" style=${{ color: "var(--fg)" }}>${hookB}/10</span><input id="df-hb" type="range" min="0" max="10" value=${hookB} onInput=${e => setHookB(Number(e.target.value))}/></label>
      <div><button className="btn btn-amber" disabled=${!clean} onClick=${() => setStage(1)}>Unhook</button></div>
    <//>` : null}
    ${stage >= 1 ? html`<${React.Fragment}>
      <p style=${{ fontSize: "19px", fontWeight: 800 }}>${clean}.</p>
      <p style=${{ fontSize: "17px" }} className="dim">I'm having the thought that ${clean.charAt(0).toLowerCase() + clean.slice(1)}.</p>
      <p style=${{ fontSize: "16px" }} className="faint">I notice I'm having the thought that ${clean.charAt(0).toLowerCase() + clean.slice(1)}.</p>
      <div className="stream" aria-hidden="true"><div className="leaf" key=${leafKey} style=${{ top: "40%" }}>${clean}</div></div>

function Checkup({ s, update, setOv, openCalm }) {
  const [kind, setKind] = useState(null); const [ans, setAns] = useState([]); const [res, setRes] = useState(null);
  const Q = kind === "gad7" ? GAD7 : PHQ9;
  const start = k => { setKind(k); setAns(Array((k === "gad7" ? GAD7 : PHQ9).length).fill(null)); setRes(null); try { window.scrollTo(0, 0); } catch (e) {} };
  const hist = k => (s.screens || []).filter(x => x.kind === k).sort((a, b) => a.ts - b.ts);
  const all = ans.length > 0 && ans.every(a => a != null);
  const score = ans.reduce((a, b) => a + (b || 0), 0);
  if (res) {
    const k = res.kind, sc = res.score, risk = k === "phq9" && res.answers[8] > 0;
    const prev = hist(k).filter(x => x.id !== res.id).pop();
    return html`<${React.Fragment}>
      ${risk ? html`<div className="rx" style=${{ borderColor: "rgba(255,123,123,.6)", background: "linear-gradient(120deg,rgba(255,123,123,.14),var(--ink-2) 70%)" }}>
        <b style=${{ fontSize: "17px" }}>You said you've had thoughts of being better off dead or of hurting yourself.</b>
        <p>Please don't carry that alone. Talk to someone today: call Lifeline on <b className="mono">13 11 14</b> (24/7), text <b className="mono">0477 13 11 14</b>, or call <b className="mono">000</b> if you're in danger. Your GP can help too.</p>
        <div><button className="btn btn-calm btn-sm" onClick=${() => setOv({ type: "help" })}>Show support lines</button></div>
      </div>` : null}
      <div className="panel">
        <span className="eyebrow">${k === "gad7" ? "GAD-7 · anxiety" : "PHQ-9 · mood"} · ${niceDate(dayKey(new Date(res.ts)))}</span>
        <div style=${{ display: "flex", gap: "14px", alignItems: "baseline", flexWrap: "wrap" }}><div className="big-num">${sc}</div><div style=${{ fontWeight: 800, fontSize: "20px" }}>${screenBand(k, sc)}</div><span className="note">out of ${k === "gad7" ? 21 : 27}</span></div>
        ${prev ? html`<p className="dim">Last time: ${prev.score} (${screenBand(k, prev.score).toLowerCase()}) on ${niceDate(dayKey(new Date(prev.ts)))}. ${sc < prev.score ? "Lower is better: that's an improvement." : sc > prev.score ? "That's higher than last time." : "About the same."}</p>` : null}
        <p>${screenGuide(sc)}</p>
        <p className="note">A screening questionnaire, not a diagnosis. Next check-up: ${niceDate(dayKey(new Date(res.ts + 14 * 86400000)))}.</p>
        <div><button className="btn btn-line btn-sm" onClick=${() => { setRes(null); setKind(null); }}>Done</button></div>
      </div>
    <//>`;
  }
  if (kind) return html`<div className="panel" style=${{ gap: "18px" }}>
    <span className="eyebrow">${kind === "gad7" ? "GAD-7" : "PHQ-9"} · Over the last 2 weeks, how often have you been bothered by the following?</span>
    ${Q.map((q, i) => html`<div key=${i} style=${{ display: "grid", gap: "8px" }}>
      <div style=${{ fontWeight: 700 }}>${i + 1}. ${q}</div>
      <div className="seg" role="group" aria-label=${q}>${FREQ.map((fq, v) => html`<button key=${v} aria-pressed=${ans[i] === v} onClick=${() => setAns(ans.map((x, j) => j === i ? v : x))} style=${{ fontFamily: "var(--body)" }}>${fq}</button>`)}</div>
    </div>`)}
    <div className="btn-row"><button className="btn btn-calm" disabled=${!all} onClick=${() => { const r = { id: uid(), ts: Date.now(), kind, answers: ans.slice(), score }; update(n => { n.screens.push(r); }); setRes(r); try { window.scrollTo(0, 0); } catch (e) {} }}>See my score</button><button className="btn btn-line" onClick=${() => setKind(null)}>Cancel</button></div>
    ${!all ? html`<p className="note">${ans.filter(a => a != null).length} of ${Q.length} answered.</p>` : null}
  </div>`;
  return html`<${React.Fragment}>
    <div className="grid-2">${[["gad7", "Anxiety", "GAD-7 · 7 questions"], ["phq9", "Mood", "PHQ-9 · 9 questions"]].map(([k, l, sub]) => {
      const h = hist(k), last = h[h.length - 1], due = !last || Date.now() - last.ts >= 13 * 86400000;
      return html`<div key=${k} className="panel"><span className="eyebrow">${sub}</span><h3>${l}</h3>
        ${last ? html`<p><b className="mono" style=${{ fontSize: "22px" }}>${last.score}</b> · ${screenBand(k, last.score)} · ${niceDate(dayKey(new Date(last.ts)))}</p>` : html`<p className="dim">Not taken yet.</p>`}
        ${h.length > 1 ? html`<p className="note">History: ${h.slice(-6).map(x => x.score).join(" → ")}</p>` : null}
        <div className="btn-row" style=${{ alignItems: "center" }}><button className=${"btn btn-sm " + (due ? "btn-calm" : "btn-line")} onClick=${() => start(k)}>${due ? "Take it now" : "Retake"}</button>${!due ? html`<span className="note">Next due ${niceDate(dayKey(new Date(last.ts + 14 * 86400000)))}</span>` : null}</div>
      </div>`; })}</div>
    <div className="panel"><span className="eyebrow">ASRS-V1.1 screener · 6 questions</span><h3>ADHD</h3>
      ${(() => { const x = s.screens.filter(y => y.kind === "asrs").sort((a, b) => a.ts - b.ts).pop(); return x ? html`<p><b className="mono" style=${{ fontSize: "22px" }}>${x.shaded}/6</b> · ${x.shaded >= 4 ? "Screens positive" : "Below the screening threshold"} · ${niceDate(dayKey(new Date(x.ts)))}</p>` : html`<p className="dim">Not taken yet. Asks about the past 6 months, so once is enough for now.</p>`; })()}
      <div><button className="btn btn-sm btn-calm" onClick=${() => openCalm("asrs")}>${s.screens.some(y => y.kind === "asrs") ? "View or retake" : "Take it now"}</button></div></div>

  <//>`;
}

      <div className="steps">${COMPASSION.map((_, i) => html`<i key=${i} className=${i <= cs ? "on" : ""}></i>`)}</div>

    </div>`;

      <label className="f" htmlFor="oa-e">The emotion<input id="oa-e" value=${opp.emo} onInput=${e => setOpp(Object.assign({}, opp, { emo: e.target.value }))} placeholder="e.g. Flat"/></label>
      <label className="f" htmlFor="oa-u">What it's pushing you to do<input id="oa-u" value=${opp.urge} onInput=${e => setOpp(Object.assign({}, opp, { urge: e.target.value }))} placeholder="e.g. Stay on the couch, cancel plans, scroll"/></label>

      <p className="note">When you're low, a voice call beats a text, and a text beats nothing.</p>
    <//>`;
  else if (kind === "bestself") kindUI = html`<${React.Fragment}>
      <label className="f" htmlFor="bp-v">It's late 2029. Things have gone about as well as they realistically could. Describe an ordinary Tuesday: work, home, money, people.<textarea id="bp-v" value=${bps.vision} onInput=${e => setBps(Object.assign({}, bps, { vision: e.target.value }))} style=${{ minHeight: "150px" }}></textarea></label>

/* ---------- patterns ---------- */
function MoodScatter({ moods }) {

  const lbl = { fontSize: "9px", fontFamily: "var(--mono)", fontWeight: 700, letterSpacing: ".06em" };
  return html`<svg viewBox="0 0 240 240" width="100%" style=${{ maxWidth: "280px", display: "block", margin: "0 auto" }} role="img" aria-label=${"Mood meter showing " + moods.length + " recent check-ins"}>
    <rect x="0" y="0" width="120" height="120" style=${{ fill: "#ff7b7b", opacity: 0.16 }}/>
    <rect x="120" y="0" width="120" height="120" style=${{ fill: "#ffcf3d", opacity: 0.14 }}/>
    <rect x="0" y="120" width="120" height="120" style=${{ fill: "#4cc3ff", opacity: 0.14 }}/>
    <rect x="120" y="120" width="120" height="120" style=${{ fill: "#47d18c", opacity: 0.14 }}/>
    <line x1="120" y1="0" x2="120" y2="240" style=${{ stroke: "rgba(255,255,255,.22)" }}/>
    <line x1="0" y1="120" x2="240" y2="120" style=${{ stroke: "rgba(255,255,255,.22)" }}/>
    <text x="6" y="14" style=${Object.assign({ fill: "#ff9b9b" }, lbl)}>STRESSED</text>
    <text x="234" y="14" textAnchor="end" style=${Object.assign({ fill: "#ffdb70" }, lbl)}>ENERGISED</text>
    <text x="6" y="233" style=${Object.assign({ fill: "#7fd3ff" }, lbl)}>LOW</text>
    <text x="234" y="233" textAnchor="end" style=${Object.assign({ fill: "#7fe0ae" }, lbl)}>CALM</text>
    ${moods.map((m, i) => { const last = i === moods.length - 1; const jx = (hashStr(m.id) - 0.5) * 8, jy = (hashStr(m.id + "y") - 0.5) * 8; return html`<circle key=${m.id} cx=${X(m.p) + jx} cy=${Y(m.e) + jy} r=${last ? 7 : 4.5} style=${{ fill: "#f4efe7", opacity: 0.25 + 0.75 * (i + 1) / moods.length, stroke: last ? "#5fe0a0" : "none", strokeWidth: 2 }}/>`; })}
  </svg>`;
}
function MoodPatterns({ s }) {
  const moods = (s.moods || []).slice().sort((a, b) => a.ts - b.ts);
  if (!moods.length) return html`<p className="dim">Check in a few times and your patterns appear here: where your mood usually sits, what lifts it, and how sleep and focus affect it.</p>`;
  const recent = moods.filter(m => Date.now() - m.ts < 14 * 86400000);
  const st = liftStats(s);
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  const dayP = {}; moods.forEach(m => { const k = dayKey(new Date(m.ts)); (dayP[k] = dayP[k] || []).push(m.p); });
  const sl = moods.filter(m => m.sleep != null), lo = sl.filter(m => m.sleep < 7), hi = sl.filter(m => m.sleep >= 7);
  const focusDay = k => Math.round(s.sessions.filter(x => x.day === k && productive(x)).reduce((a, x) => a + x.actual, 0) / 60);
  const days = Object.keys(dayP), fHi = days.filter(k => focusDay(k) >= 25), fLo = days.filter(k => focusDay(k) < 25);
  const tagC = {}; moods.filter(m => m.p < 0).forEach(m => (m.tags || []).forEach(t => { if (t !== "Nothing specific") tagC[t] = (tagC[t] || 0) + 1; }));
  const tags = Object.entries(tagC).sort((a, b) => b[1] - a[1]).slice(0, 4);
  const bars = (arr, color) => { const mx = Math.max(1, ...arr.map(o => o.avg)); return html`<div className="bars">${arr.slice(0, 5).map(o => html`<div key=${o.kind} className="bar-row"><span>${o.label}</span><div className="track"><i style=${{ width: clamp(o.avg / mx, 0, 1) * 100 + "%", background: color }}></i></div><span className="n">${sign(o.avg)}</span></div>`)}</div>`; };
  return html`<div className="grid-2">
    <div className="panel"><h3>Last 14 days</h3><${MoodScatter} moods=${recent.length ? recent : moods.slice(-10)}/>
      <p className="note">${recent.length} check-in${recent.length === 1 ? "" : "s"} in the last two weeks. Brighter dots are more recent.</p></div>
    <div className="panel"><h3>What works for you</h3>
      ${st.mood.length || st.calm.length ? html`<${React.Fragment}>
        ${st.mood.length ? html`<div><div className="eyebrow" style=${{ marginBottom: "8px" }}>Lifts your mood (points, 1–10 scale)</div>${bars(st.mood, "var(--calm)")}</div>` : null}
        ${st.calm.length ? html`<div><div className="eyebrow" style=${{ marginBottom: "8px" }}>Calms you down (anxiety points dropped)</div>${bars(st.calm, "var(--s2)")}</div>` : null}
        <p className="note">Averages of your own before-and-after ratings. A few tries aren't proof; the picture firms up over weeks.</p>
      <//>` : html`<p className="dim">Rate before and after any lifter or rescue tool. Your personal ranking of what actually works appears here.</p>`}
      ${lo.length >= 2 && hi.length >= 2 ? html`<p><b>Sleep:</b> after under 7 hours, your mood averaged ${sign(avg(lo.map(m => m.p)))}; after 7+ hours, ${sign(avg(hi.map(m => m.p)))}. <span className="note">(Scale −5 to +5; ${lo.length} vs ${hi.length} check-ins.)</span></p>` : null}
      ${fHi.length >= 2 && fLo.length >= 2 ? html`<p><b>Focus:</b> on days with 25+ focused minutes, your mood averaged ${sign(avg(fHi.map(k => avg(dayP[k]))))}; on other days, ${sign(avg(fLo.map(k => avg(dayP[k]))))}. <span className="note">(${fHi.length} vs ${fLo.length} days.)</span></p>` : null}
      ${tags.length ? html`<p><b>Most common drivers of unpleasant moods:</b> ${tags.map(([t, n]) => t + " (" + n + ")").join(", ")}.</p>` : null}
    </div>
  </div>`;
}
function MoodWeek({ s, ws, we }) {
  const inW = ts => { const k = dayKey(new Date(ts)); return k >= ws && k <= we; };
  const moods = (s.moods || []).filter(m => inW(m.ts)), lifts = (s.lifts || []).filter(x => inW(x.ts)), scr = (s.screens || []).filter(x => inW(x.ts));
  if (!moods.length && !lifts.length && !scr.length) return null;
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  const words = {}; moods.forEach(m => { if (m.word) words[m.word] = (words[m.word] || 0) + 1; });

    ${topW.length ? html`<p>Most named: ${topW.map(([w, n]) => w + " (" + n + ")").join(", ")}.</p>` : null}

  const f = x => x.getFullYear() + pad(x.getMonth() + 1) + pad(x.getDate()) + "T" + pad(x.getHours()) + pad(x.getMinutes()) + "00";
  const end = new Date(d.getTime() + minutes * 60000), now = new Date();
  const stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + "T" + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + "Z";

  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//LIFEFLIX//EN", "CALSCALE:GREGORIAN", "BEGIN:VEVENT", "UID:" + uid() + "@lifeflix", "DTSTAMP:" + stamp, "DTSTART:" + f(d), "DTEND:" + f(end), "RRULE:FREQ=WEEKLY;BYDAY=" + days.map(x => by[x]).join(","), "SUMMARY:" + esc(title), "DESCRIPTION:" + esc(desc)];
  if (url) L.push("URL:" + url);
  L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + esc(title + " in 15 minutes"), "TRIGGER:-PT15M", "END:VALARM", "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + esc(title + ": start now"), "TRIGGER:PT0M", "END:VALARM", "END:VEVENT", "END:VCALENDAR");
  return L.join("\r\n") + "\r\n";
}
async function saveIcs(downloads, filename, text, setMsg) {
  if (!text) { setMsg("Pick at least one day first."); return; }
  if (!downloads) { setMsg("Calendar files can't be saved in this view. Open LIFEFLIX in a browser on your computer and try again, then send the file to your phone."); return; }
  try { await downloads.save({ filename, data: text }); setMsg("Saved. Open the file to add the repeating event, with alerts 15 minutes before and at the start."); }
  catch (e) { setMsg("Not saved" + (e && e.code ? " (" + e.code + ")" : "") + "."); }
}

function ProgramStatus({ s, k }) {
  const P = s.programs[k], sess = progSessions(s, k), ws = weekStartKey(dayKey());
  const wk = sess.filter(x => x.day >= ws).length, mins = Math.round(sess.reduce((a, x) => a + x.actual, 0) / 60);
  const weeks = []; for (let i = 3; i >= 0; i--) { const a = addDays(ws, -7 * i), b = addDays(a, 6); weeks.push({ a, n: sess.filter(x => x.day >= a && x.day <= b).length }); }
  return html`<div className="grid-3" style=${{ gridTemplateColumns: "repeat(auto-fit,minmax(130px,1fr))" }}>
    <div className="stat"><div className="k">This week</div><div className="v">${wk}/${P.days.length}</div></div>
    <div className="stat"><div className="k">Total</div><div className="v">${sess.length}</div></div>
    <div className="stat"><div className="k">Time</div><div className="v">${fmtMin(mins)}</div></div>
    <div className="stat"><div className="k">Last 4 weeks</div><div className="v mono" style=${{ fontSize: "18px" }}>${weeks.map(w => w.n).join(" · ")}</div></div>

}

  if (mode === "q") return html`<div className="panel" style=${{ gap: "18px" }}>
    <span className="eyebrow">Check the answer that best describes how you have felt and conducted yourself over the past 6 months.</span>
    ${ASRS_Q.map((q, i) => html`<div key=${i} style=${{ display: "grid", gap: "8px" }}><div style=${{ fontWeight: 700 }}>${i + 1}. ${q}</div>
      <div className="seg" role="group" aria-label=${q}>${ASRS_OPT.map((o, v) => html`<button key=${v} aria-pressed=${ans[i] === v} onClick=${() => setAns(ans.map((x, j) => j === i ? v : x))} style=${{ fontFamily: "var(--body)" }}>${o}</button>`)}</div></div>`)}
    <hr className="sep"/>
    <span className="eyebrow">Two extra questions for your GP (not part of the ASRS)</span>
    <div style=${{ display: "grid", gap: "8px" }}><div style=${{ fontWeight: 700 }}>Were problems like these noticeable before age 12? (school reports, what family remembers)</div>
      <div className="seg" role="group" aria-label="Before age 12">${["Yes", "No", "Not sure"].map(o => html`<button key=${o} aria-pressed=${child === o} onClick=${() => setChild(o)} style=${{ fontFamily: "var(--body)" }}>${o}</button>`)}</div></div>
    <div style=${{ display: "grid", gap: "8px" }}><div style=${{ fontWeight: 700 }}>Where do they cause real problems? (pick all that apply)</div>
      <div className="chips">${ASRS_AREAS.map(a => html`<button key=${a} aria-pressed=${areas.includes(a)} style=${areas.includes(a) ? { borderColor: "var(--tungsten)", background: "rgba(255,176,74,.12)" } : null} onClick=${() => setAreas(areas.includes(a) ? areas.filter(x => x !== a) : areas.concat([a]))}>${a}</button>`)}</div></div>
    <div className="btn-row"><button className="btn btn-amber" disabled=${!all} onClick=${submit}>See my result</button><button className="btn btn-line" onClick=${() => setMode(hist.length ? "result" : "intro")}>Cancel</button></div>
    ${!all ? html`<p className="note">${ans.filter(a => a != null).length} of 6 answered.</p>` : null}
  </div>`;
  const r = res; if (!r) return null;
  const pos = r.shaded >= 4;
  const band = r.total >= 18 ? "highest band (18–24)" : r.total >= 14 ? "at or above the proposed cutpoint (14+)" : r.total >= 10 ? "below the cutpoint (10–13)" : "lowest band (0–9)";
  const txt = summary(r);
  return html`<${React.Fragment}>
    <div className=${"panel" + (pos ? "" : "")} style=${{ gap: "12px" }}>
      <span className="eyebrow">ASRS-V1.1 screener · ${niceDate(dayKey(new Date(r.ts)))}</span>
      <div style=${{ display: "flex", gap: "14px", alignItems: "baseline", flexWrap: "wrap" }}><div className="big-num">${r.shaded}/6</div><div style=${{ fontWeight: 800, fontSize: "20px", color: pos ? "var(--tungsten)" : "var(--fg)" }}>${pos ? "Screens positive" : "Below the screening threshold"}</div></div>
      <p style=${{ fontSize: "16px" }}>${pos ? "Your answers are consistent with adult ADHD symptoms. It's worth talking to a healthcare provider about a proper evaluation." : "Your answers are below the screener's threshold. That doesn't rule ADHD out, since screeners miss some people. If these problems are seriously affecting your work or life, it's still worth raising with a GP."}</p>
      <p className="note">How it's scored: questions 1–3 count if you answered Sometimes or more often; questions 4–6 count at Often or more often. Four or more counting answers is a positive screen. Your total on the 2024 Harvard scoring update (0–24) is ${r.total}, ${band}; that update was proposed mainly for research and prevalence studies.</p>
      ${r.child || (r.areas && r.areas.length) ? html`<p className="dim">${r.child ? "Before age 12: " + r.child.toLowerCase() + ". " : ""}${r.areas && r.areas.length ? "Affects: " + r.areas.join(", ").toLowerCase() + "." : ""} A diagnosis needs symptoms from childhood that cause problems in more than one area of life, so these answers matter to the assessor.</p>` : null}
    </div>
    <div className="panel" style=${{ gap: "10px" }}>
      <h3>Next steps in Australia</h3>
      <ol style=${{ margin: 0, paddingLeft: "20px", display: "grid", gap: "8px" }}>
        <li>Book a GP appointment and say you'd like to be assessed for adult ADHD. Ask for a longer appointment if you can.</li>
        <li>Bring the summary below, and any old school reports. Assessors often ask about childhood.</li>
        <li>The GP can refer you to a psychiatrist for assessment. Waiting times and costs vary a lot, so ask your GP about options and expected costs.</li>
        <li>Anxiety, low mood and poor sleep can look like ADHD or sit alongside it. Your GAD-7 and PHQ-9 check-ups in the Green Room help the GP see the full picture.</li>
      </ol>
      <textarea id="asrs-summary" readOnly value=${txt} style=${{ minHeight: "150px", fontFamily: "var(--mono)", fontSize: "11.5px" }} aria-label="Summary for your GP"></textarea>
      <div className="btn-row" style=${{ alignItems: "center" }}><button className="btn btn-sm btn-amber" onClick=${() => copy(txt)}>Copy summary for my GP</button><button className="btn btn-sm btn-line" onClick=${() => { setAns(Array(6).fill(null)); setChild(null); setAreas([]); setMode("q"); }}>Retake</button></div>
      ${copied ? html`<p className="note" role="status">${copied}</p>` : null}
      ${hist.length > 1 ? html`<p className="note">History: ${hist.map(x => x.shaded + "/6").join(" → ")}</p>` : null}
    </div>
    ${attrib}
  <//>`;
}

function Barkley({ goTool, goCalm }) {
  const R = [
    ["Stop the action", "Put a pause between the impulse and the action. Even five seconds lets the thinking part of your brain catch up.", ["STOP pause", () => goTool("stop")]],
    ["See the past, then the future", "Before starting, picture how this went last time, then picture how you want it to go this time.", ["WOOP plan", () => goTool("woop")]],
    ["Say the past, then the future", "Talk yourself through it out loud: \"Last time I opened YouTube first. This time: open the file, write the heading.\" Self-talk guides behaviour.", null],
    ["Externalise key information", "Your working memory leaks, so don't trust it. Plans, reminders and cues go where you'll see them at the moment you need them.", ["Gym calendar alerts", () => goTool("gym")]],
    ["Feel the future", "Distant rewards don't register for an ADHD brain. Bring a reward close: something good straight after the work.", ["Screen-time bank", () => goTool("bank")]],
    ["Break it down and make it matter", "Cut tasks into small chunks with frequent wins, and link each one to something you care about.", ["Values compass", () => goTool("values")]],
    ["Make problems external, physical and manual", "Don't solve problems in your head. Write them, list them, sort them on paper or screen.", ["Worry sorter", () => goCalm("sorter")]],
    ["Have a sense of humour", "You'll slip. Laugh at it, then restart. Beating yourself up drains the energy you need to try again.", ["Slip recovery", () => goTool("slip")]]
  ];
  return html`<${React.Fragment}>
    <div className="rx"><p className="quote">"ADHD is not a problem of knowing what to do. It's a problem of doing what you know."</p><p className="note">Paraphrasing Russell Barkley. The fix is to stop relying on willpower inside your head, and change the world around the task instead.</p></div>
    <div style=${{ display: "grid", gap: "10px" }}>${R.map(([t, d, a], i) => html`<div key=${i} className="rule"><span className="n">${i + 1}</span><b style=${{ fontSize: "16px" }}>${t}</b><span className="dim">${d}</span>${a ? html`<div><button className="btn btn-sm btn-line" onClick=${a[1]}>${a[0]} ›</button></div>` : html`<span></span>`}</div>`)}</div>
    <p className="note">Rule names follow Barkley's eight rules in <i>Taking Charge of Adult ADHD</i> (Guilford, 2010); the descriptions are summaries.</p>
  <//>`;
}

function AttentionSpan({ s, update, flash }) {
  const [task, setTask] = useState(""); const [run, setRun] = useState(false); const [t0, setT0] = useState(0); const [now, setNow] = useState(Date.now());
  const [runs, setRuns] = useState([]);
  useEffect(() => { if (!run) return; const iv = setInterval(() => setNow(Date.now()), 500); return () => clearInterval(iv); }, [run]);
  const el = run ? Math.round((now - t0) / 1000) : 0;
  const drift = () => { const sec = Math.max(10, Math.round((Date.now() - t0) / 1000)); setRun(false); setRuns(runs.concat([sec])); update(n => { n.spans.push({ id: uid(), ts: Date.now(), sec, task: task.trim() }); }); };
  const cur = spanMin(s);
  return html`<${React.Fragment}>
    ${cur ? html`<div className="rx"><span className="eyebrow" style=${{ color: "var(--tungsten)" }}>Your current attention span on dull tasks</span><div className="big-num">~${cur} min</div><p>Work in ${cur}-minute chunks with a one-minute stretch between them. Mission briefings will remind you if a mission is much longer than this. Over weeks, nudge it up a minute or two.</p></div>` : null}
    <div className="panel" style=${{ gap: "12px" }}>
      <p style=${{ fontSize: "16px" }}>Pick a real, boring task (admin, a CV edit, reading a standard). Start the clock and work normally. The moment you notice your mind has wandered or you've switched to something else, tap <b>I drifted</b>. Do this three times over the next few days.</p>
      <label className="f" htmlFor="sp-task">The task<input id="sp-task" value=${task} onInput=${e => setTask(e.target.value)} placeholder="e.g. Reading the commissioning ITP"/></label>
      ${run ? html`<div style=${{ textAlign: "center", display: "grid", gap: "10px" }}><div className="player-time" style=${{ fontSize: "56px" }}>${fmtClock(el)}</div><div><button className="btn btn-danger" onClick=${drift}>I drifted</button></div><p className="note">Phone face down. Don't watch this clock; work.</p></div>`
        : html`<div><button className="btn btn-amber" disabled=${!task.trim()} onClick=${() => { setT0(Date.now()); setNow(Date.now()); setRun(true); }}>▶ Start the clock</button></div>`}
      ${runs.length ? html`<p className="note">This session: ${runs.map(x => fmtClock(x)).join(", ")}.</p>` : null}
    </div>
    ${s.spans.length ? html`<div className="panel"><h3>History</h3><ul className="list">${s.spans.slice(-8).reverse().map(x => html`<li key=${x.id}><span>${x.task || "Task"}</span><span>${fmtClock(x.sec)} · ${niceDate(dayKey(new Date(x.ts)))}</span></li>`)}</ul></div>` : null}
  <//>`;
}

function ScreenBank({ s, coach, update, startBreak, flash }) {
  const B = s.programs.bank, bal = bankBalance(s);
  const [what, setWhat] = useState("YouTube"); const [debit, setDebit] = useState(15);
  if (!B.on) return html`<div className="panel" style=${{ gap: "14px" }}>
    <p style=${{ fontSize: "16px" }}>Every focused minute earns entertainment minutes. Spend them guilt-free on YouTube, games or scrolling. Run out, and you earn more the same way.</p>
    <div><div className="eyebrow" style=${{ marginBottom: "8px" }}>Exchange rate</div><div className="seg" role="group" aria-label="Exchange rate">${[[0.25, "1 : 4"], [0.5, "1 : 2"], [1, "1 : 1"]].map(([r, l]) => html`<button key=${r} aria-pressed=${B.rate === r} onClick=${() => update(n => { n.programs.bank.rate = r; })}>${l}</button>`)}</div><p className="note" style=${{ marginTop: "6px" }}>At 1 : 2, a 25-minute session earns about 12 minutes of entertainment. Start generous; tighten later.</p></div>
    <div><button className="btn btn-amber" onClick=${() => { update(n => { n.programs.bank.on = true; n.programs.bank.start = Date.now(); }); flash("Screen bank open", "Focused minutes from now on earn entertainment time."); }}>Open my screen bank</button></div>
  </div>`;
  const recent = s.spends.filter(x => x.ts >= B.start).slice(-6).reverse();
  return html`<${React.Fragment}>
    <div className="rx"><span className="eyebrow" style=${{ color: "var(--tungsten)" }}>Balance</span><div className="big-num" style=${{ color: bal < 0 ? "var(--bad)" : "var(--fg)" }}>${bal} min</div><p className="dim">Rate ${B.rate === 1 ? "1 : 1" : B.rate === 0.5 ? "1 : 2" : "1 : 4"}. Earned from focus sessions since ${niceDate(dayKey(new Date(B.start)))}.</p></div>
    <div className="panel" style=${{ gap: "12px" }}>
      <h3>Spend it</h3>
      <label className="f" htmlFor="sb-what">On what?<input id="sb-what" value=${what} onInput=${e => setWhat(e.target.value)}/></label>
      <div className="seg" role="group" aria-label="Spend minutes">${[10, 15, 30, 60].map(n => html`<button key=${n} disabled=${n > bal} onClick=${() => { update(x => { x.spends.push({ id: uid(), ts: Date.now(), min: n, what: what.trim() || "Entertainment" }); }); startBreak(n, null); }}>${n} min</button>`)}</div>
      <p className="note">Spending starts a timed break. When it ends, LIFEFLIX calls you back.${bal < 10 ? " Not enough yet: one 25-minute mission tops it up." : ""}</p>
    </div>
    <div className="panel" style=${{ gap: "10px" }}>
      <h3>Honest debit</h3>
      <p className="dim">${coach === "brutal" ? "Watched without earning it? Log it. The balance only works if it's true." : "Slipped into a video without earning it? Log it without guilt. Honest numbers make the system work."}</p>
      <div style=${{ display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap" }}><div className="seg" role="group" aria-label="Unearned minutes">${[15, 30, 60, 120].map(n => html`<button key=${n} aria-pressed=${debit === n} onClick=${() => setDebit(n)}>${n} min</button>`)}</div><button className="btn btn-sm btn-line" onClick=${() => { update(x => { x.spends.push({ id: uid(), ts: Date.now(), min: debit, what: "Unearned", debit: true }); }); flash("Logged honestly", debit + " min debited"); }}>Log it</button></div>
    </div>
    ${recent.length ? html`<div className="panel"><h3>Recent</h3><ul className="list">${recent.map(x => html`<li key=${x.id}><span>${x.debit ? "Unearned · " : ""}${x.what}</span><span>−${x.min} min · ${niceDate(dayKey(new Date(x.ts)))}</span></li>`)}</ul></div>` : null}
  <//>`;
}

function StopSkill({ prio, openBrief }) {
  const S = [["S", "Stop", "Freeze whatever you're doing. Hands off the phone."], ["T", "Take a breath", "One slow breath in through your nose, and a longer one out."], ["O", "Observe", "What's happening? A thought, a feeling, an urge to escape? Name it: \"I'm noticing the urge to open YouTube.\""], ["P", "Proceed", "Choose on purpose: what's the one thing that matters right now?"]];
  const [i, setI] = useState(0); const [one, setOne] = useState("");
  const st = S[i];
  return html`<div className="panel" style=${{ gap: "16px", textAlign: "center" }}>
    <div className="steps">${S.map((_, k) => html`<i key=${k} className=${k <= i ? "on" : ""}></i>`)}</div>
    <div style=${{ fontFamily: "var(--display)", fontWeight: 900, fontSize: "96px", lineHeight: 1, color: "var(--tungsten)" }}>${st[0]}</div>
    <h3 style=${{ fontSize: "30px" }}>${st[1]}</h3>
    <p style=${{ fontSize: "17px" }}>${st[2]}</p>
    ${i < 3 ? html`<${TimerBlock} key=${i} sec=${15} autoStart=${true}/>` : html`<input id="stop-one" value=${one} onInput=${e => setOne(e.target.value)} placeholder="The one thing" aria-label="The one thing that matters right now"/>`}
    <div className="btn-row" style=${{ justifyContent: "center" }}>${i < 3 ? html`<button className="btn btn-amber" onClick=${() => setI(i + 1)}>Next</button>` : html`${prio ? html`<button className="btn btn-amber" onClick=${() => openBrief(one.trim() ? { id: uid(), season: 1, title: one.trim().slice(0, 70), desc: "Chosen on purpose after a STOP pause.", minutes: 10, difficulty: "Medium", attr: "courage", tags: ["other"], firstStep: one.trim(), deliverable: "", repeat: false, status: "active" } : prio, { minutes: 10 })}>▶ Do it: 10 minutes</button>` : null}<button className="btn btn-line" onClick=${() => { setI(0); setOne(""); }}>Again</button>`}</div>
  </div>`;
}

function ParkedInbox({ s, update, openBrief, flash }) {
  const now = Date.now();
  const inbox = s.parked.filter(x => x.status === "inbox").sort((a, b) => a.ts - b.ts);
  const cooling = s.parked.filter(x => x.status === "cooling").sort((a, b) => a.until - b.until);
  const setSt = (id, st, extra) => update(n => { const x = n.parked.find(y => y.id === id); if (x) Object.assign(x, { status: st }, extra || {}); });
  const toMission = x => { const m = { id: uid(), season: 1, title: x.text.slice(0, 70), desc: "From a thought you parked during a mission.", minutes: 10, difficulty: "Medium", attr: "discipline", tags: ["other"], firstStep: "", deliverable: "", repeat: false, status: "active" }; update(n => { n.missions.push(Object.assign(m, { order: n.missions.length + 100, createdAt: Date.now() })); const y = n.parked.find(z => z.id === x.id); if (y) y.status = "mission"; }); flash("Added as an episode", x.text.slice(0, 50)); };
  return html`<${React.Fragment}>
    <div className="panel" style=${{ gap: "10px" }}>
      <h3>Inbox · ${inbox.length}</h3>
      ${inbox.length ? inbox.map(x => html`<div key=${x.id} className="slot" style=${{ gridTemplateColumns: "1fr" }}><div className="ti">${x.text}</div><div className="note">${niceDate(dayKey(new Date(x.ts)))}</div>
        <div className="acts" style=${{ justifyContent: "flex-start" }}>
          <button className="btn btn-sm btn-amber" onClick=${() => toMission(x)}>Make it a task</button>
          <button className="btn btn-sm btn-line" onClick=${() => setSt(x.id, "cooling", { until: now + 7 * 86400000 })}>New idea: cool off 7 days</button>
          <button className="btn btn-sm btn-line" onClick=${() => setSt(x.id, "done")}>Done or doesn't matter</button>
        </div></div>`) : html`<p className="dim">Empty. During a mission, type stray thoughts into the box under the timer instead of acting on them.</p>`}
    </div>
    ${cooling.length ? html`<div className="panel" style=${{ gap: "10px" }}>
      <h3>Ideas cooling off</h3>
      <p className="dim">No research until the date shown. If it still excites you then, it has to beat your current priorities, not just be new.</p>
      ${cooling.map(x => { const ready = now >= x.until; return html`<div key=${x.id} className="slot" style=${{ gridTemplateColumns: "1fr" }}><div className="ti">${x.text}</div><div className="note">${ready ? "Cooling-off finished." : "Research allowed from " + niceDate(dayKey(new Date(x.until))) + "."}</div>
        ${ready ? html`<div className="acts" style=${{ justifyContent: "flex-start" }}><button className="btn btn-sm btn-line" onClick=${() => toMission(x)}>Still worth it: make it a task</button><button className="btn btn-sm btn-line" onClick=${() => setSt(x.id, "done")}>Let it go</button></div>` : null}</div>`; })}
    </div>` : null}
  <//>`;
}
